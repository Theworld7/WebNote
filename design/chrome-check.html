<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>窗口 chrome 自检</title>
<style>
  body { font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 24px; color: #1c1c1e; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  /* 给 chrome 一个明确的宽度：它内部有 flex-1 的拖拽空白，宽度由父级决定，
     探针不该让浏览器视口宽度混进断言。 */
  #app { width: 1000px; margin: 0 0 16px; }
  pre { margin: 0; padding: 14px; background: #f6f6f7; border-radius: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>窗口 chrome：标题栏（品牌 / 动作 / 文档信息）与独立的标签行</h1>
<!-- ADR-0024 把 chrome 并成一条，ADR-0029 又把标签拆了出去：标签不带拖拽属性，
     留在标题栏中段就等于挖掉唯一能拖窗口的地方。
     抓结果：node design/cdp-dump.mjs http://localhost:1420/design/chrome-check.html -->
<div id="app"></div>
<pre id="out">running…</pre>
<script type="module">
import { createApp, defineComponent, h, nextTick } from "vue"
import "../src/style.css"
import { TooltipProvider } from "../src/components/ui/tooltip/index.ts"
import TitleBar from "../src/components/TitleBar.vue"
import { provideSettings } from "../src/composables/useSettings.ts"
import { provideTheme } from "../src/composables/useTheme.ts"
import { useUpdateCheck } from "../src/composables/useUpdateCheck.ts"
import { provideWorkspace } from "../src/composables/useWorkspace.ts"

const out = document.querySelector("#out")
const lines = []
let passed = 0
let failed = 0

function check(name, ok, detail = "") {
  if (ok) { passed += 1; lines.push(`OK   ${name}`) }
  else { failed += 1; lines.push(`FAIL ${name} —— ${detail}`) }
  out.textContent = lines.join("\n")
}

const EPS = 1

let workspace = null
const Root = defineComponent({
  setup() {
    provideTheme(provideSettings())
    workspace = provideWorkspace()
    return () => h(TooltipProvider, null, { default: () => h(TitleBar, { sidebarCollapsed: false }) })
  },
})
createApp(Root).mount("#app")
await nextTick()

const chrome = () => document.querySelector("header")
const brand = () => chrome()?.querySelector(":scope > span")
const scroller = () => document.querySelector('[class*="overflow-x-auto"]')
/** 标签行：滚动容器所在的那条可拖拽带子。它必须是 header 的兄弟，不是它的后代。 */
const tabRow = () => scroller()?.closest("[data-tauri-drag-region]") ?? null
/** 标题栏中段那段拖拽空白。标签搬走之后它是窗口唯一能拖的地方。 */
const dragSurface = () => chrome()?.querySelector(":scope > [data-tauri-drag-region]") ?? null
/** 「页面样式」那颗按钮。它是唯一入口，任何状态下都不该被挤掉。 */
const styleEntry = () => [...document.querySelectorAll("button")].find((b) => b.textContent?.trim() === "页面样式")
/** 字数那一格：靠 `tabular-nums` 认，不靠位置 —— 文案会变。 */
const charCell = () => chrome()?.querySelector('[class*="tabular-nums"]') ?? null
const box = (el) => (el ? el.getBoundingClientRect() : null)

// ---------- 一、标题栏的体量 ----------

check("标题栏只有一条", document.querySelectorAll("header").length === 1, `共 ${document.querySelectorAll("header").length} 条`)
check("标题栏高度是 44px", box(chrome())?.height === 44, `实际 ${box(chrome())?.height ?? "缺失"}`)
check("品牌名在最左端", brand()?.textContent?.trim() === "玉简", brand()?.textContent?.trim() ?? "缺失")

const brandRight = box(brand())?.right ?? 0
const actions = [...(chrome()?.querySelectorAll("button") ?? [])]
check("品牌名在三颗全局动作的左边", actions.length >= 3 && brandRight <= (box(actions[0])?.left ?? 0) + EPS,
  `品牌右缘 ${brandRight.toFixed(1)}，首个动作左缘 ${(box(actions[0])?.left ?? NaN).toFixed(1)}`)

// ---------- 二、无标签时的空态 ----------

workspace.tabs.value = []
workspace.activePath.value = ""
await nextTick()
check("无标签时不渲染滚动容器", scroller() === null)
check("无标签时整条标签行不渲染（chrome 退回 44px）", tabRow() === null)
check("无激活标签时不渲染字数", charCell() === null)
check("无激活标签时不渲染页面样式入口", styleEntry() === undefined)

// ---------- 三、有标签时的落位 ----------

workspace.tabs.value = [{ path: "日记/2026-10-23.html", dirty: false, dirtyTables: [] }]
workspace.activePath.value = "日记/2026-10-23.html"
await nextTick()

const strip = scroller()
check("有标签时挂上滚动容器", strip !== null && strip !== undefined)

// 这一条是整个拆分的理由：标签在标题栏里，窗口就没法从上沿拖。
check(
  "标签不在标题栏里（标题栏里没有标签按钮）",
  chrome()?.querySelector('button[class*="group/tab"]') === null,
  `标题栏里的标签按钮 ${chrome()?.querySelectorAll('button[class*="group/tab"]').length ?? "?"} 个`,
)

const row = tabRow()
const chromeBox = box(chrome())
const rowBox = box(row)
check("标签行是标题栏的兄弟（不在 header 里面）",
  row !== null && row !== undefined && !chrome()?.contains(row),
  row === null ? "标签行缺失" : "标签行在 header 内")
check("标签行高度是 36px", rowBox?.height === 36, `实际 ${rowBox?.height ?? "缺失"}`)
check(
  "标签行贴着标题栏下沿",
  rowBox !== null && chromeBox !== null && Math.abs(rowBox.top - chromeBox.bottom) < EPS,
  rowBox === null || chromeBox === null ? "缺失" : `标签行顶 ${rowBox.top.toFixed(1)} vs 标题栏底 ${chromeBox.bottom.toFixed(1)}`,
)
check("标签行整条是可拖拽区",
  row !== null && row !== undefined && row.hasAttribute("data-tauri-drag-region"),
  row === null ? "标签行缺失" : "标签行没带 data-tauri-drag-region")

const stripBox = box(strip)
check(
  "标签条在标签行里垂直居中（上下各 4px）",
  stripBox !== null && rowBox !== null &&
    Math.abs(stripBox.top - rowBox.top - 4) < EPS &&
    Math.abs(rowBox.bottom - stripBox.bottom - 4) < EPS,
  stripBox === null || rowBox === null ? "缺失" : `上 ${(stripBox.top - rowBox.top).toFixed(1)} 下 ${(rowBox.bottom - stripBox.bottom).toFixed(1)}`,
)
check(
  "标签左缘与品牌左缘对齐（同一条 pl-3）",
  stripBox !== null && Math.abs(stripBox.left - (box(brand())?.left ?? NaN)) < EPS,
  stripBox === null ? "标签条缺失" : `标签 ${stripBox.left.toFixed(1)} vs 品牌 ${(box(brand())?.left ?? NaN).toFixed(1)}`,
)

// ---------- 四、标题栏中段是拖拽面 ----------

const surfaceBox = box(dragSurface())
check("标题栏中段挂着拖拽区", dragSurface() !== null && dragSurface()?.hasAttribute("data-tauri-drag-region") === true)
// 1000px 探针下：品牌 + 三颗动作 + 撤销重做占不到 200px，右端文档信息占不到 200px。
check(
  "拖拽区宽度足够（不小于 300px，标签多寡不影响它）",
  surfaceBox !== null && surfaceBox.width >= 300,
  surfaceBox === null ? "拖拽区缺失" : `实际 ${surfaceBox.width.toFixed(1)}`,
)
const surfaceBefore = surfaceBox?.width ?? NaN
workspace.tabs.value = Array.from({ length: 12 }, (_, i) => ({ path: `第${i}章.html`, dirty: false, dirtyTables: [] }))
workspace.activePath.value = "第11章.html"
await nextTick()
check(
  "标签塞满一整行后拖拽区不变窄",
  Math.abs((box(dragSurface())?.width ?? NaN) - surfaceBefore) < EPS,
  `前 ${surfaceBefore.toFixed(1)} 后 ${(box(dragSurface())?.width ?? NaN).toFixed(1)}`,
)

// ---------- 五、右端文档信息 ----------

workspace.tabs.value = [{ path: "日记/2026-10-23.html", dirty: false, dirtyTables: [] }]
workspace.activePath.value = "日记/2026-10-23.html"
await nextTick()

check("有激活标签时出现字数", charCell() !== null)
check("有激活标签时出现页面样式入口", styleEntry() !== undefined)

// 字数每敲一字都变：定宽 + 等宽数字，变化不许推着右边的页面样式按钮走。
// 量计算样式而不是 rect：窄视口下这一格整格隐藏（`max-[820px]:hidden`），rect 会是 0，
// 但定宽本身仍然写在样式里 —— 断言要看的是「有没有钉住宽度」。
const cellStyle = charCell() ? getComputedStyle(charCell()) : null
check("字数格定宽 52px", cellStyle?.width === "52px", `实际 ${cellStyle?.width ?? "缺失"}`)
check(
  "字数是等宽数字（tabular-nums）",
  (charCell()?.className ?? "").includes("tabular-nums"),
  charCell()?.className ?? "缺失",
)

const styleLeftBefore = box(styleEntry())?.left ?? NaN
workspace.tabs.value = [{ path: "日记/2026-10-23.html", dirty: true, dirtyTables: [] }]
await nextTick()
check(
  "标签变脏（长出一个保存图标）后页面样式入口不挪位",
  Math.abs((box(styleEntry())?.left ?? NaN) - styleLeftBefore) < EPS,
  `前 ${styleLeftBefore.toFixed(1)} 后 ${(box(styleEntry())?.left ?? NaN).toFixed(1)}`,
)

// ---------- 六、没有窗口按钮 ----------

check("浏览器里不画窗口三键（没有最小化 / 关闭）",
  document.querySelector('button[aria-label="关闭"]') === null &&
    document.querySelector('button[aria-label="最小化"]') === null)

// ---------- 七、新版本提示 ----------

const updateButton = () => [...document.querySelectorAll("button")].find((b) => b.textContent?.includes("新版本"))
const redoButton = () => document.querySelector('button[aria-label="重做"]')

// 没有更新时它不该占位：chrome 上常驻一颗「已是最新」的按钮是最没用的那类像素。
check("没有检测到新版本时不长按钮", updateButton() === undefined, updateButton()?.textContent ?? "")

// 网络是这块里唯一的外部输入，打桩的就它一处；版本号由 `__APP_VERSION__` 决定，
// 所以这里塞一个远高过它的 tag —— 比的是真的那套比较逻辑。
const realFetch = window.fetch
window.fetch = async () =>
  new Response(JSON.stringify({ tag_name: "v9.9.9", html_url: "https://github.com/Theworld7/WebNote/releases/tag/v9.9.9" }), { status: 200 })
await useUpdateCheck().check()
await nextTick()
window.fetch = realFetch

const update = updateButton()
const redo = redoButton()
check("检测到新版本后长出一颗「新版本」按钮", update !== undefined)
check("它挂在撤销重做这一簇的右端（在重做右边，不是右端的文档信息区）",
  update !== undefined && (box(update)?.left ?? NaN) > (box(redo)?.right ?? NaN) - EPS,
  update === undefined ? "按钮缺失" : `按钮左缘 ${(box(update)?.left ?? NaN).toFixed(1)} vs 重做右缘 ${(box(redo)?.right ?? NaN).toFixed(1)}`)
check("它与撤销重做同一行（垂直居中）",
  update !== undefined && Math.abs((box(update)?.top ?? NaN) + (box(update)?.height ?? 0) / 2 - ((box(redo)?.top ?? NaN) + (box(redo)?.height ?? 0) / 2)) < EPS,
  update === undefined ? "按钮缺失" : `按钮中线 ${((box(update)?.top ?? NaN) + (box(update)?.height ?? 0) / 2).toFixed(1)}`,
)

lines.push(`自检 ${passed}/${passed + failed}`)
out.textContent = lines.join("\n")
</script>
</body>
</html>
