<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>代码块 Monaco 编辑自检</title>
<style>
  body { font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 24px; color: #1c1c1e; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  #app { margin: 0 0 16px; }
  pre { margin: 0; padding: 14px; background: #f6f6f7; border-radius: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>代码块：按钮进编辑、失焦提交、语言下拉、格式化、同一时刻只有一个 Monaco</h1>
<!-- 顶层 await（真实读盘 + Monaco 加载）：node design/cdp-dump.mjs http://localhost:1420/design/code-edit-check.html -->
<div id="app"></div>
<pre id="out">running…</pre>
<script type="module">
import "../src/style.css"
import { createApp, defineComponent, h, nextTick } from "vue"
import { TooltipProvider } from "../src/components/ui/tooltip/index.ts"
import BlockEditor from "../src/components/BlockEditor.vue"
import { provideSettings } from "../src/composables/useSettings.ts"
import { provideTheme } from "../src/composables/useTheme.ts"
import { provideWorkspace } from "../src/composables/useWorkspace.ts"
import { runsText } from "../src/lib/inline.ts"
import { activeCodeEditor } from "@/lib/monaco-code"


const out = document.querySelector("#out")
window.addEventListener("error", (event) => { out.textContent = "ERROR " + event.message; })
window.addEventListener("unhandledrejection", (event) => { out.textContent = "REJECT " + String(event.reason && event.reason.stack ? event.reason.stack : event.reason); })
const lines = []
let passed = 0
let failed = 0
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

function check(name, ok, detail = "") {
  if (ok) { passed += 1; lines.push(`OK   ${name}`) }
  else { failed += 1; lines.push(`FAIL ${name} —— ${detail}`) }
  out.textContent = lines.join("\n")
}

const opfs = await navigator.storage.getDirectory()
const dir = await opfs.getDirectoryHandle("code-edit-check", { create: true })
const file = await dir.getFileHandle("a.html", { create: true })
const writable = await file.createWritable()
await writable.write("<!DOCTYPE html><html><body><p>占位</p></body></html>")
await writable.close()
window.showDirectoryPicker = async () => dir

let workspace = null
let settings = null
const Root = defineComponent({
  setup() {
    workspace = provideWorkspace()
    settings = provideSettings()
    provideTheme(settings)
    return () => h(TooltipProvider, null, { default: () => h(BlockEditor) })
  },
})
createApp(Root).mount("#app")
await nextTick()
await workspace.bootstrap()
await workspace.openRoot()
await nextTick()

const note = workspace.tree.value.find((node) => node.kind === "note")
workspace.openFile(note.id)
for (let i = 0; i < 80 && workspace.activeDocument.value.length < 1; i += 1) await sleep(50)
await nextTick()

const editors = () => [...document.querySelectorAll(".monaco-editor")]
const row = (id) => document.querySelector(`[data-block-id="${id}"]`)

/** 等某个条件成立（Monaco 加载 / 挂载是异步的）。 */
async function until(predicate, timeout = 8000) {
  const started = Date.now()
  while (Date.now() - started < timeout) {
    if (predicate()) return true
    await sleep(50)
  }
  return false
}

// ---------- 一、空代码块插入即进编辑态 ----------

const id = workspace.appendBlock("code")
await nextTick()
const codeBlock = () => workspace.activeDocument.value.find((block) => block.type === "code")

check("插入空的 code 块", codeBlock() !== undefined && codeBlock().id === id, JSON.stringify(codeBlock()))
const hasMonaco = await until(() => row(id)?.querySelector(".monaco-editor") != null)
check("空块自动进入编辑态（Monaco 已挂上）", hasMonaco, row(id)?.outerHTML.slice(0, 160) ?? "行不存在")
check("同时只有一个 Monaco 实例", editors().length === 1, `实例数 ${editors().length}`)
check("编辑态有语言下拉", row(id)?.querySelector("select") !== null, "")
check("编辑态有「完成」按钮", [...(row(id)?.querySelectorAll("button") ?? [])].some((b) => b.textContent?.includes("完成")), "")

// ---------- 二、失焦提交 ----------

/**
 * Monaco 的可见行文本。自检页拿不到编辑器句柄（模块在 dev 下可能不止一份实例），
 * 一切断言都从 DOM 读 —— 反正用户看到的也是 DOM。
 */
function viewText() {
  return [...document.querySelectorAll(".monaco-editor .view-line")].map((line) => line.textContent ?? "").join("\n")
}

/**
 * 输入靠外部 CDP 驱动（`node design/cdp-type.mjs <url>?drive=1 "文本"`）。
 *
 * Monaco 不认 `execCommand` / 合成 paste / 手工派发的 input：它自己判断
 * activeElement、composition 与 beforeinput，合成事件一律被忽略。真实按键是唯一
 * 能走完整输入管线的路径，所以这里把「聚焦 → 等外部打字 → 失焦」拆成握手：
 * 页面写 `READY`，驱动打完之后置 `window.__typed = true`。
 */
const textarea = document.querySelector(".monaco-editor textarea")
const drive = new URLSearchParams(location.search).get("drive") === "1"
if (drive) {
  // 值走编辑器自己的 API 写（headless 里没有真实的 IME/键盘通道），
  // 「失焦」交给 CDP 点页面空白处触发 —— 那是浏览器层面的事件，Monaco 认。
  activeCodeEditor()?.editor.setValue("const a = 1")
  activeCodeEditor()?.editor.focus()
  out.textContent = "READY"
  for (let i = 0; i < 400 && window.__typed !== true; i += 1) await sleep(50)
  textarea?.blur()
  await sleep(300)
}

check("失焦后写回 runs", runsText(codeBlock().runs) === "const a = 1", JSON.stringify(runsText(codeBlock().runs)))
check("退出编辑态（实例已销毁）", editors().length === 0, `实例数 ${editors().length}`)
const staticLayer = row(id)?.querySelector('[data-block-type="code"]')
check("静态层挂 data-block-type=code", staticLayer !== null, "")
check("静态层有高亮产物", (staticLayer?.innerHTML ?? "").includes("const"), staticLayer?.innerHTML.slice(0, 120) ?? "")

// ---------- 三、重新进入，值回填；语言下拉落盘 ----------

const editButton = [...(row(id)?.querySelectorAll("button") ?? [])].find((b) => b.title === "编辑")
editButton?.click()
const reopened = await until(() => editors().length === 1)
check("点「编辑」重新进入", reopened, `实例数 ${editors().length}`)
check("值回填", viewText().replace(/\u00a0/g, " ") === "const a = 1", JSON.stringify(viewText()))

const select = row(id)?.querySelector("select")
if (select !== null && select !== undefined) {
  select.value = "javascript"
  select.dispatchEvent(new Event("change", { bubbles: true }))
}
await nextTick()
await sleep(80)
check("语言下拉写进 block.lang", codeBlock().lang === "javascript", String(codeBlock().lang))

// ---------- 四、「完成」收工 ----------

const doneButton = [...(row(id)?.querySelectorAll("button") ?? [])].find((b) => b.textContent?.includes("完成"))
doneButton?.click()
await sleep(200)
check("点「完成」退回静态态", editors().length === 0, `实例数 ${editors().length}`)
check("正文没被改动", runsText(codeBlock().runs) === "const a = 1", JSON.stringify(runsText(codeBlock().runs)))

// ---------- 五、有内容的块打开时不自动建实例 ----------

const second = workspace.appendBlock("code")
workspace.setBlockRuns(second, [{ text: "body { color: red }", marks: [] }])
await nextTick()
await sleep(300)
check("有内容的块不自动进编辑态", editors().length === 0, `实例数 ${editors().length}`)
check("有内容的块显示静态高亮", (row(second)?.querySelector('[data-block-type="code"]')?.innerHTML ?? "").includes("color"), "")

// ---------- 六、两种状态的排版一致（同一段文字，同一个起点与宽度） ----------

workspace.setBlockRuns(second, [{ text: "const a = 1", marks: [] }])
await nextTick()
await sleep(120)
const staticStyle = row(second)?.querySelector('[data-block-type="code"]')

/**
 * 元素里那段文字的排版宽度。
 *
 * 不能用 `getBoundingClientRect().width`：Monaco 的 `.view-line` 是个撑满可用宽度
 * 的行盒，量出来永远等于内容区宽；要用 Range 框住里面的文字节点。
 */
function textWidth(el) {
  if (el === null || el === undefined) return -1
  const range = document.createRange()
  range.selectNodeContents(el)
  return range.getBoundingClientRect().width
}

/** 文字相对视口的起点。静态层要跳过自身内边距，所以用 Range 而不是块盒。 */
function textLeft(el) {
  if (el === null || el === undefined) return -1
  const range = document.createRange()
  range.selectNodeContents(el)
  return range.getBoundingClientRect().x
}

// **必须在点击之前快照**：进入编辑态后静态层从文档里摘掉，`getComputedStyle` 返回的
// live 对象会当场变空（值全是空串 / 0）。
const staticSnapshot = {
  left: textLeft(staticStyle),
  width: textWidth(staticStyle),
  height: staticStyle === null || staticStyle === undefined ? -1 : staticStyle.getBoundingClientRect().height,
  font: staticStyle === null || staticStyle === undefined ? "" : getComputedStyle(staticStyle).fontFamily,
  size: staticStyle === null || staticStyle === undefined ? "" : getComputedStyle(staticStyle).fontSize,
}

const editButton2 = [...(row(second)?.querySelectorAll("button") ?? [])].find((b) => b.title === "编辑")
editButton2?.click()
await until(() => editors().length === 1)
await sleep(250)
const line = document.querySelector(".monaco-code-host .view-line")
const lineStyle = line === null || line === undefined ? null : getComputedStyle(line)

check(
  "文字起点一致（左右内边距）",
  Math.abs((line === null || line === undefined ? -100 : textLeft(line)) - staticSnapshot.left) < 1.5,
  `静态 ${Math.round(staticSnapshot.left)} / 编辑 ${Math.round(line === null || line === undefined ? -1 : textLeft(line))}`,
)
check(
  "文字宽度一致（同字体同字号）",
  Math.abs(textWidth(line) - staticSnapshot.width) < 1.5,
  `静态 ${Math.round(staticSnapshot.width * 10) / 10} / 编辑 ${Math.round(textWidth(line) * 10) / 10}`,
)
// Monaco 拿到 `…, monospace` 这样的栈时会在尾部接上自己的 fallback（Consolas 等），
// 字符串因此不完全相等 —— 但栈是同一条，前面几项决定实际字形。宽度断言已经覆盖了
// 「字形是不是同一个」，这里只守「栈同源」。
check(
  "字体栈同源",
  lineStyle?.fontSize === staticSnapshot.size && (lineStyle?.fontFamily ?? "").startsWith(staticSnapshot.font),
  `静态 ${staticSnapshot.font} ${staticSnapshot.size} / 编辑 ${lineStyle?.fontFamily} ${lineStyle?.fontSize}`,
)
const hostBox = document.querySelector(".monaco-code-host")?.getBoundingClientRect()
check(
  "块高一致（工具条不占流）",
  Math.abs((hostBox?.height ?? -100) - staticSnapshot.height) < 1.5,
  `静态 ${Math.round(staticSnapshot.height * 10) / 10} / 编辑 ${Math.round((hostBox?.height ?? -1) * 10) / 10}`,
)
check("编辑态没有折叠箭头与缩进线", document.querySelector(".monaco-code-host .folding") === null, "")

// ---------- 七、点工具条不算失焦 ----------

const toolSelect = row(second)?.querySelector("select")
toolSelect?.focus()
await sleep(200)
check("点语言下拉不退出编辑态", editors().length === 1, `实例数 ${editors().length}`)
check("焦点确实移到了下拉上", document.activeElement === toolSelect, String(document.activeElement?.tagName))

if (toolSelect !== null && toolSelect !== undefined) {
  toolSelect.value = "css"
  toolSelect.dispatchEvent(new Event("change", { bubbles: true }))
}
await sleep(200)
check("改完语言仍在编辑态", editors().length === 1, `实例数 ${editors().length}`)
check(
  "语言写进第二个块",
  workspace.activeDocument.value.find((block) => block.id === second)?.lang === "css",
  String(workspace.activeDocument.value.find((block) => block.id === second)?.lang),
)
check("没有因此落下半截提交", runsText(workspace.activeDocument.value.find((block) => block.id === second)?.runs ?? []) === "const a = 1", "")

// ---------- 八、格式化：按钮按语言开关，排版只动缓冲区 ----------

/** 工具栏里那个按钮。文案在「格式化 / 格式化中… / 无法格式化」之间变，所以按关键字找。 */
const formatButton = () => [...(row(second)?.querySelectorAll("button") ?? [])].find((b) => /格式化/.test(b.textContent ?? ""))
const blockOf = (id) => workspace.activeDocument.value.find((block) => block.id === id)

check("编辑态有「格式化」按钮", formatButton() !== undefined, "")
check("有格式化器的语言按钮可点（css）", formatButton()?.disabled === false, String(formatButton()?.disabled))

toolSelect.value = "python"
toolSelect.dispatchEvent(new Event("change", { bubbles: true }))
await sleep(150)
check("python 的格式化按钮置灰", formatButton()?.disabled === true, String(formatButton()?.disabled))
check(
  "置灰的按钮说明了原因",
  (formatButton()?.getAttribute("title") ?? "").includes("暂无格式化器"),
  String(formatButton()?.getAttribute("title")),
)

toolSelect.value = "javascript"
toolSelect.dispatchEvent(new Event("change", { bubbles: true }))
await sleep(150)
check("javascript 的格式化按钮可点", formatButton()?.disabled === false, String(formatButton()?.disabled))

// 一段没排过版的代码：赋值挤在一起、对象字面量塞一行。
activeCodeEditor()?.editor.setValue("const a=1\nconst b={x:1,y:2}")
await sleep(150)
formatButton()?.click()
const formattingDone = await until(() => viewText().replace(/\u00a0/g, " ").includes("const a = 1;"), 8000)
const formattedView = viewText().replace(/\u00a0/g, " ")
check("点「格式化」把缓冲区的代码排开", formattingDone && formattedView.includes("{ x: 1, y: 2 }"), JSON.stringify(formattedView))
check("格式化还没写进块（要等提交）", runsText(blockOf(second)?.runs ?? []) === "const a = 1", JSON.stringify(runsText(blockOf(second)?.runs ?? [])))

// ---------- 九、格式化结果跟着提交落盘 ----------

const doneButton2 = [...(row(second)?.querySelectorAll("button") ?? [])].find((b) => b.textContent?.includes("完成"))
doneButton2?.click()
await sleep(250)
check("退出编辑态", editors().length === 0, `实例数 ${editors().length}`)
check(
  "完成后格式化结果落盘",
  runsText(blockOf(second)?.runs ?? []).includes("const a = 1;") && runsText(blockOf(second)?.runs ?? "").includes("{ x: 1, y: 2 }"),
  JSON.stringify(runsText(blockOf(second)?.runs ?? [])),
)

// ---------- 十、静态高亮：两套外观下都要读得出来 ----------

/**
 * 静态层是「着色 span + 未着色正文」拼起来的：hljs 认得的 token 有颜色，认不得的
 * （CSS 里的 `transparent` / `deepPink` / `top left` 这类关键字）**原样继承块正文色**。
 * 所以「读不出来」有两种来源，两边都要量：
 *
 * 1. 块正文色 —— 曾经写死成 `oklch(0.3 0 0)`，深色下压在 `oklch(0.33)` 的块底上，
 *    对比度 1.2:1，整段关键字凭空消失（这就是那张截图）；
 * 2. token 色 —— 曾经整包引 `github.css`（只有浅色一套），深色下 1.1~2.0。
 *
 * 判据用 WCAG 对比度（正文级 4.5）。浅色那套是 GitHub 自己的取值，`variable`
 * 只有 2.85 —— 不趁这次顺手改观感，只把下限守在 2.8，深色则要求 4.5。
 */
const sample = `.demo {
  background:
    linear-gradient(135deg, transparent 15px, deepPink 0),
    linear-gradient(45deg, transparent 15px, deepPink 0);
  background-size: 50% 50%;
  background-position: top left;
  background-repeat: no-repeat;
}`
const themed = workspace.appendBlock("code")
workspace.setBlockRuns(themed, [{ text: sample, marks: [] }])
workspace.setBlockLang(themed, "css")
await nextTick()
await sleep(200)

const staticOf = (id) => row(id)?.querySelector('[data-block-type="code"]') ?? null

const lin = (c) => { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4 }
/**
 * 任何 CSS 颜色写法 → sRGB 三元组。
 *
 * 不能正则抠 `computedStyle.color` 里的数字：Chromium 对 `oklch(0.3 0 0)` 这类值
 * **原样保留 oklch 序列化**，抠出来会变成 rgb(0.3, 0, 0) —— 一个近乎全黑且与块底
 * 几乎相同的颜色，量出来的对比度恒为 1.00（假失败）。走 canvas 拿真实字节。
 */
const canvas = document.createElement("canvas")
canvas.width = 1
canvas.height = 1
const ctx = canvas.getContext("2d", { willReadFrequently: true })
function rgbOfText(value) {
  ctx.fillStyle = "#000000"
  ctx.fillStyle = value
  ctx.clearRect(0, 0, 1, 1)
  ctx.fillRect(0, 0, 1, 1)
  const data = ctx.getImageData(0, 0, 1, 1).data
  // canvas 认不出的颜色会落回上一个 fillStyle（纯黑），这里不收那种值。
  return data[3] === 0 ? null : [data[0], data[1], data[2]]
}
function luminance([r, g, b]) {
  const [R, G, B] = [r, g, b].map((v) => lin(v))
  return 0.2126 * R + 0.7152 * G + 0.0722 * B
}
function contrastTo(bg, fg) {
  const [hi, lo] = [luminance(bg), luminance(fg)].sort((x, y) => y - x)
  return (hi + 0.05) / (lo + 0.05)
}

/**
 * 量一遍当前外观：块正文色 + 每个实际出现的 token 类，各自对块底色算对比度。
 *
 * 同一类只取第一个样本 —— 同一门语言里同名 token 必然同色。
 */
function measureHighlight() {
  const layer = staticOf(themed)
  if (layer === null) return null
  const bg = rgbOfText(getComputedStyle(layer).backgroundColor)
  const text = rgbOfText(getComputedStyle(layer).color)
  if (bg === null || text === null) return null
  const tokens = new Map()
  for (const span of layer.querySelectorAll('span[class*="hljs-"]')) {
    const name = (span.getAttribute("class") ?? "").split(/\s+/).find((c) => c.startsWith("hljs-"))
    if (name === undefined || tokens.has(name)) continue
    const fg = rgbOfText(getComputedStyle(span).color)
    if (fg !== null) tokens.set(name, contrastTo(bg, fg))
  }
  return { bg, text: contrastTo(bg, text), tokens }
}

async function setAppearance(appearance) {
  settings.setTheme({ mode: appearance })
  for (let i = 0; i < 60; i += 1) {
    if (document.documentElement.classList.contains("dark") === (appearance === "dark")) break
    await sleep(50)
  }
  await nextTick()
}

async function inAppearance(appearance) {
  await setAppearance(appearance)
  return measureHighlight()
}

const lightM = await inAppearance("light")
const darkM = await inAppearance("dark")
const fmt = (m) => (m === null ? "量不到" : `正文 ${m.text.toFixed(2)}`)
const showTokens = (m) =>
  m === null ? "" : [...m.tokens].map(([k, v]) => `${k.replace("hljs-", "")} ${v.toFixed(2)}`).join(" / ")

check("静态层量得到正文色与 token 色", lightM !== null && darkM !== null && darkM.tokens.size >= 4,
  `${lightM?.tokens.size ?? 0} / ${darkM?.tokens.size ?? 0} 个 token`)
check("样本覆盖了截图里那几类 token（attribute / built_in / number / selector-class）",
  ["hljs-attribute", "hljs-built_in", "hljs-number", "hljs-selector-class"].every((k) => darkM?.tokens.has(k)),
  showTokens(darkM))
check(`浅色：块正文对比度 ≥ 4.5（实测 ${fmt(lightM)}）`, (lightM?.text ?? 0) >= 4.5)
check(`深色：块正文对比度 ≥ 4.5（实测 ${fmt(darkM)}；修复前是 1.20）`, (darkM?.text ?? 0) >= 4.5)
const worstDark = darkM === null ? null : [...darkM.tokens].sort((a, b) => a[1] - b[1])[0] ?? null
check(`深色：每个 token 对比度 ≥ 4.5（最差 ${worstDark === null ? "—" : `${worstDark[0].replace("hljs-", "")} ${worstDark[1].toFixed(2)}`}）`,
  worstDark !== null && worstDark[1] >= 4.5, showTokens(darkM))
const worstLight = lightM === null ? null : [...lightM.tokens].sort((a, b) => a[1] - b[1])[0] ?? null
check(`浅色：token 不低于 GitHub 浅色主题自己的下限（最差 ${worstLight === null ? "—" : `${worstLight[0].replace("hljs-", "")} ${worstLight[1].toFixed(2)}`}）`,
  worstLight !== null && worstLight[1] >= 2.8, showTokens(lightM))
check("深色下 token 不比浅色更难读（逐个对齐）",
  darkM !== null && lightM !== null &&
    [...darkM.tokens].every(([name, value]) => value >= (lightM.tokens.get(name) ?? 0) - 0.15),
  showTokens(darkM))

// ---------- 十一、语言下拉的弹层：深色下不能是白纸 ----------

/**
 * 展开的列表不在 DOM 里（是浏览器画的），量不到，能守的是**它取色的来源**：
 * 弹层的面取 select 自己的背景色、每一行取 option 的显式前景/背景。所以断言是
 * 「聚焦/展开时底色不透明且等于 --popover」「option 有显式色且对比度够」，
 * 外加一条反向的：**静止态仍然透明** —— 数据表 / 看板里的下拉靠这身透明装成单元格
 * 里的一段文字，常驻底色会让那些格子凭空多出一个方块。
 * （`color-scheme: dark` 管不到弹层，实测过：计算值是 dark，弹层照样白。）
 */
const editThemed = [...(row(themed)?.querySelectorAll("button") ?? [])].find((b) => b.title === "编辑")
editThemed?.click()
const selectReady = await until(() => row(themed)?.querySelector("select") != null)
const langSelect = row(themed)?.querySelector("select") ?? null
check("打开编辑态拿到语言下拉", selectReady && langSelect !== null, "")

const sameRgb = (a, b) => a !== null && b !== null && a.every((v, i) => Math.abs(v - b[i]) <= 1)
const show = (rgb) => (rgb === null ? "transparent" : `rgb(${rgb.join(" ")})`)

/**
 * 静止态必须**在聚焦之前**量。整块在 focusout 时会提交并卸掉工具条 ——
 * 先聚焦再 blur 回来，量到的是一个已经脱离文档的 select（取色全是空串）。
 */
async function restingBg(appearance) {
  await setAppearance(appearance)
  return rgbOfText(getComputedStyle(langSelect).backgroundColor)
}

/** 聚焦之后的取色。一次聚焦跨两次外观切换都有效，不用反复 blur / focus。 */
async function focusedColors(appearance) {
  await setAppearance(appearance)
  const root = getComputedStyle(document.documentElement)
  const option = getComputedStyle(langSelect.querySelector("option"))
  return {
    open: rgbOfText(getComputedStyle(langSelect).backgroundColor),
    popover: rgbOfText(root.getPropertyValue("--popover").trim()),
    optionBg: rgbOfText(option.backgroundColor),
    optionFg: rgbOfText(option.color),
    popoverFg: rgbOfText(root.getPropertyValue("--popover-foreground").trim()),
  }
}

if (langSelect !== null) {
  check("浅色：静止态仍是透明底（表格 / 看板里的下拉不变方块）", (await restingBg("light")) === null, "")
  check("深色：静止态仍是透明底（表格 / 看板里的下拉不变方块）", (await restingBg("dark")) === null, "")

  langSelect.focus()
  await sleep(50)
  for (const appearance of ["light", "dark"]) {
    const label = appearance === "dark" ? "深色" : "浅色"
    const r = await focusedColors(appearance)
    check(`${label}：聚焦时底色不透明（弹层不会退回系统白纸）`, r.open !== null, show(r.open))
    check(`${label}：聚焦底色取 --popover`, sameRgb(r.open, r.popover), `${show(r.open)} vs ${show(r.popover)}`)
    check(
      `${label}：option 有显式底色与前景`,
      r.optionBg !== null && sameRgb(r.optionFg, r.popoverFg),
      `bg ${show(r.optionBg)} / fg ${show(r.optionFg)} vs ${show(r.popoverFg)}`,
    )
    const optionContrast = r.optionBg === null || r.optionFg === null ? 0 : contrastTo(r.optionBg, r.optionFg)
    check(`${label}：弹层文字对比度 ≥ 4.5（实测 ${optionContrast.toFixed(2)}）`, optionContrast >= 4.5)
  }
  // 收工：后面的截图与收尾都按静态态来（不 blur —— 那会触发整块提交）。
  const doneThemed = [...(row(themed)?.querySelectorAll("button") ?? [])].find((b) => b.textContent?.includes("完成"))
  doneThemed?.click()
  await sleep(200)
}

// 切回浅色收尾：默认外观。想直观看深色下的观感，加 `?theme=dark` 保持深色（截图用）。
await inAppearance("light")
if (new URLSearchParams(location.search).get("theme") === "dark") await inAppearance("dark")


lines.push("")
lines.push(`通过 ${passed} / ${passed + failed}`)
out.textContent = lines.join("\n")
</script>
</body>
</html>
