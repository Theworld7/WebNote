<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>右键菜单自检</title>
<style>
  body { font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 24px; color: #1c1c1e; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  #app { display: flex; height: 360px; margin-bottom: 16px; }
  .monaco-editor { height: 40px; background: #eee; }
  pre { margin: 0; padding: 14px; background: #f6f6f7; border-radius: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>右键菜单：网页菜单被吃掉、树行与标签给同一份文件菜单</h1>
<div id="app"></div>
<div class="monaco-editor" id="fake-monaco">（假装这里是 Monaco）</div>
<pre id="out">running…</pre>
<script type="module">
import { createApp, defineComponent, h, nextTick } from "vue"
// 必须引应用样式表：菜单项的几何与底色都由 Tailwind 类决定。
import "../src/style.css"
import { TooltipProvider } from "../src/components/ui/tooltip/index.ts"
import AppSidebar from "../src/components/AppSidebar.vue"
import EditorTab from "../src/components/EditorTab.vue"
import { provideWorkspace } from "../src/composables/useWorkspace.ts"
import { suppressPageContextMenu } from "../src/lib/dom.ts"
import { textToRuns } from "../src/lib/inline.ts"
import { LONG_PRESS_MS } from "../src/lib/touch.ts"
import { createMemoryFs } from "./memory-fs.ts"

const out = document.querySelector("#out")
const lines = []
let passed = 0
let failed = 0

addEventListener("error", (event) => {
  out.textContent = `ERROR ${event.message}\n${lines.join("\n")}`
})
addEventListener("unhandledrejection", (event) => {
  const reason = event.reason
  out.textContent = `REJECT ${reason instanceof Error ? reason.stack ?? reason.message : String(reason)}\n${lines.join("\n")}`
})

function check(name, ok, detail = "") {
  if (ok) { passed += 1; lines.push(`OK   ${name}`) }
  else { failed += 1; lines.push(`FAIL ${name} —— ${detail}`) }
  out.textContent = lines.join("\n")
}

/** 等 Vue 与 reka 的浮层落地：菜单是 nextTick 之后才挂进 portal 的。 */
async function settle() {
  for (let i = 0; i < 4; i += 1) {
    await nextTick()
    await new Promise((resolve) => setTimeout(resolve, 20))
  }
}

// ---- 一、网页自己的右键菜单被吃掉（Monaco 例外） ----

/** 从元素上真派发一次右键，再让应用那个处理函数跑一遍 —— 它靠 `event.target` 判断。 */
function contextMenuOn(element) {
  const event = new MouseEvent("contextmenu", { bubbles: true, cancelable: true, button: 2 })
  element.dispatchEvent(event)
  suppressPageContextMenu(event)
  return event
}

const plain = document.createElement("div")
document.body.append(plain)
check("普通区域：右键被 preventDefault", contextMenuOn(plain).defaultPrevented)

const monaco = document.querySelector("#fake-monaco")
check("Monaco 里不拦（编辑器自己的菜单要用）", contextMenuOn(monaco).defaultPrevented === false)

// ---- 二、真实侧栏 + 内存 driver ----

let workspace = null
const Root = defineComponent({
  setup() {
    workspace = provideWorkspace()
    return () =>
      h(TooltipProvider, null, {
        default: () => [
          h(AppSidebar, { width: 260 }),
          h(EditorTab, {
            tab: { path: "笔记 / 第一篇.html", dirty: false },
            active: true,
            unsaved: false,
            saving: false,
          }),
          // 第二颗标签是「关闭左侧」那一条的锚点：只挂一颗的话，它左边永远没有邻居。
          h(EditorTab, {
            tab: { path: "笔记 / 第三篇.html", dirty: false },
            active: false,
            unsaved: false,
            saving: false,
          }),
        ],
      })
  },
})

const memory = createMemoryFs()
createApp(Root).mount("#app")
await nextTick()
await workspace.attachForTest(memory.fs, { kind: "path", path: "/stub" })
await nextTick()

workspace.dismissError()
await workspace.createFolderIn("", "笔记")
await workspace.createNoteIn("笔记", "第一篇")
await workspace.createNoteIn("笔记", "第二篇")
await settle()

function treeRow(name) {
  return [...document.querySelectorAll("[data-tree-path]")].find((el) => el.textContent.includes(name)) ?? null
}

/** 派一次真实右键。reka 的 trigger 只认 DOM 事件，构造函数的合成事件同样是 DOM 事件。 */
function rightClick(element) {
  const rect = element.getBoundingClientRect()
  return element.dispatchEvent(
    new MouseEvent("contextmenu", {
      bubbles: true,
      cancelable: true,
      button: 2,
      buttons: 2,
      clientX: Math.round(rect.left + 12),
      clientY: Math.round(rect.top + 8),
    }),
  )
}

function menuItems() {
  const menu = document.querySelector('[data-slot="context-menu-content"]')
  if (menu === null) return []
  return [...menu.querySelectorAll('[data-slot="context-menu-item"]')].map((item) => item.textContent.trim())
}

const fileRow = treeRow("第一篇")
check("树上有文件行", fileRow !== null)
rightClick(fileRow)
await settle()
const fileItems = menuItems()
check("右键文件行弹出菜单", fileItems.length > 0, JSON.stringify(fileItems))
check("菜单里是文件那一套动作（重命名 / 删除）",
  fileItems.includes("重命名") && fileItems.includes("删除"), JSON.stringify(fileItems))
check("桌面端才有的动作也在（复制路径 / 在文件管理器里定位）",
  fileItems.includes("复制路径") && fileItems.includes("打开所在位置"), JSON.stringify(fileItems))

// 点菜单项走的是真对话框：重命名那一路在 AppSidebar 里，两处入口共用 `useTreeDialogs`。
// 菜单项的选择走 reka 的 `click`（MenuItemImpl 的 onClick = handleSelect），不是 pointer 序列。
const renameItem = [...document.querySelectorAll('[data-slot="context-menu-item"]')]
  .find((item) => item.textContent.trim() === "重命名")
check("菜单里点得到「重命名」", renameItem !== undefined)
renameItem?.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }))
await settle()
// 重命名框是 AlertDialog（确认性动作），角色是 alertdialog 而不是 dialog。
const renameDialog = document.querySelector('[role="alertdialog"]')
check("点「重命名」打的是侧栏那颗真对话框", renameDialog !== null)
check("对话框里带着这个文件名", renameDialog?.textContent.includes("第一篇") === true, renameDialog?.textContent ?? "")
// 关掉：Esc 在 AlertDialog 上是故意不生效的，走「取消」那颗按钮。
const cancelButton = [...(renameDialog?.querySelectorAll("button") ?? [])]
  .find((button) => button.textContent.trim() === "取消")
check("对话框里有「取消」", cancelButton !== undefined)
cancelButton?.click()
await settle()
await settle()
check("「取消」把对话框关掉", document.querySelector('[role="alertdialog"]') === null)

// 左键仍然照常打开文件 —— `as-child` 把两个 trigger 叠在同一行上，别把点击吃掉。
workspace.openFile("笔记 / 第一篇.html")
await settle()
check("左键打开文件不受影响", workspace.activePath.value === "笔记 / 第一篇.html", workspace.activePath.value)

const folderRow = [...document.querySelectorAll('[data-tree-path="笔记"]')][0] ?? null
check("树上有文件夹行", folderRow !== null)
const expandedBefore = workspace.expandedIds.value.has("笔记")
rightClick(folderRow)
await settle()
const folderItems = menuItems()
check("右键文件夹行弹出菜单", folderItems.length > 0, JSON.stringify(folderItems))
check("文件夹菜单是文件夹那一套（导出为 Markdown… / 重命名 / 删除）",
  folderItems.includes("导出为 Markdown…") && folderItems.includes("重命名") && folderItems.includes("删除"),
  JSON.stringify(folderItems))
document.body.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }))
await settle()
await settle()
check("Esc 关掉右键菜单", document.querySelector('[data-slot="context-menu-content"]') === null)

folderRow.click()
await settle()
check("左键文件夹仍然折叠 / 展开", workspace.expandedIds.value.has("笔记") !== expandedBefore,
  `${expandedBefore} → ${workspace.expandedIds.value.has("笔记")}`)

// ---- 三、标签右键给的是同一份文件菜单 ----

/**
 * 标签专有的那三条。它们排在文件那一套之前，所以标签菜单 = 这三条 + 树上的那一套。
 * 用同一份 `FileMenuItems` 渲染，靠 `from-tab` 多出这一截 —— 不是另写一份菜单。
 */
const TAB_ONLY = ["关闭其他", "关闭左侧", "关闭右侧"]

function tabButton(name) {
  return [...document.querySelectorAll("#app button")].find((button) => button.textContent.includes(name) && button.closest("[data-tree-path]") === null)
}

const tab = tabButton("第一篇")
check("页面上有这条标签", tab !== undefined)
if (tab !== undefined) {
  rightClick(tab)
  await settle()
  const tabItems = menuItems()
  check("右键标签弹出菜单", tabItems.length > 0, JSON.stringify(tabItems))
  check("标签菜单 = 三条关闭动作 + 树上那一套",
    JSON.stringify(tabItems) === JSON.stringify([...TAB_ONLY, ...fileItems]),
    `${JSON.stringify(tabItems)} vs ${JSON.stringify([...TAB_ONLY, ...fileItems])}`)
}

// 把这一节的菜单关掉：reka 的菜单内容挂在 portal 上，留着的话下一节读到的还是它 ——
// 后面的「关闭左侧」会拿着第一篇那一条的邻居去算，看着像功能坏了。
document.body.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }))
await settle()

// ---- 三点五、标签专有的三条：灰不灰、关的是哪几颗 ----

/**
 * 三条关闭动作的分工：锚点（右键的那一颗）永远留下，其余按方向 / 「除它之外」关掉。
 * 这里验的是**落点**而不是样式：留哪几颗标签、激活项去哪。灰态只验「没有邻居时灰掉」，
 * 因为没有邻居时点它等于什么都没发生 —— 灰着比点了没反应诚实。
 */
function menuItemByText(text) {
  return [...document.querySelectorAll('[data-slot="context-menu-item"]')].find((item) => item.textContent.trim() === text) ?? null
}
function isDisabled(item) {
  return item === null || item.dataset.disabled !== undefined
}
async function pickMenu(text) {
  const item = menuItemByText(text)
  item?.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }))
  await settle()
}
function tabPaths() {
  return workspace.tabs.value.map((tab) => tab.path)
}
async function openTab(name) {
  workspace.openFile(`笔记 / ${name}.html`)
  await settle()
}

await workspace.createNoteIn("笔记", "第三篇")
await settle()
await openTab("第一篇")
await openTab("第二篇")
await openTab("第三篇")
check("三篇都开着", JSON.stringify(tabPaths()) === JSON.stringify(["笔记 / 第一篇.html", "笔记 / 第二篇.html", "笔记 / 第三篇.html"]), JSON.stringify(tabPaths()))

rightClick(tabButton("第三篇"))
await settle()
check("锚点在最右：关闭右侧灰掉", isDisabled(menuItemByText("关闭右侧")))
check("左边还有标签：关闭左侧可点", !isDisabled(menuItemByText("关闭左侧")))
check("还开着别的：关闭其他可点", !isDisabled(menuItemByText("关闭其他")))
await pickMenu("关闭左侧")
check("关闭左侧只留下锚点", JSON.stringify(tabPaths()) === JSON.stringify(["笔记 / 第三篇.html"]), JSON.stringify(tabPaths()))
check("激活项落到锚点（不留在被关掉的那篇上）", workspace.activePath.value === "笔记 / 第三篇.html", workspace.activePath.value)

await openTab("第一篇")
await openTab("第二篇")
rightClick(tabButton("第三篇"))
await settle()
check("锚点在最左：关闭左侧灰掉", isDisabled(menuItemByText("关闭左侧")))
await pickMenu("关闭右侧")
check("关闭右侧只留下锚点", JSON.stringify(tabPaths()) === JSON.stringify(["笔记 / 第三篇.html"]), JSON.stringify(tabPaths()))

await openTab("第一篇")
rightClick(tabButton("第三篇"))
await settle()
await pickMenu("关闭其他")
check("关闭其他只留下锚点", JSON.stringify(tabPaths()) === JSON.stringify(["笔记 / 第三篇.html"]), JSON.stringify(tabPaths()))

rightClick(tabButton("第三篇"))
await settle()
check("只开着一颗时关闭其他灰掉", isDisabled(menuItemByText("关闭其他")))
document.body.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }))
await settle()

// 脏标签**先存再关**：一次关十几颗却逐个弹「保存吗」是没法用的，静默丢掉修改更不行。
// 这里给第二篇写一句，再「关闭其他」—— 关得掉，而且那句真落到了盘上。
const MARK = "关闭其他之前写下的一句"
await openTab("第二篇")
for (let i = 0; i < 40 && workspace.activeDocument.value.length === 0; i += 1) await settle()
const firstBlock = workspace.activeDocument.value[0]
if (firstBlock !== undefined) workspace.setBlockRuns(firstBlock.id, textToRuns(MARK))
await settle()
check("第二篇已经脏了", workspace.dirtyTabs.value.some((tab) => tab.path === "笔记 / 第二篇.html"),
  JSON.stringify(workspace.dirtyTabs.value.map((tab) => tab.path)))

rightClick(tabButton("第三篇"))
await settle()
await pickMenu("关闭其他")
check("脏标签照样关掉（不弹确认框）", JSON.stringify(tabPaths()) === JSON.stringify(["笔记 / 第三篇.html"]), JSON.stringify(tabPaths()))
const savedNote = memory.read("笔记 / 第二篇.html")
check("关之前先存了盘（文件里带着那句话）", savedNote !== undefined && savedNote.includes(MARK),
  savedNote === undefined ? "（盘上找不到这篇）" : "盘上没有那句话")

// ---- 四、触摸：长按与按压反馈 ----

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

/** 触摸序列。reka 的 trigger 只认 `pointerType !== "mouse"`，合成事件一样走它的长按分支。 */
function touch(element, type, dx = 0, dy = 0) {
  const rect = element.getBoundingClientRect()
  element.dispatchEvent(
    new PointerEvent(type, {
      bubbles: true,
      cancelable: true,
      pointerId: 1,
      pointerType: "touch",
      isPrimary: true,
      clientX: Math.round(rect.left + 12 + dx),
      clientY: Math.round(rect.top + 8 + dy),
    }),
  )
}

workspace.openFile("笔记 / 第二篇.html")
await settle()
// 上一节最后右键了标签，菜单还开着 —— 不清掉的话下面的「还没到点」会读到它的残留。
document.body.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }))
await settle()
await settle()
check("长按前先清掉上一节的菜单", menuItems().length === 0, JSON.stringify(menuItems()))
// 上一节点了文件夹行，折叠态的文件行不在 DOM 里 —— 先摊开。
if (!workspace.expandedIds.value.has("笔记")) {
  document.querySelector('[data-tree-path="笔记"]')?.click()
  await settle()
}
const pressRow = treeRow("第一篇")
check("长按用例拿得到文件行", pressRow !== null)

/** 蓄力时长写在 class 里，按住多久写在 TS 常量里 —— 两处必须同一个数。 */
const holdInClass = Number(pressRow.className.match(/data-\[pressed\]:duration-(\d+)/)?.[1] ?? NaN)
check(
  "按住时长与样式里的蓄力过渡对账",
  holdInClass === LONG_PRESS_MS,
  `class 里 ${holdInClass}ms，常量 ${LONG_PRESS_MS}ms`,
)

/**
 * 按压态是 `usePressHold` 算的，不是 `:active`：触摸端的 `:active` 在可滚动容器里
 * 要等浏览器确认「这不是滚动」才给，实测按住全程都是 false。所以这里钉的是我们自己
 * 的那个属性 —— 按下有、移开就散。
 */
touch(pressRow, "pointerdown")
await sleep(60)
check("按下即进入按压态", pressRow.getAttribute("data-pressed") === "true", pressRow.getAttribute("data-pressed"))
touch(pressRow, "pointermove", 20, 0)
await sleep(60)
check("手指移开（当成滚动）就撤掉按压态", pressRow.getAttribute("data-pressed") === null, pressRow.getAttribute("data-pressed"))

touch(pressRow, "pointerdown")
await sleep(LONG_PRESS_MS - 150)
check(`按住 ${LONG_PRESS_MS - 150}ms：菜单还没到点`, menuItems().length === 0, JSON.stringify(menuItems()))
await sleep(300)
const pressedOpen = menuItems().length > 0
lines.push(`按住 ${LONG_PRESS_MS + 150}ms：菜单 ${pressedOpen ? "已弹出" : "没弹出"}`)
check("到点弹出文件菜单", pressedOpen, JSON.stringify(menuItems()))

/** 菜单开着时整行必须保持深底：用户得知道这份菜单作用于哪一行。 */
await sleep(LONG_PRESS_MS)
check("行上标着 data-state=open", pressRow.getAttribute("data-state") === "open", pressRow.getAttribute("data-state"))
const probe = document.createElement("div")
probe.className = "bg-muted-strong"
document.body.append(probe)
const rowColor = getComputedStyle(pressRow).backgroundColor
const probeColor = getComputedStyle(probe).backgroundColor
probe.remove()
check("菜单开着时整行是 muted-strong", rowColor === probeColor, `${rowColor} vs ${probeColor}`)

touch(pressRow, "pointerup")
await settle()
check(
  "松手不顺手打开文件（长按已被菜单接管）",
  workspace.activePath.value === "笔记 / 第二篇.html",
  `activePath=${workspace.activePath.value}`,
)

/** 标签是另一种底色（激活的用 selection），按住时只压暗一点，不能换成灰底。 */
const tabClass = tab.className
check(
  "标签的蓄力时长与树行同一套",
  tabClass.includes(`data-[pressed]:duration-${LONG_PRESS_MS}`),
  tabClass,
)

lines.push(failed === 0 ? `自检 ${passed}/${passed}` : `自检 ${passed} 过 / ${failed} 败`)
out.textContent = lines.join("\n")
</script>
</body>
</html>
