<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>块拖拽落点自检</title>
<style>
  body { font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 24px; color: #1c1c1e; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  #app { height: 400px; display: flex; flex-direction: column; }
  pre { margin: 0; padding: 14px; background: #f6f6f7; border-radius: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>块拖拽落点自检（合成 DragEvent 走真实 handler）</h1>
<!-- 脚本里有顶层 await（要等真实读盘），--dump-dom 抓不到结果。
     用配套的 CDP 驱动跑：node design/cdp-dump.mjs http://localhost:1420/design/drag-check.html -->
<div id="app"></div>
<pre id="out">running…</pre>
<script type="module">
import "../src/style.css"
import { createApp, defineComponent, h, nextTick } from "vue"
import { TooltipProvider } from "../src/components/ui/tooltip/index.ts"
import BlockEditor from "../src/components/BlockEditor.vue"
import { provideSettings } from "../src/composables/useSettings.ts"
import { provideTheme } from "../src/composables/useTheme.ts"
import { provideWorkspace } from "../src/composables/useWorkspace.ts"
import { blockTypeMeta } from "../src/lib/blocks.ts"

const lines = []
let passed = 0
let failed = 0

// 顶层 await 抛出来只会静默挂住，先把异常贴到 #out 上（连同已跑的断言）。
function report(kind, detail) {
  document.getElementById("out").textContent = [kind, "", detail, "", ...lines].join("\n")
}
window.addEventListener("unhandledrejection", (e) => report("REJECT", e.reason?.stack ?? String(e.reason)))
window.addEventListener("error", (e) => report("ERROR", e.message))

// 卡住时也能看出走到哪一步了（cdp 驱动按 "running" 前缀判断未完成）。
function step(name) {
  document.getElementById("out").textContent = `running: ${name}`
}

function check(name, ok, detail = "") {
  if (ok) { passed += 1; lines.push(`OK   ${name}`) }
  else { failed += 1; lines.push(`FAIL ${name} —— ${detail}`) }
}

step("opfs")
/** OPFS 当工作目录：预置一篇笔记，避开原生目录对话框。 */
const opfs = await navigator.storage.getDirectory()
const dir = await opfs.getDirectoryHandle("drag-probe", { create: true })
const file = await dir.getFileHandle("a.html", { create: true })
const writable = await file.createWritable()
await writable.write("<h1>标题一</h1><p>段落二</p><p>段落三</p><p>段落四</p>")
await writable.close()
window.showDirectoryPicker = async () => dir

step("mount")
let workspace = null
const Root = defineComponent({
  setup() {
    workspace = provideWorkspace()
    // BlockEditor 读内容宽度偏好（useSettings），不 provide 会在 setup 里抛错。
    provideTheme(provideSettings())
    return () => h(TooltipProvider, null, { default: () => h(BlockEditor) })
  },
})
createApp(Root).mount("#app")
await nextTick()

step("bootstrap")
await workspace.bootstrap()
step("openRoot")
await workspace.openRoot()
await nextTick()

const firstFile = (function find(nodes) {
  for (const node of nodes) {
    if (node.kind === "note") return node
    const hit = node.children ? find(node.children) : null
    if (hit) return hit
  }
  return null
})(workspace.tree.value)

check("扫到了预置笔记", firstFile !== null, `tree=${JSON.stringify(workspace.tree.value.map((n) => n.name))}`)
if (firstFile) {
  step("openFile")
  workspace.openFile(firstFile.id)
  // 读盘是真 I/O，microtask 轮询等不到，得给它真实时间。
  for (let i = 0; i < 60 && workspace.activeDocument.value.length < 4; i += 1) {
    await new Promise((resolve) => setTimeout(resolve, 50))
  }
  await nextTick()
}

step("collect")
const root = document.querySelector("[data-block-id]")?.parentElement ?? null
function rows() { return [...document.querySelectorAll("[data-block-id]")] }
function texts() { return workspace.activeDocument.value.map((b) => b.runs.map((r) => r.text).join("")) }
function lined() { return rows().filter((r) => r.className.includes("before:absolute") || r.className.includes("after:absolute")).map((r) => r.dataset.blockId) }

check("文档渲染出 4 个块", rows().length === 4, `实际 ${rows().length}：${JSON.stringify(texts())}`)

// ---- 把手里的类型标识（hover 就能看出在操作什么块）----
// 标识与类型菜单同源（BLOCK_TYPES 的 marker），逐块比对，防两处各写一套。
if (rows().length === 4) {
  // 笔记是 <h1> + 三个 <p>：marker 必须分别是 H1 与 ¶，才说明读的是块类型而不是写死的字。
  const shown = rows().map((row) => row.querySelector("[data-drag-handle] span")?.textContent?.trim() ?? "")
  const expected = rows().map((row) => blockTypeMeta(row.querySelector("[data-block-type]").dataset.blockType).marker)
  check("把手里是各块的 marker", JSON.stringify(shown) === JSON.stringify(expected), `实际 ${JSON.stringify(shown)}，应为 ${JSON.stringify(expected)}`)
  check("首块是标题、其余是正文", shown[0] === "H1" && shown[1] === "¶", JSON.stringify(shown))

  // 把手加宽后右缘仍要停在正文左缘之外 —— 越过去就会压住首字。
  const overlap = rows().map((row) => {
    const grip = row.querySelector("[data-drag-handle]").getBoundingClientRect()
    return grip.right - row.getBoundingClientRect().left
  })
  check("把手右缘不压正文", overlap.every((gap) => gap <= 0), `各块超出 ${JSON.stringify(overlap)}`)
}

// 块数不对就别往下跑：后面每条断言都会因为拿不到行而炸，掩盖掉真原因。
if (rows().length === 4) await run()

lines.push(`自检 ${passed}/${passed + failed}`)
document.getElementById("out").textContent = lines.join("\n")

async function run() {
/** 指针当前位置：松手时拿它当落点（BlockEditor 也是按最后一次移动的位置提交）。 */
let point = { x: 0, y: 0 }

/** 在真实手柄上按下 —— 此刻还只是「可能拖、也可能只是点菜单」，没过阈值不算拖。 */
function grab(rowIndex) {
  const handle = rows()[rowIndex].querySelector("[data-drag-handle]")
  const rect = handle.getBoundingClientRect()
  point = { x: rect.left + 4, y: rect.top + 4 }
  handle.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, cancelable: true, button: 0, pointerId: 1, clientX: point.x, clientY: point.y }))
}

/** 移动指针。监听挂在 window 上（拖出正文容器也不能丢）。 */
async function moveTo(x, y) {
  point = { x, y }
  window.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, pointerId: 1, clientX: x, clientY: y }))
  await nextTick()
}

async function dragOver(rowIndex, where) {
  const rect = rows()[rowIndex].getBoundingClientRect()
  await moveTo(rect.left + 20, where === "top" ? rect.top + 1 : rect.bottom - 1)
}

function release() {
  window.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, pointerId: 1, clientX: point.x, clientY: point.y }))
}

// ---- 拖第 0 块，落到第 2 块上沿 ----
grab(0)
await dragOver(2, "top")
check("过阈值就进入拖拽（原块变半透明）", rows()[0].className.includes("opacity-40"), rows()[0].className)
check("落到第 2 块上沿 → 该块画线", lined().length === 1 && lined()[0] === rows()[2].dataset.blockId, `带线的块：${JSON.stringify(lined())}`)
check("线的类名是 before 那一组", rows()[2].className.includes("before:pointer-events-none"))
check("同一时刻只有一条线", lined().length === 1)

// ---- 落到第 1 块下沿（等价于第 2 块上沿）----
await dragOver(1, "bottom")
check("落到第 1 块下沿 → 标在第 2 块上沿", lined().length === 1 && lined()[0] === rows()[2].dataset.blockId, `带线的块：${JSON.stringify(lined())}`)

// ---- 落到末尾 ----
await dragOver(3, "bottom")
check("落到最后一块下沿 → 标在最后一块的 after", rows()[3].className.includes("after:pointer-events-none"), `实际 classed=${JSON.stringify(lined())}`)
check("末尾落点不再有别的线", lined().length === 1)

// ---- 拖回原处：不画线 ----
await dragOver(0, "top")
check("落点回到原位 → 不画线（免得松手白动）", lined().length === 0, `带线的块：${JSON.stringify(lined())}`)

// ---- 真的提交一次 ----
const before = texts()
grab(0)
await dragOver(3, "bottom")
release()
await nextTick()
check("落点线在松手后收起", lined().length === 0)
check(
  "松手后块真的挪到末尾",
  JSON.stringify(texts()) !== JSON.stringify(before) && texts()[3] === before[0],
  `${JSON.stringify(before)} → ${JSON.stringify(texts())}`,
)

// ---- 没过阈值只是点击：菜单照常开，块不动 ----
const kept = texts()
grab(1)
release()
await nextTick()
check("按住不动就松手 → 不当成拖拽", JSON.stringify(texts()) === JSON.stringify(kept), JSON.stringify(texts()))

// ---- 原生拖拽（拖选文字）不放行 ----
const plain = new DataTransfer()
plain.setData("text/plain", "随便一段被选中的文字")
root.dispatchEvent(new DragEvent("dragover", { bubbles: true, cancelable: true, dataTransfer: plain, clientX: 0, clientY: rows()[1].getBoundingClientRect().top + 1 }))
await nextTick()
check("原生 dragover（非文件）不画线", lined().length === 0)

root.dispatchEvent(new DragEvent("dragend", { bubbles: true, cancelable: true, dataTransfer: plain }))

// ---- 拖到视口下沿：页面自己滚起来 ----
// 先追加到一定高度，短文档滚不动。
for (let i = 0; i < 30; i += 1) workspace.appendBlock("text")
await nextTick()
const viewport = root.closest('[data-slot="scroll-area-viewport"]')
const scrollable = viewport !== null && viewport.scrollHeight > viewport.clientHeight
check("正文长到能滚", scrollable, `scrollHeight=${viewport?.scrollHeight} clientHeight=${viewport?.clientHeight}`)

if (scrollable) {
  // ---- 拖拽中滚动（滚轮走的就是这条路）：落点跟着内容走 ----
  viewport.scrollTop = 0
  await nextTick()
  grab(1)
  await dragOver(2, "top")
  const lineAtTop = lined()[0]
  viewport.scrollTop = 200
  await new Promise((resolve) => setTimeout(resolve, 50))
  check(
    "滚动后落点按指针位置重算（线换到别的块）",
    lined().length === 1 && lined()[0] !== lineAtTop,
    `${lineAtTop} → ${JSON.stringify(lined())}`,
  )
  release()
  await nextTick()

  viewport.scrollTop = 0
  const box = viewport.getBoundingClientRect()
  grab(0)
  // 指针贴在容器下沿 4px 处不动：靠 rAF 循环自己滚，不依赖事件重复频率。
  await moveTo(box.left + 10, box.bottom - 4)
  await new Promise((resolve) => setTimeout(resolve, 200))
  check("指针贴住下沿时页面自动下滚", viewport.scrollTop > 0, `scrollTop=${viewport.scrollTop}`)

  release()
  await nextTick()
  const settled = viewport.scrollTop
  await new Promise((resolve) => setTimeout(resolve, 150))
  check("撒手就停，不会自己滚到底", viewport.scrollTop === settled, `${settled} → ${viewport.scrollTop}`)

  // ---- 拖进布局格子（落点判定走命中测试，和顶层不是一条路）----
  const layoutId = workspace.appendBlock("layout")
  workspace.setLayoutMode(layoutId, "grid")
  await nextTick()
  const cells = [...document.querySelectorAll("[data-layout-cell]")]
  check("布局块铺出两个格子", cells.length === 2, `格子数 ${cells.length}`)

  if (cells.length === 2) {
    cells[0].scrollIntoView({ block: "center" })
    await nextTick()
    const target = cells[0].getBoundingClientRect()
    grab(0)
    await moveTo(target.left + 10, target.top + 10)
    check(
      "悬在格子上时顶层不画线",
      lined().length === 0,
      `带线的块：${JSON.stringify(lined())}`,
    )
    check("格子被描成落点", cells[0].className.includes("border-dashed"), cells[0].className)
    release()
    await nextTick()
    const layout = workspace.activeDocument.value.find((block) => block.id === layoutId)
    check(
      "松手后块进了格子",
      layout !== undefined && layout.cells[0].length === 1,
      JSON.stringify(layout?.cells.map((cell) => cell.length)),
    )
  }
}
}
</script>
</body>
</html>
