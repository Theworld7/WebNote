<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HTML 块自检</title>
<style>
  body { font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 24px; color: #1c1c1e; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  pre { margin: 0; padding: 14px; background: #f6f6f7; border-radius: 10px; white-space: pre-wrap; }
  .ok { color: #1c7a3e; }
  .fail { color: #b42318; }
  .sum { margin-top: 12px; font-weight: 600; }
</style>
</head>
<body>
<h1>自定义 HTML 块，自检</h1>
<pre id="out">running…</pre>

<script type="module">
import { parseHtml } from "../src/lib/html/parse.ts"
import { blocksToHtml, serializeHtml } from "../src/lib/html/serialize.ts"
import { buildHtmlFrameDoc } from "../src/lib/html-frame.ts"
import { createHtmlBlock, createLayoutBlock, createTextualBlock, blockText, cloneBlock, retypeBlock, BLOCK_TYPES, blockTypeMeta } from "../src/lib/blocks.ts"
import { textToRuns } from "../src/lib/inline.ts"

const lines = []
let passed = 0
let failed = 0

function check(name, ok, detail = "") {
  if (ok) {
    passed += 1
    lines.push(`OK   ${name}`)
  } else {
    failed += 1
    lines.push(`FAIL ${name} —— ${detail}`)
  }
}

/** 比对块时去掉 id：解析每次都重新生成 id，它不参与等价判断。格子里的子块递归剥。 */
function strip(blocks) {
  return blocks.map((block) => {
    const copy = { ...block }
    delete copy.id
    if (copy.type === "layout") copy.cells = copy.cells.map((cell) => strip(cell))
    return copy
  })
}

function same(a, b) {
  return JSON.stringify(strip(a)) === JSON.stringify(strip(b))
}

// ---------- 一、登记表 ----------

check("登记表含 html 条目（内容组，紧挨 mermaid）", (() => {
  const meta = BLOCK_TYPES.find((entry) => entry.type === "html")
  return meta !== undefined && meta.group === "内容" && meta.label === "HTML"
})())
check("blockTypeMeta 认领 html", (() => {
  try {
    return blockTypeMeta("html").marker === "<>"
  } catch {
    return false
  }
})())

// ---------- 二、序列化形态 ----------

const source = '<div class="card" style="color:red">你好</div>\n<p>第二段</p>'
const exported = blocksToHtml([createHtmlBlock(source)])
check("原文原样落盘（写什么落什么）", exported.includes(source), exported)
check("开栏注释在前", exported.startsWith("<!--note-html-->"), exported)
check("关栏注释收尾", exported.endsWith("<!--/note-html-->"), exported)
check("空原文也写围栏", blocksToHtml([createHtmlBlock("")]) === "<!--note-html-->\n\n<!--/note-html-->", blocksToHtml([createHtmlBlock("")]))
check("script 标签不转义不剔除", blocksToHtml([createHtmlBlock("<script>alert(1)<\/script>")]).includes("<script>alert(1)<\/script>"), "")

// ---------- 三、往返一致性 ----------

const roundTrip = parseHtml(exported)
check("往返还原成单块 html", roundTrip.length === 1 && roundTrip[0].type === "html", JSON.stringify(roundTrip.map((b) => b.type)))
check("往返后原文不变", roundTrip[0].source === source, JSON.stringify(roundTrip[0].source))

const mixed = [
  createTextualBlock("text", textToRuns("前面一段")),
  createHtmlBlock(source),
  createTextualBlock("text", textToRuns("后面一段")),
]
const mixedBack = parseHtml(blocksToHtml(mixed))
check("夹在正文中的往返（三块，类型序列不变）", same(mixedBack, mixed), JSON.stringify(strip(mixedBack)))
check("相邻正文不受围栏吞并", mixedBack.length === 3, `实际 ${mixedBack.length} 块`)

const emptyBack = parseHtml(blocksToHtml([createHtmlBlock("")]))
check("空原文往返仍为空", emptyBack.length === 1 && emptyBack[0].type === "html" && emptyBack[0].source === "", JSON.stringify(emptyBack))

// ---------- 四、宽容解析 ----------

const unterminated = parseHtml(`<p>开头</p>\n<!--note-html-->\n<div>没收尾的块</div>`)
check("终止栏缺失：收到容器末尾", unterminated.length === 2 && unterminated[1].type === "html" && unterminated[1].source === "<div>没收尾的块</div>", JSON.stringify(unterminated))

const nestedComment = parseHtml(`<!--note-html-->\n<div>含普通注释<!--备注--></div>\n<!--/note-html-->`)
check("原文内的普通注释原样保留", nestedComment[0].source === "<div>含普通注释<!--备注--></div>", JSON.stringify(nestedComment[0]?.source))

const noMarker = parseHtml(`<div>没有围栏的 div</div>`)
check("无围栏不认领（照旧穿透）", noMarker.every((block) => block.type !== "html"), JSON.stringify(noMarker.map((b) => b.type)))

// ---------- 五、模型行为 ----------

check("blockText 投影取原文", blockText(createHtmlBlock("<b>x</b>")) === "<b>x</b>", blockText(createHtmlBlock("<b>x</b>")))

const cloned = cloneBlock(createHtmlBlock(source), "new-id")
check("cloneBlock 浅拷保留原文", cloned.id === "new-id" && cloned.source === source, "")

const retyped = retypeBlock(createTextualBlock("text", textToRuns("一段话")), "html")
check("正文转 html：纯文本投影收进 source", retyped.type === "html" && retyped.source === "一段话", JSON.stringify(retyped.source))

// ---------- 六、布局格子内嵌（html 不在 CELL_EXCLUDED_TYPES，格子全链路放行） ----------

const celled = [
  // 列数不带：2 是缺省不落存储（与 layout-check 同一口径），带上反而比对不上。
  createLayoutBlock("grid", undefined, [
    [createTextualBlock("text", textToRuns("左格"))],
    [createHtmlBlock(source), createTextualBlock("text", textToRuns("右格"))],
  ]),
]
const celledHtml = blocksToHtml(celled)
// 格子序列化是 <section> 直接拼块 HTML（无分隔换行），HTML 块打头时围栏紧贴开标签。
check("围栏原样落在 section 内", celledHtml.includes("<section><!--note-html-->"), celledHtml)
const celledBack = parseHtml(celledHtml)
check("布局格子内的 HTML 块往返一致", same(celledBack, celled), JSON.stringify(strip(celledBack)))

// ---------- 六·二、页面样式进入 HTML 块（类的可用性） ----------

/**
 * 导出侧本来就成立：HTML 块原文落在笔记 `<body>` 里，页面样式在 `<head>`，同处一份文档。
 * 所以真正要验证的是**预览的 iframe** —— 它是独立文档，页面样式不送进去，类就只对导出的
 * 文件生效。
 *
 * 这里用 `allow-same-origin` 是为了从父页面读子文档的 computed style，**只用于探针**；
 * 真实渲染走 `allow-scripts`（没有 allow-same-origin），见 HtmlBlockView。
 */
const PAGE_CSS =
  ".bg-demo-block{background-color:rgb(1,2,3);height:20px}" +
  "body{font-family:Georgia,serif;font-size:20px;padding:3rem;max-width:46rem;margin:0 auto;min-height:100vh}"

/** srcdoc = 带页面样式的帧；load 后把子文档里的量交回来。 */
function probeFrame(source, css, theme = "light") {
  return new Promise((resolve) => {
    const frame = document.createElement("iframe")
    frame.setAttribute("sandbox", "allow-same-origin allow-scripts")
    frame.style.cssText = "width:600px;height:120px;border:0"
    frame.srcdoc = buildHtmlFrameDoc(source, css, theme)
    frame.addEventListener("load", () => {
      const doc = frame.contentDocument
      const body = doc?.body
      const bodyStyle = body === null || body === undefined ? null : getComputedStyle(body)
      const target = doc?.querySelector(".bg-demo-block")
      resolve({
        hasStyleTag: doc?.head.querySelector("style[data-note-style]") !== null,
        background: target === null || target === undefined ? null : getComputedStyle(target).backgroundColor,
        fontFamily: bodyStyle === null ? null : bodyStyle.fontFamily,
        fontSize: bodyStyle === null ? null : bodyStyle.fontSize,
        paddingTop: bodyStyle === null ? null : bodyStyle.paddingTop,
        maxWidth: bodyStyle === null ? null : bodyStyle.maxWidth,
        minHeight: bodyStyle === null ? null : bodyStyle.minHeight,
      })
      frame.remove()
    })
    document.body.appendChild(frame)
  })
}

const styled = await probeFrame('<div class="bg-demo-block">x</div>', PAGE_CSS)
check("块里的 class 吃到页面样式", styled.background === "rgb(1, 2, 3)", String(styled.background))
check("页面样式写进 iframe 的 head（带 data-note-style）", styled.hasStyleTag, "")
check(
  "页面样式的 body 规则在基础 reset 之后生效",
  styled.fontFamily?.includes("Georgia") === true && styled.fontSize === "20px",
  `${styled.fontFamily} / ${styled.fontSize}`,
)
// iframe 的 body 是页面上的一个洞：整页版心（padding / max-width / margin auto）由正文列负责，
// 这里再套一遍就是双重内缩 —— 页面样式里一句 `body { padding: 3rem }` 会让块凭空缩一圈。
check("整页版心不进入 iframe：body padding 被压回 0", styled.paddingTop === "0px", String(styled.paddingTop))
check("整页版心不进入 iframe：body max-width 被清空", styled.maxWidth === "none", String(styled.maxWidth))
// `min-height:100vh` 会把 body 绑到 iframe 视口上，而 iframe 又按上报的 body 高度长大 ——
// 高度探针的正反馈，必须一并压掉。
check("整页高度不进入 iframe：body min-height 被压回 0", styled.minHeight === "0px", String(styled.minHeight))

const plain = await probeFrame('<div class="bg-demo-block">x</div>', "")
check("没有页面样式时类不生效", plain.background !== "rgb(1, 2, 3)", String(plain.background))
check(
  "没有页面样式时不注入任何样式标签",
  plain.hasStyleTag === false &&
    !buildHtmlFrameDoc("x", "", "light").includes("data-note-style") &&
    !buildHtmlFrameDoc("x", "", "light").includes("max-width:none!important"),
  "",
)

// 导出侧同一份文档：类和规则都在文件里 —— 这条不测渲染，只钉住「两份东西没被拆开」。
const exportedWithClass = serializeHtml([createHtmlBlock('<div class="bg-demo-block">x</div>')], {
  title: "t",
  style: PAGE_CSS,
})
check(
  "导出文件里 class 与页面样式同处一份文档",
  exportedWithClass.includes('class="bg-demo-block"') && exportedWithClass.includes(".bg-demo-block{background-color:rgb(1,2,3)"),
  exportedWithClass.slice(0, 200),
)

// ---------- 六·三、外观：块里那张纸跟着应用走 ----------

/**
 * 深色界面里 HTML 块露出白纸，根因不在块自己。`.bg-demo-block` 这种容器只给尺寸、不给
 * 底色，透明段（渐变的 `transparent`、内切角）露到 iframe 文档的**画布**上 —— 而嵌套
 * 文档的画布默认是不透明的 `Canvas`（浅色方案下就是纯白），父页面的 `.dark` 与 token
 * 都跨不过文档边界。所以要断言的是「块里的纸 = 应用画布」，不是「你设了哪个值」。
 *
 * 这一页不是应用本体，`--background` 按应用那两支的取值声明在这里；期望值现场从
 * **画出来的元素**（`background: var(--background)`）读 computed，不硬编码颜色 ——
 * 调色板改了，这条跟着走，而不是写死成另一支。
 */
document.head.insertAdjacentHTML(
  "beforeend",
  "<style>:root{--background:oklch(1 0 0)}.dark{--background:oklch(0.145 0 0)}</style>",
)
const paper = document.createElement("div")
paper.style.cssText = "position:absolute;width:1px;height:1px;background:var(--background)"
document.body.append(paper)

const colorCanvas = document.createElement("canvas")
colorCanvas.width = 1
colorCanvas.height = 1
const colorContext = colorCanvas.getContext("2d", { willReadFrequently: true })
/** 任意 CSS 颜色 → `rgb(r, g, b)`。`oklch()` 的计算值原样返回，只能让 canvas 解析。 */
function toRgb(value) {
  colorContext.fillStyle = "#010203"
  colorContext.fillStyle = value
  colorContext.clearRect(0, 0, 1, 1)
  colorContext.fillRect(0, 0, 1, 1)
  const [red, green, blue] = colorContext.getImageData(0, 0, 1, 1).data
  return `rgb(${red}, ${green}, ${blue})`
}

/**
 * 带指定外观跑一遍，把子文档里量到的值交回来。
 *
 * 外观是 `buildHtmlFrameDoc` 的**输入**（取色发生在构建那一刻），所以先切类、再建
 * srcdoc、最后才把类摘掉 —— 顺序反了量到的就是另一套。
 */
async function probeAppearance(theme, css = "", source = '<div class="bg-demo-block">x</div><div id="m">m</div>') {
  document.documentElement.classList.toggle("dark", theme === "dark")
  // 期望值取自**画出来的元素**，但要把 `oklch()` 投到 sRGB —— 两边都换成 rgb 才比得动。
  const expectedPaper = toRgb(getComputedStyle(paper).backgroundColor)
  const frame = await new Promise((resolve) => {
    const element = document.createElement("iframe")
    element.setAttribute("sandbox", "allow-same-origin allow-scripts")
    element.style.cssText = "width:600px;height:120px;border:0"
    element.srcdoc = buildHtmlFrameDoc(source, css, theme)
    element.addEventListener("load", () => resolve(element))
    document.body.appendChild(element)
  })
  const doc = frame.contentDocument
  const block = doc?.querySelector(".bg-demo-block")
  // 系统色关键词要另挂一支探针：`Canvas` 的分辨率取决于文档的用色方案。
  const keyword = doc?.createElement("div")
  if (doc !== undefined && doc !== null && keyword !== undefined && keyword !== null) {
    keyword.style.background = "Canvas"
    doc.body.append(keyword)
  }
  const measured = {
    expectedPaper,
    paper: doc === null || doc === undefined ? null : getComputedStyle(doc.documentElement).backgroundColor,
    scheme: doc === null || doc === undefined ? null : getComputedStyle(doc.documentElement).colorScheme,
    block: block === null || block === undefined ? null : getComputedStyle(block).backgroundColor,
    canvas: keyword === undefined || keyword === null ? null : getComputedStyle(keyword).backgroundColor,
    media: doc?.querySelector("#m") === null || doc?.querySelector("#m") === undefined
      ? null
      : getComputedStyle(doc.querySelector("#m")).color,
  }
  frame.remove()
  document.documentElement.classList.remove("dark")
  return measured
}

const isWhite = (rgb) => /\d+/.test(rgb ?? "") && (rgb.match(/\d+/g) ?? []).slice(0, 3).every((c) => Number(c) >= 250)

const darkPaper = await probeAppearance("dark")
check(
  "深色下块里的纸 = 应用画布（与正文列同一支底色）",
  darkPaper.paper === darkPaper.expectedPaper,
  `块 ${darkPaper.paper} / 应用 ${darkPaper.expectedPaper}`,
)
check("深色下块里的纸不再是白的", !isWhite(darkPaper.paper), String(darkPaper.paper))
check(
  "白不在 .bg-demo-block 身上：它自己仍然不画底色",
  darkPaper.block === "rgba(0, 0, 0, 0)",
  String(darkPaper.block),
)
check("深色下子文档的用色方案被钉成 dark", darkPaper.scheme === "dark", String(darkPaper.scheme))
check("深色下 Canvas 关键词解析成深色（不再是白）", !isWhite(darkPaper.canvas), String(darkPaper.canvas))
check(
  "页面样式写死 color-scheme: light 时不被掰弯",
  (await probeAppearance("dark", ":root{color-scheme:light}")).canvas === "rgb(255, 255, 255)",
  "",
)

const lightPaper = await probeAppearance("light")
check(
  "浅色下块里的纸 = 应用画布",
  lightPaper.paper === lightPaper.expectedPaper,
  `块 ${lightPaper.paper} / 应用 ${lightPaper.expectedPaper}`,
)
check("两套外观的纸确实不同（上一条不是「都没变」）", lightPaper.paper !== darkPaper.paper, `${lightPaper.paper} vs ${darkPaper.paper}`)

// 页面样式里的「浅色 / 深色两套」按应用外观判，与正文列的预览同一条道理（ADR-0014）。
const SCHEME_CSS =
  ":root{color-scheme:light dark}" +
  "@media (prefers-color-scheme: dark){#m{color:rgb(250, 1, 2)}}" +
  "@media (prefers-color-scheme: light){#m{color:rgb(1, 2, 250)}}"
const darkScheme = await probeAppearance("dark", SCHEME_CSS)
check("深色下走的是页面样式的深色分支", darkScheme.media === "rgb(250, 1, 2)", String(darkScheme.media))
check("深色下 `color-scheme: light dark` 被收成 dark", darkScheme.scheme === "dark", String(darkScheme.scheme))
const lightScheme = await probeAppearance("light", SCHEME_CSS)
check("浅色下走的是浅色分支", lightScheme.media === "rgb(1, 2, 250)", String(lightScheme.media))

// 作者画了这一页，我们补的只是「没人画」时的那张纸：写死底色的块不该被我们改掉。
const authorCss = await probeAppearance("dark", "html{background:rgb(9, 8, 7)}")
check("页面样式明写 html 底色时作者赢", authorCss.paper === "rgb(9, 8, 7)", String(authorCss.paper))

// ---------- 七、iframe 高度探针（对真 iframe 验证，须等上报，CDP 驱动抓结果） ----------

/** 造一只初始高度任意的沙箱 iframe，等第一次高度上报。超时 resolve null。 */
function measureFrame(initialHeight) {
  return new Promise((resolve) => {
    const frame = document.createElement("iframe")
    frame.setAttribute("sandbox", "allow-scripts")
    frame.style.cssText = `width:600px;height:${initialHeight}px;border:0`
    frame.srcdoc = buildHtmlFrameDoc('<div style="height:230px;background:#000"></div>', "", "light")
    const onMessage = (event) => {
      if (event.source !== frame.contentWindow) return
      window.removeEventListener("message", onMessage)
      frame.remove()
      resolve(typeof event.data?.height === "number" ? event.data.height : null)
    }
    window.addEventListener("message", onMessage)
    document.body.appendChild(frame)
    setTimeout(() => {
      window.removeEventListener("message", onMessage)
      frame.remove()
      resolve(null)
    }, 3000)
  })
}

const narrowReport = await measureFrame(48)
const tallReport = await measureFrame(500)
check("上报 = 内容高度（230px 内容报 ~230）", narrowReport !== null && Math.abs(narrowReport - 230) <= 1, `报告 ${narrowReport}`)
check("初始视口 500px 不虚报（量 body 不量 documentElement，无正反馈）", tallReport !== null && Math.abs(tallReport - 230) <= 1, `报告 ${tallReport}`)

// ---------- 汇总 ----------

lines.push("")
lines.push(`通过 ${passed}，失败 ${failed}`)
const out = document.getElementById("out")
out.textContent = lines.join("\n")
out.className = failed === 0 ? "ok" : "fail"
</script>
</body>
</html>
