<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>账目块「记一笔」行内新增自检</title>
<style>
  body { font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 24px; color: #1c1c1e; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  #app { height: 480px; display: flex; flex-direction: column; }
  pre { margin: 0; padding: 14px; background: #f6f6f7; border-radius: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>账目块「记一笔」行内新增自检（顶端插草稿行、横着填完、归位排序，末了读盘核对类型）</h1>
<!-- 脚本里有顶层 await（真实读盘、真实写盘），--dump-dom 抓不到结果，用 CDP 驱动跑：
     node design/cdp-dump.mjs http://localhost:1420/design/ledger-entry-check.html -->
<div id="app"></div>
<pre id="out">running…</pre>
<script type="module">
import "../src/style.css"
import { createApp, defineComponent, h, nextTick } from "vue"
import { TooltipProvider } from "../src/components/ui/tooltip/index.ts"
import BlockEditor from "../src/components/BlockEditor.vue"
import { provideSettings } from "../src/composables/useSettings.ts"
import { provideTheme } from "../src/composables/useTheme.ts"
import { provideWorkspace } from "../src/composables/useWorkspace.ts"
import { provideTables } from "../src/composables/useTables.ts"
import { createBlock, createLedgerBlock } from "../src/lib/blocks.ts"
import { blocksToHtml } from "../src/lib/html/serialize.ts"
import { tableFromJson } from "../src/lib/data-table.ts"

const lines = []
let passed = 0
let failed = 0

function report(kind, detail) {
  document.getElementById("out").textContent = [kind, "", detail, "", ...lines].join("\n")
}
window.addEventListener("unhandledrejection", (e) => report("REJECT", e.reason?.stack ?? String(e.reason)))
window.addEventListener("error", (e) => report("ERROR", e.message))
function step(name) {
  document.getElementById("out").textContent = `running: ${name}\n${lines.join("\n")}`
}
function check(name, ok, detail = "") {
  if (ok) { passed += 1; lines.push(`OK   ${name}`) }
  else { failed += 1; lines.push(`FAIL ${name} —— ${detail}`) }
}

/**
 * 夹具：一张五种控件的礼账，**按日期倒序**排，只有一行旧账（2026-10-20）。
 * 新记的那笔故意填更早的日期（2026-09-01）—— 它若参与排序就该排到旧账后面，
 * 而草稿行必须钉在顶端，两者放一起才验得出来「编辑期间不排序、填完才排序」。
 */
const TABLE = {
  version: 1,
  columns: [
    { id: "c1", name: "日期", type: "date", options: [] },
    { id: "c2", name: "人员", type: "text", options: [] },
    { id: "c3", name: "分类", type: "select", options: [{ id: "o1", name: "礼金" }, { id: "o2", name: "礼品" }] },
    { id: "c4", name: "收入", type: "number", options: [] },
    { id: "c5", name: "支出", type: "number", options: [] },
  ],
  rows: [
    { id: "r1", values: { c1: "2026-10-20", c2: "赵赫", c3: "o1", c4: 200, c5: null } },
  ],
}
const TABLE_JSON = JSON.stringify(TABLE, null, 2) + "\n"
const NOTE_HTML = blocksToHtml(
  [createBlock("text"), createLedgerBlock("礼账.tbl", "c4", "c5", true, "none", "", "c1", "desc")],
  (path) => (path === "礼账.tbl" ? tableFromJson(TABLE_JSON) : null),
)

step("opfs")
const opfs = await navigator.storage.getDirectory()
const dir = await opfs.getDirectoryHandle("ledger-entry-probe", { create: true })
for (const [name, text] of [["礼账.tbl", TABLE_JSON], ["账.html", NOTE_HTML]]) {
  const handle = await dir.getFileHandle(name, { create: true })
  const writable = await handle.createWritable()
  await writable.write(text)
  await writable.close()
}
window.showDirectoryPicker = async () => dir

async function readFile(name) {
  const handle = await dir.getFileHandle(name)
  return (await handle.getFile()).text()
}
/** 等真实 I/O 与 Vue 重渲染落地：microtask 轮询等不到读盘。 */
async function settle() {
  for (let i = 0; i < 4; i += 1) {
    await nextTick()
    await new Promise((resolve) => setTimeout(resolve, 25))
  }
}

step("mount")
let workspace = null
const Root = defineComponent({
  setup() {
    workspace = provideWorkspace()
    provideTheme(provideSettings())
    const tables = provideTables(workspace.fs, workspace.root)
    workspace.attachTableRegistry({
      preload: (paths) => tables.preload(paths),
      peek: (path) => tables.peek(path),
      flush: (path) => tables.flush(path),
      reload: (path) => tables.reload(path),
      create: () => Promise.reject(new Error("本页不新建数据表")),
    })
    return () => h(TooltipProvider, null, { default: () => h(BlockEditor) })
  },
})
createApp(Root).mount("#app")
await nextTick()

step("bootstrap")
await workspace.bootstrap()
await workspace.openRoot()
await nextTick()

const note = (function find(nodes) {
  for (const node of nodes) {
    if (node.kind === "note") return node
    const hit = node.children ? find(node.children) : null
    if (hit) return hit
  }
  return null
})(workspace.tree.value)
check("扫到了预置笔记", note !== null, JSON.stringify(workspace.tree.value.map((n) => n.name)))

step("openFile")
if (note !== null) {
  workspace.openFile(note.id)
  for (let i = 0; i < 60 && workspace.activeDocument.value.length < 2; i += 1) {
    await new Promise((resolve) => setTimeout(resolve, 50))
  }
  await settle()
}

// ---- DOM 取景 ----
function ledgerRoot() {
  return [...document.querySelectorAll("[data-block-id]")].find((el) => el.querySelector("table") !== null) ?? null
}
/** 数据行 = 带删除钮的行（节标题行与空表提示行没有钮）。草稿行同样带钮，所以也在其中。 */
function tableRows() {
  const root = ledgerRoot()
  if (root === null) return []
  return [...root.querySelectorAll("tbody tr")].filter((tr) => tr.querySelector('[aria-label="删除本行"]') !== null)
}
function cells(row) { return [...row.querySelectorAll("td")] }
function cellText(row, index) { return (cells(row)[index]?.textContent ?? "").trim() }
function cellInput(row, index) {
  const input = cells(row)[index]?.querySelector("input")
  return input instanceof HTMLInputElement ? input : null
}
function rowNumber(row) { return (row?.querySelector("th")?.textContent ?? "").trim() }
function focusIs(row, index) { return cellInput(row, index) !== null && document.activeElement === cellInput(row, index) }
function cellButton(row, index) {
  const button = cells(row)[index]?.querySelector("button")
  return button instanceof HTMLButtonElement ? button : null
}
/** 模拟鼠标点一格（点进去即编辑态；`mousedown.prevent` 不给按钮焦点，所以只点 click）。 */
function clickCell(row, index) { cellButton(row, index)?.click() }
function addButton() {
  const root = ledgerRoot()
  if (root === null) return null
  return [...root.querySelectorAll("button")].find((button) => (button.textContent ?? "").includes("记一笔")) ?? null
}
function type(input, value) {
  input.value = value
  input.dispatchEvent(new Event("input", { bubbles: true }))
}
async function enter(input) {
  input.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }))
  await settle()
}

step("add")
const rows0 = tableRows()
check("账目块渲染出 1 行旧账", rows0.length === 1, `实际 ${rows0.length}`)
check("旧账钉在第一位、行号 1", cellText(rows0[0], 1) === "赵赫" && rowNumber(rows0[0]) === "1",
  `${cellText(rows0[0], 1)} / ${rowNumber(rows0[0])}`)

addButton()?.click()
await settle()
const rows1 = tableRows()
check("点「记一笔」在列表里多出一条", rows1.length === 2, `实际 ${rows1.length}`)
check("新行插在**顶端**（旧账被挤到第二条）",
  cellText(rows1[0], 1) === "" && cellText(rows1[1], 1) === "赵赫",
  `${cellText(rows1[0], 1)} / ${cellText(rows1[1], 1)}`)
check("草稿行还没有行号（它还没排进列表）", rowNumber(rows1[0]) === "", `「${rowNumber(rows1[0])}」`)
check("光标落在草稿行的第一个输入格（日期）", focusIs(rows1[0], 0),
  `焦点在 ${document.activeElement?.tagName ?? "无"} / 输入框 ${cellInput(rows1[0], 0) === null ? "无" : "有"}`)

step("fill")
// 草稿行是横着填的：回车确认这一格，走到同一行的下一个输入格。
const dateInput = cellInput(rows1[0], 0)
type(dateInput, "2026-09-01")
await enter(dateInput)
const rows2 = tableRows()
check("回车挪到同一行的下一格（人员），没跳到别的行", focusIs(rows2[0], 1),
  `焦点在 ${document.activeElement?.tagName ?? "无"}`)
check("填完日期仍钉在顶端（旧账日期更近，排序还轮不到它）",
  cellText(rows2[0], 0) === "2026-09-01" && cellText(rows2[1], 0) === "2026-10-20",
  `${cellText(rows2[0], 0)} / ${cellText(rows2[1], 0)}`)

const nameInput = cellInput(rows2[0], 1)
type(nameInput, "新客")
await enter(nameInput)
const rows3 = tableRows()
check("回车跳过选择格，落到收入格（选择不是一个输入态）",
  cellInput(rows3[0], 2) === null && focusIs(rows3[0], 3),
  `分类格 ${cellInput(rows3[0], 2) === null ? "没有输入框" : "有输入框"}，焦点 ${document.activeElement?.tagName ?? "无"}`)

const moneyInput = cellInput(rows3[0], 3)
type(moneyInput, "1234.5")
await enter(moneyInput)
const rows4 = tableRows()
check("再一个回车落到支出格", focusIs(rows4[0], 4), `焦点在 ${document.activeElement?.tagName ?? "无"}`)
check("金额格显示带符号金额 +1,234.50", cellText(rows4[0], 3) === "+1,234.50", cellText(rows4[0], 3))

step("settle")
// 最后一个输入格上回车 = 这一笔记完：退出编辑态，草稿行归位。
await enter(cellInput(rows4[0], 4))
const rows5 = tableRows()
check("最后一个输入格上回车退出编辑态", rows5.every((row) => cells(row).every((td) => td.querySelector("input") === null)),
  JSON.stringify(rows5.map((row) => cells(row).filter((td) => td.querySelector("input") !== null).length)))
check("归位后按日期倒序落位（2026-09-01 排到 2026-10-20 之后）",
  cellText(rows5[0], 0) === "2026-10-20" && cellText(rows5[1], 0) === "2026-09-01",
  `${cellText(rows5[0], 0)} / ${cellText(rows5[1], 0)}`)
check("归位后行号重排（1、2）", rows5.map(rowNumber).join(",") === "1,2", rows5.map(rowNumber).join(","))
check("新行人员 / 收入落值", cellText(rows5[1], 1) === "新客" && cellText(rows5[1], 3) === "+1,234.50",
  `${cellText(rows5[1], 1)} / ${cellText(rows5[1], 3)}`)
check("归位时闪一下底纹（它从顶端跳到了它该在的位置）", (rows5[1]?.className ?? "").includes("bg-tint"),
  rows5[1]?.className ?? "缺行")
check("余额按记账发生序累计（新行 1,434.50，即使它显示在旧账后面）",
  cellText(rows5[0], 5) === "200.00" && cellText(rows5[1], 5) === "1,434.50",
  `${cellText(rows5[0], 5)} / ${cellText(rows5[1], 5)}`)
check("合计跟着重算（+1,434.50）", (ledgerRoot()?.querySelector("tfoot")?.textContent ?? "").includes("+1,434.50"),
  ledgerRoot()?.querySelector("tfoot")?.textContent ?? "缺 tfoot")

// ---- 一格都没填就撒手：空行删掉，不留一条空记录 ----
step("blank")
addButton()?.click()
await settle()
check("再点一次「记一笔」又插一条", tableRows().length === 3, `实际 ${tableRows().length}`)
cellInput(tableRows()[0], 0)?.blur()
await settle()
const rows6 = tableRows()
check("一格都没填就撒手，空行被删掉", rows6.length === 2, `实际 ${rows6.length}`)
check("剩下的顺序没被这条空行打乱", cellText(rows6[0], 0) === "2026-10-20", cellText(rows6[0], 0))

// ---- 保存：真写盘，读回来核对类型 ----
step("save")
await workspace.save()
await settle()
const saved = JSON.parse(await readFile("礼账.tbl"))
check("盘上行数 = 2（空行没有落盘）", saved.rows.length === 2, `实际 ${saved.rows.length}`)
const added = saved.rows.find((row) => row.values.c2 === "新客")
check("行内记的那一笔落盘了", added !== undefined, JSON.stringify(saved.rows.map((row) => row.values.c2)))
check("日期以 YYYY-MM-DD 字符串落盘", added?.values.c1 === "2026-09-01", JSON.stringify(added?.values.c1))
check("收入以数字落盘（1234.5）", added?.values.c4 === 1234.5 && typeof added.values.c4 === "number",
  JSON.stringify(added?.values.c4))
check("新增行的列键齐全（每列都有键）",
  saved.rows.every((row) => saved.columns.every((column) => column.id in row.values)))
check("盘上没有全空的行", saved.rows.every((row) => Object.values(row.values).some((value) => value !== null && value !== false)),
  JSON.stringify(saved.rows.map((row) => row.values)))

// ---- 从草稿行直接走掉：Tab 进选择格不算走，跳去改旧账才算 ----
step("leave")
const beforeLeave = tableRows().length
addButton()?.click()
await settle()
check("再记一笔仍在顶端插一条", tableRows().length === beforeLeave + 1, `实际 ${tableRows().length}`)

// 日期填一个**比旧账更晚**的：按日期倒序它该落在第一位。不管排序的话它只会被追加到表尾
// —— 这正是「松开草稿行却还冻着快照」时看得见的症状，位置一错就露馅。
const leaveDate = cellInput(tableRows()[0], 0)
type(leaveDate, "2026-11-01")
await enter(leaveDate)
type(cellInput(tableRows()[0], 1), "王二")
// Tab 进同一行的选择格：选择格没有输入态，`editing` 当场变空。
cellButton(tableRows()[0], 2)?.focus()
await settle()
const rows7 = tableRows()
check("Tab 进同一行的选择格，草稿行仍钉在顶端（人还在填这一条）",
  cellText(rows7[0], 1) === "王二" && rowNumber(rows7[0]) === "",
  `${cellText(rows7[0], 1)} / 行号「${rowNumber(rows7[0])}」`)
check("Tab 进选择格不丢焦点", document.activeElement === cellButton(rows7[0], 2),
  String(document.activeElement?.tagName))

// 焦点还在这一行里，人已经去点旧账的日期格 —— 这一笔算记完，新行必须立刻按排序归位。
clickCell(rows7.find((row) => cellText(row, 1) === "赵赫"), 0)
await settle()
const rows8 = tableRows()
check("跳去改旧账，新行立刻按排序归位（不是追加在表尾）",
  cellText(rows8[0], 0) === "2026-11-01" && cellText(rows8[1], 1) === "赵赫",
  rows8.map((row) => cellText(row, 0)).join(","))
check("归位后行号重排，被点的旧账格进入编辑态并拿到焦点",
  rowNumber(rows8[1]) === "2" && focusIs(rows8[1], 0),
  `行号 ${rowNumber(rows8[1])} / 焦点 ${document.activeElement?.tagName ?? "无"}`)
check("没有多出一条临时行", rows8.length === beforeLeave + 1, `实际 ${rows8.length}`)

// 空行直接跳走：不留空记录。
addButton()?.click()
await settle()
clickCell(tableRows().find((row) => cellText(row, 1) === "赵赫"), 0)
await settle()
const rows9 = tableRows()
check("一格没填就跳去改旧账，空行被删掉", rows9.length === beforeLeave + 1, `实际 ${rows9.length}`)
check("删掉空行后顺序没变", cellText(rows9[0], 0) === "2026-11-01" && cellText(rows9[1], 1) === "赵赫",
  rows9.map((row) => cellText(row, 0)).join(","))

// 焦点从选择格直接走掉：`editing` 早已是空，只能由 focusout 说「走了」。
addButton()?.click()
await settle()
const lastDate = cellInput(tableRows()[0], 0)
type(lastDate, "2026-07-01")
await enter(lastDate)
cellButton(tableRows()[0], 2)?.focus()
await settle()
check("焦点停在该行的选择格时，草稿行还在顶端", rowNumber(tableRows()[0]) === "", rowNumber(tableRows()[0]))
if (document.activeElement instanceof HTMLElement) document.activeElement.blur()
await settle()
const rows10 = tableRows()
check("焦点从选择格走掉后草稿行才归位（2026-07-01 落到末位）",
  cellText(rows10[rows10.length - 1], 0) === "2026-07-01", rows10.map((row) => cellText(row, 0)).join(","))

// 草稿行同时只能有一条：第二下「记一笔」必须先把前一条空草稿收掉。
// 不收的话它留在数据里，成了一条没人认领的空记录（`draftRowId` 已被新的一条覆盖）。
step("add-twice")
const rowsBeforeTwice = tableRows().length
addButton()?.click()
await settle()
addButton()?.click()
await settle()
const rowsTwice = tableRows()
check("连点两次「记一笔」只多出一条", rowsTwice.length === rowsBeforeTwice + 1,
  `实际 ${rowsTwice.length}（期望 ${rowsBeforeTwice + 1}）`)
check("第二条仍在顶端且没有行号", rowNumber(rowsTwice[0]) === "", `「${rowNumber(rowsTwice[0])}」`)

// ✕ 删掉草稿行：冻结快照要跟着作废，否则表就僵在删它那一刻的顺序上。
step("delete-draft")
const rowsBeforeDelete = tableRows().length
const draftDelete = tableRows()[0].querySelector('[aria-label="删除本行"]')
draftDelete?.click()
await settle()
check("✕ 删掉草稿行后不多不少", tableRows().length === rowsBeforeDelete - 1,
  `实际 ${tableRows().length}（期望 ${rowsBeforeDelete - 1}）`)
check("删掉草稿行后行号从 1 连续排", tableRows().map(rowNumber).join(",") === tableRows().map((_, i) => String(i + 1)).join(","),
  tableRows().map(rowNumber).join(","))

// 改一行旧账的日期，它该立刻按新日期归位 —— 这一步能验出快照到底解没解。
const lastRow = tableRows()[tableRows().length - 1]
clickCell(lastRow, 0)
await settle()
const retarget = tableRows()[tableRows().length - 1]
const retargetDate = cellInput(retarget, 0)
check("删掉草稿行后旧账仍能进编辑态", retargetDate !== null, "没有输入框")
if (retargetDate !== null) {
  type(retargetDate, "2026-12-31")
  await enter(retargetDate)
}
check("删掉草稿行之后改旧账日期，行照样按新日期归位到首位",
  cellText(tableRows()[0], 0) === "2026-12-31", tableRows().map((row) => cellText(row, 0)).join(","))

lines.push(failed === 0 ? `自检 ${passed}/${passed}` : `自检 ${passed} 过 / ${failed} 败`)
document.getElementById("out").textContent = lines.join("\n")</script>
</body>
</html>
