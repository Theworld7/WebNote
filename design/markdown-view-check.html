<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Markdown 预览与转换自检</title>
<style>
  body { font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 24px; color: #1c1c1e; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  #app { height: 560px; display: flex; flex-direction: column; border: 1px solid #e5e5e5; }
  pre { margin: 12px 0 0; padding: 14px; background: #f6f6f7; border-radius: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Markdown 预览（排版 / 消毒 / 转笔记）自检</h1>
<!-- 脚本里有顶层 await（要等真实读盘），--dump-dom 抓不到结果：
     node design/cdp-dump.mjs http://localhost:1420/design/markdown-view-check.html -->
<div id="app"></div>
<pre id="out">running…</pre>
<script type="module">
import "../src/style.css"
import { createApp, defineComponent, h, nextTick } from "vue"
import MarkdownView from "../src/components/MarkdownView.vue"
import { provideSettings } from "../src/composables/useSettings.ts"
import { provideTheme } from "../src/composables/useTheme.ts"
import { provideWorkspace } from "../src/composables/useWorkspace.ts"
import { DOC_MEASURE_PX, HEADING_FONT_SIZES } from "../src/lib/typography.ts"

const lines = []
let passed = 0
let failed = 0

function report(kind, detail) {
  document.getElementById("out").textContent = [kind, "", detail, "", ...lines].join("\n")
}
window.addEventListener("unhandledrejection", (e) => report("REJECT", e.reason?.stack ?? String(e.reason)))
window.addEventListener("error", (e) => report("ERROR", e.message))

function step(name) {
  document.getElementById("out").textContent = `running: ${name}`
}

function check(name, ok, detail = "") {
  if (ok) { passed += 1; lines.push(`OK   ${name}`) }
  else { failed += 1; lines.push(`FAIL ${name} —— ${detail}`) }
}

const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

// 末端的闭合标签写成 `<\/script>`：内联脚本里出现字面的闭合 script 标签会把页面提前截断。
const MARKDOWN = [
  "# 说明",
  "",
  "正文 **粗体** 与 [外链](https://example.com)。",
  "",
  "- 第一项",
  "- 第二项",
  "",
  "> 引用",
  "",
  "> [!NOTE]",
  "> 提示框正文。",
  "",
  "![图](./图.png)",
  "",
  "[同伴](./同伴.md)",
  "",
  "```js",
  "const a = 1",
  "```",
  "",
  '<img src="x" onerror="window.__xss = 1">',
  '<script>window.__xss = 2<\/script>',
].join("\n")

step("opfs")
const opfs = await navigator.storage.getDirectory()
// 上一轮跑过会留下 说明.html，转换那条用例会被「重名拒绝」顶掉 —— 每次从空目录开始。
await opfs.removeEntry("markdown-view-probe", { recursive: true }).catch(() => {})
const dir = await opfs.getDirectoryHandle("markdown-view-probe", { create: true })
const file = await dir.getFileHandle("说明.md", { create: true })
const writable = await file.createWritable()
await writable.write(MARKDOWN)
await writable.close()

// 相对图片要读的是一张真图：用 canvas 现画一张，比手抄 base64 可靠（抄错就是「解码失败」）。
const canvas = document.createElement("canvas")
canvas.width = 2
canvas.height = 2
const context = canvas.getContext("2d")
if (context !== null) {
  context.fillStyle = "#c00"
  context.fillRect(0, 0, 2, 2)
}
const pngBlob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"))
const pngFile = await dir.getFileHandle("图.png", { create: true })
const pngWritable = await pngFile.createWritable()
await pngWritable.write(new Uint8Array(await pngBlob.arrayBuffer()))
await pngWritable.close()

// 相对链接指向的另一篇 Markdown（转换完再点，免得换了标签影响前面的断言）。
const companion = await dir.getFileHandle("同伴.md", { create: true })
const companionWritable = await companion.createWritable()
await companionWritable.write("# 同伴")
await companionWritable.close()

window.showDirectoryPicker = async () => dir

step("mount")
let workspace = null
let settings = null
const Root = defineComponent({
  setup() {
    workspace = provideWorkspace()
    settings = provideSettings()
    provideTheme(settings)
    return () => h(MarkdownView)
  },
})
createApp(Root).mount("#app")
await nextTick()

step("bootstrap")
await workspace.bootstrap()
step("openRoot")
await workspace.openRoot()
await nextTick()

const mdNode = (function find(nodes) {
  for (const node of nodes) {
    if (node.kind === "markdown") return node
    const hit = node.children ? find(node.children) : null
    if (hit !== null) return hit
  }
  return null
})(workspace.tree.value)

if (mdNode === null) {
  report("ERROR", "OPFS 里没扫到预置的 .md")
} else {
  await workspace.openFile(mdNode.id)
  for (let i = 0; i < 80 && workspace.activeMarkdown.value === ""; i += 1) await wait(50)
  await nextTick()
}

const docRoot = () => document.querySelector("[data-markdown-doc]")
const headings = () => document.querySelectorAll("[data-markdown-doc] h1")
const xssImage = () => document.querySelector('[data-markdown-doc] img[src="x"]')
const localImage = () => document.querySelector("[data-markdown-doc] img[src^='blob:']")

check("打开的是 Markdown 标签", workspace.isActiveMarkdown.value === true)
check("原文读进来了", workspace.activeMarkdown.value.includes("# 说明"), workspace.activeMarkdown.value)
check("Markdown 不进块模型", workspace.activeDocument.value.length === 0)
check("Markdown 标签没有脏态", workspace.tabs.value[0]?.dirty === false)

step("render")
check("渲染出预览容器", docRoot() !== null)
check("标题渲染成 h1", headings().length === 1 && headings()[0].textContent === "说明", headings()[0]?.textContent ?? "")
check("块打上了 data-block-type", docRoot()?.querySelector('h1[data-block-type="h1"]') !== null)
check("段落也带块类型", docRoot()?.querySelector('p[data-block-type="text"]') !== null)
check("列表保留原生 li", docRoot()?.querySelector("li") !== null)

const styleEl = document.querySelector("style[data-markdown-style]")
check("注入了 scoped 文档样式", styleEl !== null)
const rootStyle = docRoot() === null ? null : getComputedStyle(docRoot())
check("正文列吃到导出文档的版心", rootStyle?.maxWidth === `${DOC_MEASURE_PX}px`, rootStyle?.maxWidth ?? "")
const h1Style = headings().length === 0 ? null : getComputedStyle(headings()[0])
check("标题吃到导出文档的字号", h1Style?.fontSize === `${HEADING_FONT_SIZES[0]}px`, h1Style?.fontSize ?? "")

// 只读提示与「转为笔记」浮在右上角，右缘要贴**正文内容**的右缘 —— 正文列在宽窗口里是
// 居中的 720，贴编辑区右缘会让它悬在文字外面，看着像掉出去了。
const actions = document.querySelector("[data-markdown-actions]")
const docBox = docRoot()?.getBoundingClientRect() ?? null
const docPadRight = rootStyle === null ? 0 : parseFloat(rootStyle.paddingRight)
const actionsRight = actions?.getBoundingClientRect().right ?? NaN
const contentRight = docBox === null ? NaN : docBox.right - docPadRight
check(
  "只读浮标的右缘贴正文内容右缘",
  actions !== null && Math.abs(actionsRight - contentRight) < 1,
  actions === null
    ? "浮标缺失"
    : `浮标 ${actionsRight.toFixed(1)} vs 内容 ${contentRight.toFixed(1)}（差 ${(actionsRight - contentRight).toFixed(1)}）`,
)

// 上一条只是「此刻对上了」。它要一直对上，浮标与正文列必须**共用同一个包含块**：
// 浮标挂在滚动视口外面时，两者各按自己的宽度居中，视口哪天真为滚动条留了宽度，
// 就会一个在里一个在外，差半个滚动条。放进视口（sticky 钉住）才把这条钉死。
const viewportOf = () => document.querySelector("[data-reka-scroll-area-viewport]")
check(
  "只读浮标在滚动视口里（与正文列同一个包含块）",
  actions !== null && viewportOf() !== null && viewportOf()?.contains(actions) === true,
  actions === null ? "浮标缺失" : "浮标在视口外",
)
// 挂进视口就得是零高：否则正文被那一横推下去几十像素，卷到顶时正文顶上多了条空带。
const viewportBox = viewportOf()?.getBoundingClientRect() ?? null
check(
  "只读浮标不占正文高度（正文顶仍然贴着视口顶）",
  docBox !== null && viewportBox !== null && Math.abs(docBox.top - viewportBox.top) < 1,
  docBox === null || viewportBox === null ? "缺失" : `正文顶 ${docBox.top.toFixed(1)} vs 视口顶 ${viewportBox.top.toFixed(1)}`,
)

// sticky 必须真的钉住：滚下去之后它还停在视口顶下 12px。位置一旦退化成 static，
// 上面三条几何断言在「卷到顶」的状态下全都照样通过 —— 只有滚一遍才看得见。
const stampViewport = viewportOf()
check(
  "夹具够长、视口能滚（下面那条才有意义）",
  stampViewport !== null && stampViewport.scrollHeight > stampViewport.clientHeight,
  stampViewport === null ? "视口缺失" : `scrollHeight ${stampViewport.scrollHeight} vs clientHeight ${stampViewport.clientHeight}`,
)
if (stampViewport !== null && actions !== null) {
  stampViewport.scrollTop = 200
  await wait(60)
  const pinnedTop = actions.getBoundingClientRect().top
  const viewTop = stampViewport.getBoundingClientRect().top
  check(
    "滚下去之后浮标仍钉在视口顶下 12px",
    Math.abs(pinnedTop - viewTop - 12) < 1,
    `浮标顶 ${pinnedTop.toFixed(1)} vs 视口顶 + 12 = ${(viewTop + 12).toFixed(1)}（滚了 ${stampViewport.scrollTop}）`,
  )
  stampViewport.scrollTop = 0
}

step("sanitize")
check("脚本元素没有进 DOM", docRoot()?.querySelector("script") === null)
check("事件属性被摘掉", xssImage() !== null && !xssImage().hasAttribute("onerror"))
check("消毒后的内容没有执行", window.__xss === undefined, String(window.__xss))

step("alert")
check("alert 渲染成提示框", docRoot()?.querySelector('aside[data-block-type="callout"]') !== null)
check("提示框里没有触发词", docRoot()?.textContent.includes("[!NOTE]") === false)

step("local image")
// 读盘 + 解码都是异步的：等图真的画出来再断言，否则量到的是「还没开始加载」。
for (let i = 0; i < 80; i += 1) {
  const image = localImage()
  if (image !== null && image.complete && image.naturalWidth > 0) break
  await wait(50)
}
const loadedImage = localImage()
check("相对图片换成 object URL", loadedImage !== null)
check("本地图片解码出来", loadedImage?.naturalWidth === 2, String(loadedImage?.naturalWidth))

step("convert")
// `?preview` 只留预览不点转换：截图看排版时用，转换会把编辑区切到新笔记，预览就空了。
const previewOnly = new URLSearchParams(location.search).has("preview")
if (previewOnly) {
  lines.push("SKIP 预览模式：不执行转换")
} else {
  const button = [...document.querySelectorAll("button")].find((el) => el.textContent?.includes("转为笔记"))
  check("预览里有「转为笔记」入口", button !== undefined)
  button?.click()
  for (let i = 0; i < 80 && !workspace.activePath.value.endsWith(".html"); i += 1) await wait(50)

  check("转换后打开的是新笔记", workspace.activePath.value === "说明.html", workspace.activePath.value)
  const noteFile = await dir.getFileHandle("说明.html").catch(() => null)
  check("笔记落在原文件同目录", noteFile !== null)
  if (noteFile !== null) {
    const noteText = await (await noteFile.getFile()).text()
    check("产物是笔记形态的 HTML", noteText.includes("<h1"), noteText.slice(0, 160))
    check("产物里没有 Markdown 记号", !noteText.includes("**"), noteText.slice(0, 160))
    // 图片块只认 data URI：留着 `./图.png` 的话一打开就是「图片打不开」（真机验收踩过）。
    check("相对图片内联成 data URI", noteText.includes("data:image/png;base64,"), noteText.slice(0, 160))
  }
  check("原 Markdown 还在盘上", (await dir.getFileHandle("说明.md").catch(() => null)) !== null)
}

step("relative link")
if (previewOnly) {
  lines.push("SKIP 预览模式：不点相对链接")
} else {
  // 转换把编辑区切到了新笔记，预览已经空了：先把 Markdown 重新打开再点链接。
  await workspace.openFile(mdNode.id)
  for (let i = 0; i < 80 && workspace.activeMarkdown.value === ""; i += 1) await wait(50)
  await nextTick()

  const anchors = [...document.querySelectorAll("[data-markdown-doc] a")]
  // marked 会把中文地址百分号编码（`./%E5%90%8C...`），比较前先解码。
  const link = anchors.find((el) => decodeURIComponent(el.getAttribute("href") ?? "") === "./同伴.md")
  check("相对链接渲染出来", link !== undefined, anchors.map((el) => el.getAttribute("href")).join(" | "))
  link?.click()
  for (let i = 0; i < 80 && workspace.activePath.value !== "同伴.md"; i += 1) await wait(50)
  check("相对链接按所在目录解析并开标签", workspace.activePath.value === "同伴.md", workspace.activePath.value)
}

document.getElementById("out").textContent = [`自检 ${passed}/${passed + failed} 通过`, "", ...lines].join("\n")
</script>
</body>
</html>
