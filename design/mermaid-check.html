<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Mermaid 图块自检</title>
<style>
  body { font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 24px; color: #1c1c1e; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  #app { margin: 0 0 16px; max-width: 720px; }
  pre { margin: 0; padding: 14px; background: #f6f6f7; border-radius: 10px; white-space: pre-wrap; }
  .ok { color: #1c7a3e; }
  .fail { color: #b42318; }
</style>
</head>
<body>
<h1>Mermaid 图块：渲染与双态自检</h1>
<div id="app"></div>
<div id="app2"></div>
<pre id="out">running…</pre>
<script type="module">
import { createApp, defineComponent, h, nextTick, ref } from "vue"
// 必须引应用样式表：本探针查的是真实渲染结果，缺了 style.css 连 Tailwind 工具类都不存在。
// （mermaid 的字体是从 `--font-sans` 读的，不引它就会退回自带字体栈 —— 不影响断言。）
import "../src/style.css"
import BlockItem from "../src/components/BlockItem.vue"
import MermaidBlockView from "../src/components/MermaidBlockView.vue"
import { provideWorkspace } from "../src/composables/useWorkspace.ts"
import { renderMermaid } from "../src/lib/mermaid.ts"

const lines = []
let passed = 0
let failed = 0

/** 卡住时能从 `#out` 看出停在哪一步（顶层 await 的脚本，dump 抓不到中间态）。 */
function step(name) {
  document.getElementById("out").textContent = `running: ${name}`
}

function check(name, ok, detail = "") {
  if (ok) { passed += 1; lines.push(`OK   ${name}`) }
  else { failed += 1; lines.push(`FAIL ${name} —— ${detail}`) }
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

/** 渲染是异步的（还要等 mermaid 按需加载），一律轮询等 DOM，不赌固定 sleep。 */
async function waitFor(fn, ms = 8000) {
  const deadline = Date.now() + ms
  for (;;) {
    const value = fn()
    if (value) return value
    if (Date.now() > deadline) return null
    await sleep(50)
  }
}

const textarea = () => document.querySelector("#app textarea")
const figure = () => document.querySelector("#app svg")
/** 图的身份认「渲染出来的文字」，不认 mermaid 写在 svg 上的 class —— 那是它的内部实现。 */
const figureText = () => figure()?.textContent ?? ""
const failedBox = () =>
  [...document.querySelectorAll("#app p")].find((p) => p.textContent.includes("图渲染失败"))
const button = (label) =>
  [...document.querySelectorAll("#app button")].find((b) => b.textContent.trim() === label)

function dblclick(el) {
  el.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }))
}

function pressMetaEnter(el) {
  el.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", metaKey: true, bubbles: true }))
}

function pressEscape(el) {
  el.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }))
}

const SOURCE = "graph TD\n  A[开始] --> B[结束]"
const SEQUENCE = "sequenceDiagram\n  A->>B: 你好"

let workspace = null
let block = null
let generation = null

const Root = defineComponent({
  setup() {
    workspace = provideWorkspace()
    block = ref({ id: "mb1", type: "mermaid", source: SOURCE })
    generation = ref(0)
    // key 跟着 generation 走：换块时强制重建组件实例 —— 否则 `editing` 这类只认初始值的
    // 本地状态会跟着旧实例留下来，测的就不是「新挂载一个块」这件事了。
    return () => h(MermaidBlockView, { block: block.value, key: generation.value })
  },
})

createApp(Root).mount("#app")
await nextTick()

/**
 * 换一个块：改 props 并换 key 重建实例。
 *
 * 组件里 `editing` 的初始值只看一次 `props.block.source`，所以「空块」与「有内容的块」
 * 必须是两次挂载，不能靠改 props 把前者变成后者。
 */
async function mount(source, id = "mb1") {
  block.value = { id, type: "mermaid", source }
  generation.value += 1
  await nextTick()
}

// ---------- 一、空块 ----------

step("空块")
await mount("")
check("空源码：初始就是源码编辑区", textarea() !== null)
check("空源码：不显示图，也不显示错误", figure() === null && failedBox() === undefined)

pressEscape(textarea())
await nextTick()
check("空源码：Esc 不退出（退出去只剩一块点不动的空白）", textarea() !== null)

button("完成").click()
await nextTick()
check("空源码：点完成也不退出（没内容可提交）", textarea() !== null)

// ---------- 二、有源码 → 渲染 ----------

step("有源码 → 渲染")
await mount(SOURCE)

const svg = await waitFor(figure)
check("有源码：渲染出 svg", svg !== null)
check("有源码：源码编辑区收起", textarea() === null)
check("有源码：出现「编辑源码」入口", button("编辑源码") !== undefined)

if (svg !== null) {
  check("渲染出的 svg 有实际尺寸", svg.getBoundingClientRect().height > 0, `高 ${svg.getBoundingClientRect().height}`)
  // mermaid 自带的 `width:100%` + `max-width` 负责缩放，`mx-auto` 负责居中。
  // 别指望 `getComputedStyle` 会回报 "auto" —— auto margin 在计算值阶段就解析成 px 了。
  const figureRect = svg.getBoundingClientRect()
  const hostRect = svg.parentElement.getBoundingClientRect()
  check(
    "图在块里居中（左右留白相等）",
    Math.abs(figureRect.left - hostRect.left - (hostRect.right - figureRect.right)) <= 1,
    `左 ${(figureRect.left - hostRect.left).toFixed(1)} / 右 ${(hostRect.right - figureRect.right).toFixed(1)}`,
  )
  check("图是块级（inline 会在下方留 baseline 空隙）", getComputedStyle(svg).display === "block")
  check("渲染的是流程图（图里带节点文字）", figureText().includes("开始"), figureText().slice(0, 40))
} else {
  check("渲染出的 svg 有实际尺寸", false, "没有 svg")
}

// ---------- 三、双态切换 ----------

step("双击 → 编辑")
dblclick(figure())
await nextTick()
check("双击图：切到源码编辑区", textarea() !== null)
check("双击图：编辑区带出当前源码", textarea()?.value === SOURCE)

pressEscape(textarea())
await nextTick()
check("Esc：放弃改动回到预览", textarea() === null && figure() !== null)

step("完成 → 回预览")
dblclick(figure())
await nextTick()
const box = textarea()
check("再次双击：仍是同一条源码", box !== null && box.value === SOURCE)

// 草稿没动就提交：状态机退回预览，且不该把文档标脏。
pressMetaEnter(box)
await nextTick()
check("Cmd+Enter：收工回到预览", textarea() === null && figure() !== null)
check("未改动源码时不标脏", workspace.isDirty.value === false, `dirty=${workspace.isDirty.value}`)

// ---------- 四、源码变了要重渲染 ----------

step("源码变了 → 重渲染")
block.value.source = SEQUENCE
await nextTick()
const redrawn = await waitFor(() => (figureText().includes("你好") ? figure() : null))
check(
  "改用序图源码：图跟着换（watch 到 props 就重渲染）",
  redrawn !== null,
  `图里文字 ${figureText().slice(0, 40) || "（没有图）"}`,
)

// ---------- 五、语法错误 ----------

step("语法错误")
await mount("graph TD\n  A -->")
const bad = await waitFor(failedBox)
check("语法错误：显示错误态而不是空着", bad !== undefined)
check("语法错误：先给结论，不顺便摊开源码框", textarea() === null)
check("语法错误：留了改源码的入口", button("改源码") !== undefined)

button("改源码").click()
await nextTick()
check("语法错误：点「改源码」带出坏源码", textarea()?.value === "graph TD\n  A -->")

step("错误 → 合法")
await mount(SOURCE)
await waitFor(figure)
check("改回合法源码：图重新出现、错误态消失", figure() !== null && failedBox() === undefined)

// ---------- 六、渲染缓存与 id 隔离 ----------

step("缓存与 id 隔离")
const first = await renderMermaid("mbA", SOURCE)
const again = await renderMermaid("mbA", SOURCE)
const other = await renderMermaid("mbB", SOURCE)

check("同一块同一份源码：结果一致（命中缓存）", first === again)
check("不同块同一份源码：各渲染各的（SVG 里的 id 不撞）", first !== other,
  "两块拿到同一份 SVG —— 内部的 marker / clipPath id 会互相串")
check("SVG 的根 id 就是传入的块 id（marker id 由它派生）", first.includes('id="mbA"') && other.includes('id="mbB"'))

// ---------- 七、BlockItem 的分支路由 ----------
//
// 上面测的都是 `MermaidBlockView` 自己。它在文档里能不能出现，取决于 `BlockItem`
// 有没有把 `mermaid` 分到这条分支上 —— 那是另一个文件里的一个 `v-else-if`，
// 漏了的话组件再对也白搭，而且症状是「块整个不显示」，比渲染错更难看出来。

step("BlockItem 分支路由")
const item = ref({ id: "bi1", type: "mermaid", source: SOURCE })
const ItemRoot = defineComponent({
  setup() {
    provideWorkspace()
    return () => h(BlockItem, { block: item.value, orderedIndex: 0, dragging: false, dropEdge: "none" })
  },
})

createApp(ItemRoot).mount("#app2")
await nextTick()

const routed = await waitFor(() => document.querySelector("#app2 svg"))
check("BlockItem 把 mermaid 块路由到图视图", routed !== null)
check("BlockItem 里图同样居中", routed !== null && getComputedStyle(routed).display === "block")

// 手柄的纵向偏移走 `firstLineCenter()`：图块没有文字行，手柄该贴顶而不是压在图中间。
const tools = document.querySelector("#app2 [style*='--tools-top']")
check(
  "手柄贴顶（图块没有文字行）",
  tools !== null && tools.style.getPropertyValue("--tools-top") === "2px",
  tools === null ? "没找到手柄容器" : tools.style.getPropertyValue("--tools-top"),
)

lines.push(`自检 ${passed}/${passed + failed}`)
document.getElementById("out").textContent = lines.join("\n")
document.title = `自检 ${passed}/${passed + failed}`
</script>
</body>
</html>
