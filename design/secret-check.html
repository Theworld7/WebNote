<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>密钥块自检</title>
<style>
  body { font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 24px; color: #1c1c1e; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  #app { height: 420px; display: flex; flex-direction: column; }
  pre { margin: 0; padding: 14px; background: #f6f6f7; border-radius: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>密钥块自检（挂真实编辑器 + OPFS：掩码是显示开关，明文只在这一格里、只在这个瞬间）</h1>
<!-- 脚本里有顶层 await（真实读盘），--dump-dom 抓不到结果，用 CDP 驱动跑：
     node design/cdp-dump.mjs http://localhost:1420/design/secret-check.html -->
<div id="app"></div>
<pre id="out">running…</pre>
<script type="module">
import "../src/style.css"
import { createApp, defineComponent, h, nextTick } from "vue"
import { TooltipProvider } from "../src/components/ui/tooltip/index.ts"
import BlockEditor from "../src/components/BlockEditor.vue"
import { provideSettings } from "../src/composables/useSettings.ts"
import { provideTheme } from "../src/composables/useTheme.ts"
import { provideWorkspace } from "../src/composables/useWorkspace.ts"
import { provideTables } from "../src/composables/useTables.ts"
import { createSecretBlock } from "../src/lib/blocks.ts"
import { blocksToHtml } from "../src/lib/html/serialize.ts"
import { SECRET_MASK } from "../src/lib/secret.ts"

const lines = []
let passed = 0
let failed = 0

function report(kind, detail) {
  document.getElementById("out").textContent = [kind, "", detail, "", ...lines].join("\n")
}
window.addEventListener("unhandledrejection", (e) => report("REJECT", e.reason?.stack ?? String(e.reason)))
window.addEventListener("error", (e) => report("ERROR", e.message))
function step(name) {
  document.getElementById("out").textContent = `running: ${name}\n${lines.join("\n")}`
}
function check(name, ok, detail = "") {
  if (ok) { passed += 1; lines.push(`OK   ${name}`) }
  else { failed += 1; lines.push(`FAIL ${name} —— ${detail}`) }
}

// ---- 夹具：一篇带密钥块的笔记。正文由序列化器自己生成，保证是编辑器产物 ----
const SECRET_NAME = "OpenAI API Key"
const SECRET_VALUE = "sk-live-abcdef1234567890"
const NOTE_HTML = blocksToHtml(
  [
    createSecretBlock(SECRET_NAME, SECRET_VALUE, "月底轮换"),
    createSecretBlock(),
  ],
  () => null,
)

step("opfs")
const opfs = await navigator.storage.getDirectory()
const dir = await opfs.getDirectoryHandle("secret-probe", { create: true })
const handle = await dir.getFileHandle("密钥.html", { create: true })
const writable = await handle.createWritable()
await writable.write(NOTE_HTML)
await writable.close()
window.showDirectoryPicker = async () => dir

/** 等真实 I/O 与 Vue 重渲染落地：microtask 轮询等不到读盘。 */
async function settle() {
  for (let i = 0; i < 4; i += 1) {
    await nextTick()
    await new Promise((resolve) => setTimeout(resolve, 25))
  }
}

// 剪贴板：无头窗口没有焦点，真写会被拒。换成记账本，验「复制走的是真值」。
let clipboardText = null
Object.defineProperty(navigator, "clipboard", {
  configurable: true,
  value: { writeText: async (text) => { clipboardText = text } },
})

step("mount")
let workspace = null
const Root = defineComponent({
  setup() {
    workspace = provideWorkspace()
    provideTheme(provideSettings())
    const tables = provideTables(workspace.fs, workspace.root)
    workspace.attachTableRegistry({
      preload: (paths) => tables.preload(paths),
      peek: (path) => tables.peek(path),
      flush: (path) => tables.flush(path),
      reload: (path) => tables.reload(path),
      dirtyPaths: () => tables.dirtyPaths(),
      create: () => Promise.reject(new Error("本页不新建数据表")),
    })
    return () => h(TooltipProvider, null, { default: () => h(BlockEditor) })
  },
})
createApp(Root).mount("#app")
await nextTick()

step("bootstrap")
await workspace.bootstrap()
await workspace.openRoot()
await nextTick()

const note = (function find(nodes) {
  for (const node of nodes) {
    if (node.kind === "note" && node.name === "密钥.html") return node
    const hit = node.children ? find(node.children) : null
    if (hit) return hit
  }
  return null
})(workspace.tree.value)
check("扫到了预置笔记", note !== null, JSON.stringify(workspace.tree.value.map((n) => n.name)))

step("openFile")
if (note !== null) {
  workspace.openFile(note.id)
  for (let i = 0; i < 60 && workspace.activeDocument.value.length < 2; i += 1) {
    await new Promise((resolve) => setTimeout(resolve, 50))
  }
  await settle()
}

// ---- DOM 取景 ----

/** 两张密钥卡：第一张有值（夹具），第二张是空的（验空态）。 */
function cards() {
  return [...document.querySelectorAll("[data-block-id]")].filter((el) => el.querySelector(".font-mono") !== null)
}
function card(index) {
  return cards()[index] ?? null
}
function nameInput(root) {
  const input = root?.querySelector('[data-editable]')
  return input instanceof HTMLInputElement ? input : null
}
function valueInput(root) {
  const input = root?.querySelector('input[placeholder="粘贴或输入密钥"]')
  return input instanceof HTMLInputElement ? input : null
}
function maskedButton(root) {
  return root?.querySelector("button.font-mono") ?? null
}
function noteInput(root) {
  const input = root?.querySelector('input[placeholder^="备注"]')
  return input instanceof HTMLInputElement ? input : null
}
function eyeButton(root) {
  return root?.querySelector('button[title="显示明文"], button[title="收起明文"]') ?? null
}
function copyButton(root) {
  return root?.querySelector('button[title="复制密钥"], button[title="已复制"]') ?? null
}
/** 改一格：受控输入靠 `change`（失焦）回写，逐键回写会把撤销栈塞满。 */
async function type(input, text) {
  input.value = text
  input.dispatchEvent(new Event("input", { bubbles: true }))
  input.dispatchEvent(new Event("change", { bubbles: true }))
  await settle()
}
function secretBlock(index) {
  return workspace.activeDocument.value.filter((block) => block.type === "secret")[index] ?? null
}

check("密钥卡渲染出来了", cards().length === 2, `${cards().length} 张`)
const first = card(0)
const second = card(1)
check("名称是从属性里读回来的", nameInput(first)?.value === SECRET_NAME, nameInput(first)?.value ?? "")
check("备注是从属性里读回来的", noteInput(first)?.value === "月底轮换", noteInput(first)?.value ?? "")

// ---- 一、掩码（默认态） ----

check("有值时显示掩码", maskedButton(first)?.textContent.trim() === SECRET_MASK, maskedButton(first)?.textContent ?? "")
check("明文不在可见文本里", (first?.textContent ?? "").includes(SECRET_VALUE) === false, first?.textContent ?? "")
check("掩码态没有 value 输入框", valueInput(first) === null)
check("掩码态不让复制按钮使坏（有值时可点）", copyButton(first)?.disabled === false)

// ---- 二、眼睛：打开明文、光标直接落进去 ----

eyeButton(first)?.click()
await settle()
const opened = valueInput(first)
check("点眼睛后出现明文输入框", opened !== null)
check("输入框里是明文", opened?.value === SECRET_VALUE, opened?.value ?? "")
check("打开就把光标放进去（打开就是为了改）", document.activeElement === opened, document.activeElement?.tagName ?? "")
check("掩码按钮同期消失", maskedButton(first) === null)

// Esc 只收起明文，不冒到块层去「退出编辑」。
opened?.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }))
await settle()
check("Esc 收起明文", valueInput(first) === null && maskedButton(first)?.textContent.trim() === SECRET_MASK)

// ---- 三、改值：失焦回写 ----

eyeButton(first)?.click()
await settle()
const editing = valueInput(first)
if (editing !== null) await type(editing, "sk-live-new-key-0001")
check("改完的值写回了块", secretBlock(0)?.value === "sk-live-new-key-0001", secretBlock(0)?.value ?? "")
check("改完仍在明文里（不自己跳回掩码）", valueInput(first)?.value === "sk-live-new-key-0001", valueInput(first)?.value ?? "")

if (nameInput(first) !== null) await type(nameInput(first), "OpenAI 主账号")
check("名称改动写回了块", secretBlock(0)?.name === "OpenAI 主账号", secretBlock(0)?.name ?? "")
if (noteInput(first) !== null) await type(noteInput(first), "")
check("备注可以清空", secretBlock(0)?.note === "", JSON.stringify(secretBlock(0)?.note))

// ---- 四、复制：走真值，按钮给反馈 ----

copyButton(first)?.click()
await settle()
check("复制拿的是明文而不是掩码", clipboardText === "sk-live-new-key-0001", String(clipboardText))
check("复制后按钮换成「已复制」", copyButton(first)?.title === "已复制", copyButton(first)?.title ?? "")

// ---- 五、空态 ----

check("空卡片给引导文案而不是八个点", maskedButton(second)?.textContent.trim() === "还没有填入密钥", maskedButton(second)?.textContent ?? "")
check("空卡片不让复制", copyButton(second)?.disabled === true)

// 空卡片从掩码态直接开打：点眼睛 → 输入 → 失焦，值落地后掩码起来。
eyeButton(second)?.click()
await settle()
const blank = valueInput(second)
check("空卡片点眼睛也能进明文", blank !== null)
if (blank !== null) await type(blank, "ghp_0000000000000000")
check("空卡片填完值写回了块", secretBlock(1)?.value === "ghp_0000000000000000", secretBlock(1)?.value ?? "")
document.activeElement?.blur()
await settle()

// ---- 六、切走再切回：掩码必须回来（明文不跨挂载活着） ----

// 先收成掩码当基线 —— 上面的用例把这张卡留在明文态过。
if (valueInput(first) !== null) {
  eyeButton(first)?.click()
  await settle()
}
check("基线是掩码态", valueInput(first) === null && maskedButton(first) !== null)
eyeButton(first)?.click()
await settle()
check("切走前是明文态", valueInput(first) !== null)

// 关掉这篇（标签没了 → 文档清空 → BlockEditor 卸掉）再打开：`revealed` 是组件局部状态。
workspace.closeTab(note?.id ?? "")
await settle()
check("关掉后编辑器里没有块了", cards().length === 0, `${cards().length} 张`)
workspace.openFile(note?.id ?? "")
for (let i = 0; i < 60 && workspace.activeDocument.value.length < 2; i += 1) {
  await new Promise((resolve) => setTimeout(resolve, 50))
}
await settle()
// 重新取景：卸载重建过，之前抓的元素已经是断开的旧节点。
const reopened = card(0)
check("重开笔记回到掩码态（明文不跨挂载活着）",
  valueInput(reopened) === null && maskedButton(reopened) !== null,
  `input=${valueInput(reopened) !== null} masked=${maskedButton(reopened) !== null}`)

// ---- 七、投影：块文本不含值 ----

const projection = workspace.activeDocument.value
  .filter((block) => block.type === "secret")
  .map((block) => `${block.name} ${block.note}`)
check("文档里没有第三张卡（块数没被撑大）", projection.length === 2, JSON.stringify(projection))

lines.push(failed === 0 ? `自检 ${passed}/${passed}` : `自检 ${passed} 过 / ${failed} 败`)
document.getElementById("out").textContent = lines.join("\n")
</script>
</body>
</html>
