<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置面板自检</title>
<style>
  /* 不写 font 简写：body 的家族必须由应用样式表的 @apply font-sans 决定，
     探针自己写一套会把被测链路盖掉（量到的就是探针的字体栈）。 */
  body { font-size: 13px; line-height: 1.6; margin: 0; padding: 24px; color: #1c1c1e; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  #app { margin: 0 0 16px; }
  pre { margin: 0; padding: 14px; background: #f6f6f7; border-radius: 10px; white-space: pre-wrap; }
  .ok { color: #1c7a3e; }
  .fail { color: #b42318; }
  /* 固定内容宽度，几何断言才有确定的分母 —— 与内容宽度偏好的 standard 档（800px）同口径。 */
  #app .doc { width: 800px; }
</style>
</head>
<body>
<h1>设置面板：显示 → 表格效果 / 内容宽度（持久化 / 渲染几何）自检</h1>
<div id="app"></div>
<pre id="out">running…</pre>
<script type="module">
import { createApp, defineComponent, h, nextTick, reactive, ref } from "vue"
// 必须引应用样式表：表格效果全靠 Tailwind 类（w-max / overflow-x-auto / whitespace-nowrap）落地，
// 不引 style.css 这些类根本不存在，几何断言会退化成 UA 默认值 —— 全成假象。
import "../src/style.css"
import BlockEditor from "../src/components/BlockEditor.vue"
import SettingsPanel from "../src/components/SettingsPanel.vue"
import TableBlockView from "../src/components/TableBlockView.vue"
import { provideSettings } from "../src/composables/useSettings.ts"
import { provideTheme } from "../src/composables/useTheme.ts"
import { provideWorkspace } from "../src/composables/useWorkspace.ts"
import { createTableBlock } from "../src/lib/blocks.ts"
import { textToRuns } from "../src/lib/inline.ts"
import * as table from "../src/lib/table.ts"
import { TABLE_SCROLL_GUTTER } from "../src/lib/typography.ts"

const lines = []
let passed = 0
let failed = 0

function check(name, ok, detail = "") {
  if (ok) { passed += 1; lines.push(`OK   ${name}`) }
  else { failed += 1; lines.push(`FAIL ${name} —— ${detail}`) }
}

let step = "准备"
function note(next) {
  step = next
  document.getElementById("out").textContent = `running: ${step}`
}
note(step)

const STORAGE_KEY = "webnote:table-effect"
window.localStorage.removeItem(STORAGE_KEY)
const WIDTH_KEY = "webnote:content-width"
window.localStorage.removeItem(WIDTH_KEY)
const FONT_KEY = "webnote:content-font"
const CODE_FONT_KEY = "webnote:code-font"
window.localStorage.removeItem(FONT_KEY)
window.localStorage.removeItem(CODE_FONT_KEY)

// ---------- 挂真实组件：设置面板 + 一个宽表格 ----------

/**
 * 表格刻意做宽（5 列、每格一段长文本）：换行模式下它被挤在 800px 里、
 * 每格高度撑起来；滚动模式下不换行、表格宽超过 800px、容器出横向滚动。
 * 两种效果的几何差异必须能被量出来，这是这个自检的全部意义。
 */
const WIDE_TEXT = "这是一段足够长的单元格内容用来把列撑开"
let rows = table.createGrid(5, 2, true)
rows = rows.map((row) => row.map((cell) => ({ ...cell, runs: textToRuns(WIDE_TEXT) })))
const block = reactive(createTableBlock(rows))

const open = ref(true)

const Root = defineComponent({
  setup() {
    provideTheme(provideSettings())
    provideWorkspace()
    // BlockEditor 也挂上：内容宽度偏好的几何断言量的是它那层 [data-doc] 容器
    // （computed maxWidth），比只验数据落盘多走一整段「设置 → 渲染」链路。
    return () => h("div", { class: "doc" }, [
      h(TableBlockView, { block }),
      h(BlockEditor),
      h(SettingsPanel, { open: open.value, "onUpdate:open": (v) => (open.value = v) }),
    ])
  },
})
createApp(Root).mount("#app")
await nextTick()

function tableEl() {
  return document.querySelector("#app table")
}
function cellAt(index) {
  return document.querySelectorAll("#app th, #app td")[index] ?? null
}

check("表格渲染出来了", tableEl() !== null)

// ---------- 一、默认值 ----------

note("默认值")
check(
  "默认是「内容自适应换行不滚动」（未存过任何值时）",
  window.localStorage.getItem(STORAGE_KEY) === null,
)
check(
  "默认下单元格文字换行（whitespace 不是 nowrap）",
  cellAt(0) !== null && getComputedStyle(cellAt(0)).whiteSpace !== "nowrap",
  cellAt(0) === null ? "（没渲染）" : getComputedStyle(cellAt(0)).whiteSpace,
)
check(
  "默认下 <table> 宽度不超容器（100% 语义）",
  tableEl() !== null && tableEl().getBoundingClientRect().width <= 800.5,
  tableEl() === null ? "（没渲染）" : String(tableEl().getBoundingClientRect().width),
)

// ---------- 二、面板本身 ----------
//
// 面板是 Dialog，reka 把内容 **portal 到 document.body**，所以选择器不能 scoped 到 `#app`。
// 页尾那个「坏值防御」用例又挂了第二份面板，所以这里取**第一份**（`querySelector` 天然取首个）。

note("面板")
function panelRoot() {
  return document.querySelector('[data-slot="sheet-content"]')
}
function optionByLabel(text) {
  const root = panelRoot()
  if (root === null) return undefined
  return [...root.querySelectorAll('[role="radio"]')].find((el) => el.textContent.includes(text))
}

const wrapOption = optionByLabel("内容自适应换行不滚动")
const scrollOption = optionByLabel("表格滚动")
check("面板里有两个选项", wrapOption !== undefined && scrollOption !== undefined)
check(
  "选项文案与需求逐字一致",
  wrapOption !== undefined &&
    scrollOption !== undefined &&
    wrapOption.textContent.includes("内容自适应换行不滚动") &&
    scrollOption.textContent.includes("表格滚动"),
)
check(
  "初始勾选在「换行不滚动」上",
  wrapOption !== undefined &&
    wrapOption.getAttribute("aria-checked") === "true" &&
    scrollOption !== undefined &&
    scrollOption.getAttribute("aria-checked") === "false",
)
const nav = panelRoot() === null ? null : panelRoot().querySelector("nav")
check("分区栏出现「显示」", nav !== null && nav.textContent.includes("显示"))

// ---------- 二点五、内容宽度 ----------
//
// 同时验两件事：面板上的档位（数据层）和 BlockEditor 正文列的 computed maxWidth（渲染层）。
// [data-doc] 是 BlockEditor 那层正文容器上的探针钩子，量它而不是量任意外层，
// 断言才钉在「设置 → 渲染」这段链路本身上。

note("内容宽度")
/**
 * 只在「内容宽度」的 radiogroup 里找档位 —— 不能全面板搜文字：表格效果那组的
 * hint（「表格**宽**度始终与正文一致」）也含「宽」字，会把点到表格选项上去。
 */
function widthOptionByLabel(text) {
  const root = panelRoot()
  if (root === null) return undefined
  const group = root.querySelector('[role="radiogroup"][aria-label="内容宽度"]')
  if (group === null) return undefined
  return [...group.querySelectorAll('[role="radio"]')].find((el) => el.textContent.includes(text))
}
const narrowOption = widthOptionByLabel("窄")
const standardOption = widthOptionByLabel("标准")
const wideOption = widthOptionByLabel("宽")
check(
  "面板里有三档内容宽度（窄 / 标准 / 宽）",
  narrowOption !== undefined && standardOption !== undefined && wideOption !== undefined,
)

const docEl = () => document.querySelector("#app [data-doc]")
check(
  "默认勾选在「标准」上",
  standardOption !== undefined && standardOption.getAttribute("aria-checked") === "true",
)
check(
  "默认下正文列 maxWidth 是 800px（standard 档）",
  docEl() !== null && getComputedStyle(docEl()).maxWidth === "800px",
  docEl() === null ? "（没渲染）" : getComputedStyle(docEl()).maxWidth,
)

if (wideOption !== undefined) {
  wideOption.click()
  await nextTick()
  await new Promise((resolve) => setTimeout(resolve, 30))
  await nextTick()
}
check("切到宽后落盘（键 webnote:content-width）", window.localStorage.getItem(WIDTH_KEY) === "wide",
  String(window.localStorage.getItem(WIDTH_KEY)))
check(
  "切到宽后正文列 maxWidth 变 1000px",
  docEl() !== null && getComputedStyle(docEl()).maxWidth === "1000px",
  docEl() === null ? "（没渲染）" : getComputedStyle(docEl()).maxWidth,
)

// 切回标准，别把宽档状态漏给后面的用例。
if (standardOption !== undefined) {
  standardOption.click()
  await nextTick()
  await new Promise((resolve) => setTimeout(resolve, 30))
  await nextTick()
}
check(
  "切回标准后正文列 maxWidth 回到 800px",
  docEl() !== null && getComputedStyle(docEl()).maxWidth === "800px",
  docEl() === null ? "（没渲染）" : getComputedStyle(docEl()).maxWidth,
)

// ---------- 三、切到「表格滚动」 ----------

note("切到滚动")

/**
 * 点选项。面板是 Dialog，内部按钮在 headless 里直接 click 即可 ——
 * 这里量的是数据与渲染，不是指针命中，不需要派 pointer 事件。
 */
if (scrollOption !== undefined) {
  scrollOption.click()
  await nextTick()
  await new Promise((resolve) => setTimeout(resolve, 30))
  await nextTick()
}

check("切换后落盘（键 webnote:table-effect）", window.localStorage.getItem(STORAGE_KEY) === "scroll",
  String(window.localStorage.getItem(STORAGE_KEY)))
check(
  "切换后勾选在「表格滚动」上",
  scrollOption !== undefined && scrollOption.getAttribute("aria-checked") === "true" &&
    wrapOption !== undefined && wrapOption.getAttribute("aria-checked") === "false",
)

const scrolled = tableEl()
check("滚动模式下单元格不换行", cellAt(0) !== null && getComputedStyle(cellAt(0)).whiteSpace === "nowrap",
  cellAt(0) === null ? "（没渲染）" : getComputedStyle(cellAt(0)).whiteSpace)
check(
  "滚动模式下表格宽度超过 800px 容器（内容撑开）",
  scrolled !== null && scrolled.getBoundingClientRect().width > 800.5,
  scrolled === null ? "（没渲染）" : String(scrolled.getBoundingClientRect().width),
)

/** 出滚动条的是套在 <table> 外面那层容器。 */
const scroller = scrolled === null ? null : scrolled.parentElement
check(
  "外层容器真的可横向滚动（scrollWidth > clientWidth）",
  scroller !== null && scroller.scrollWidth > scroller.clientWidth + 1,
  scroller === null ? "（没容器）" : `${scroller.scrollWidth} vs ${scroller.clientWidth}`,
)
check(
  "外层容器 overflow-x 是 auto",
  scroller !== null && ["auto", "scroll"].includes(getComputedStyle(scroller).overflowX),
  scroller === null ? "（没容器）" : getComputedStyle(scroller).overflowX,
)

// ---------- 三点二、细滚动条（降低存在感） ----------
//
// 系统那条横向滚动条在 Windows 上是 15px 高、带两端箭头，一进视野就把注意力吸走。
// 换成 6px 圆角细条后，量「滚动条占掉的高度 = offsetHeight - clientHeight」应当掉到 6。
// 这套样式只走 `::-webkit-scrollbar`：一旦写标准属性 `scrollbar-color`，Chromium 会
// 直接忽略整套 WebKit 伪元素、退回原生粗条 —— 所以顺带断言没被退回。
//
// 注意：headless shell 里 overlay 滚动条不占布局高度。若量出来是 0（内核判定为 overlay，
// 或 `::-webkit-scrollbar` 已被 gtk/overlay 接管），不能判失败 —— 那时唯一能验的是
// 类名挂上了、规则在样式表里。真机（WebView2）上这条断言才谈得上「高度」。

note("细滚动条")
check(
  "滚动容器挂了 table-scrollbar 类",
  scroller !== null && scroller.classList.contains("table-scrollbar"),
  scroller === null ? "（没容器）" : scroller.className,
)

/** 只判「声明里有没有 6px」，不判它是否真的占布局 —— overlay 内核下后者恒为 0。 */
const hasThinScrollbarRule = () => {
  for (const sheet of Array.from(document.styleSheets)) {
    let rules
    try {
      rules = sheet.cssRules
    } catch {
      continue // 跨源样式表（这里没有，防御性）
    }
    for (const rule of Array.from(rules)) {
      const text = rule.cssText ?? ""
      if (text.includes("::-webkit-scrollbar") && text.includes("6px")) return true
    }
  }
  return false
}
check("样式表里有 6px 的 ::-webkit-scrollbar 规则", hasThinScrollbarRule())

if (scroller !== null) {
  const gutter = scroller.offsetHeight - scroller.clientHeight
  if (gutter > 0) {
    check("滚动条占高 ≈ 6px（不是系统的 15px）", gutter <= 8, `offsetHeight-clientHeight=${gutter}`)
  } else {
    lines.push("INFO 滚动条不占布局高度（overlay 内核）—— 高度断言跳过，真机上再验")
  }
  // 标准属性一旦被写上，Chromium 会忽略整套 WebKit 伪元素。
  check(
    "没设置标准 scrollbar-color / scrollbar-width（否则会退回原生粗条）",
    getComputedStyle(scroller).scrollbarColor === "auto",
    `scrollbar-color=${getComputedStyle(scroller).scrollbarColor}`,
  )
}

// ---------- 三点三、滚动条与表格的间距 ----------
//
// 早先滚动条直接压在表格外框底边上，还切进了那 8px 圆角。修法是给容器加下内边距
// （`pb-2`，与表格圆角同档），把滚动条推进空隙里。这里量三件事：
// 下内边距真的加上了、表格底边确实退到了滚动条以上、内阴影跟着缩到表格底边为止。

note("滚动条间距")
if (scroller !== null) {
  check(
    `容器下内边距 = ${TABLE_SCROLL_GUTTER}px（把滚动条从表格底边推开）`,
    Math.abs(Number.parseFloat(getComputedStyle(scroller).paddingBottom) - TABLE_SCROLL_GUTTER) < 1,
    getComputedStyle(scroller).paddingBottom,
  )

  const gutterPx = scroller.offsetHeight - scroller.clientHeight
  if (gutterPx > 0) {
    const scBox = scroller.getBoundingClientRect()
    const tableBox = scrolled === null ? null : scrolled.getBoundingClientRect()
    const barTop = scBox.bottom - gutterPx
    // 表格底边必须在滚动条顶边以上 —— 相等就是紧贴，留出空隙才算推开。
    const gap = tableBox === null ? -1 : barTop - tableBox.bottom
    check("表格底边与滚动条之间有间距（不再叠在一起）", gap >= 0.5, `间距=${gap.toFixed(1)}px`)
  } else {
    lines.push("INFO 滚动条不占布局高度（overlay 内核）—— 间距断言跳过，真机上再验")
  }
}

// ---------- 三点五、右端内阴影（「右边还有内容」的提示） ----------
//
// 阴影是压在表格**上面**的一层覆盖元素（容器背景会被 th 底色盖住，试过，看不见）。
// 这里验它的显隐是否跟着滚动位置走：不在最右 → 露；在最右 → 收。

note("滚动阴影")
const shadow = scroller === null ? null : scroller.parentElement?.querySelector(".table-scroll-shadow")
check("阴影覆盖元素存在", shadow instanceof HTMLElement)
check(
  "阴影有渐变背景",
  shadow instanceof HTMLElement && getComputedStyle(shadow).backgroundImage.includes("linear-gradient"),
  shadow instanceof HTMLElement ? getComputedStyle(shadow).backgroundImage.slice(0, 60) : "（没元素）",
)
check(
  "阴影不吃指针事件（不能挡住格子编辑）",
  shadow instanceof HTMLElement && getComputedStyle(shadow).pointerEvents === "none",
  shadow instanceof HTMLElement ? getComputedStyle(shadow).pointerEvents : "（没元素）",
)

const shadowVisible = () => shadow instanceof HTMLElement && getComputedStyle(shadow).display !== "none"

/** 程序化滚动不会自动触发 scroll 处理器，得手动派一次事件。 */
async function scrollTo(value) {
  if (scroller === null) return
  scroller.scrollLeft = value
  scroller.dispatchEvent(new Event("scroll"))
  await nextTick()
  await new Promise((resolve) => setTimeout(resolve, 30))
}

if (scroller !== null) {
  await scrollTo(0)
  check("滚到最左 → 阴影显示", shadowVisible() === true)
  await scrollTo(scroller.scrollWidth)
  check("滚到最右 → 阴影隐藏", shadowVisible() === false)
  await scrollTo(Math.round((scroller.scrollWidth - scroller.clientWidth) / 2))
  check("滚回中间 → 阴影重新显示", shadowVisible() === true)
  await scrollTo(0)

  if (shadow instanceof HTMLElement) {
    const sr = scroller.getBoundingClientRect()
    const hr = shadow.getBoundingClientRect()
    check("阴影右缘贴滚动容器右缘", Math.abs(sr.right - hr.right) < 1.5, `${sr.right} vs ${hr.right}`)
    // 阴影不再铺满整条容器：底边抬起 TABLE_SCROLL_GUTTER，避开滚动条那条空隙。
    check(
      "阴影底边抬起，不盖住滚动条",
      Math.abs(sr.bottom - hr.bottom - TABLE_SCROLL_GUTTER) < 1.5,
      `容器底-阴影底=${(sr.bottom - hr.bottom).toFixed(1)}px，期望 ${TABLE_SCROLL_GUTTER}px`,
    )
    check(
      "阴影顶边贴容器顶（上方仍盖满）",
      Math.abs(hr.top - sr.top) < 1.5,
      `${hr.top} vs ${sr.top}`,
    )
  }
}

// ---------- 四、切回「换行不滚动」 ----------

note("切回换行")
if (wrapOption !== undefined) {
  wrapOption.click()
  await nextTick()
  await new Promise((resolve) => setTimeout(resolve, 30))
  await nextTick()
}
check("切回后落盘 wrap", window.localStorage.getItem(STORAGE_KEY) === "wrap",
  String(window.localStorage.getItem(STORAGE_KEY)))
check(
  "切回后表格宽度回到不超容器",
  tableEl() !== null && tableEl().getBoundingClientRect().width <= 800.5,
  tableEl() === null ? "（没渲染）" : String(tableEl().getBoundingClientRect().width),
)
check("切回后单元格恢复换行", cellAt(0) !== null && getComputedStyle(cellAt(0)).whiteSpace === "pre-wrap",
  cellAt(0) === null ? "（没渲染）" : getComputedStyle(cellAt(0)).whiteSpace)
check(
  "换行模式不出阴影（容器不可滚）",
  shadow instanceof HTMLElement && getComputedStyle(shadow).display === "none",
  shadow instanceof HTMLElement ? getComputedStyle(shadow).display : "（没元素）",
)
if (shadow instanceof HTMLElement && getComputedStyle(shadow).display !== "none") {
  const sc = shadow.parentElement?.firstElementChild
  lines.push(
    `INFO 阴影未隐藏: display=${getComputedStyle(shadow).display}；` +
      `容器 overflowX=${sc ? getComputedStyle(sc).overflowX : "?"} ` +
      `scrollWidth=${sc ? sc.scrollWidth : "?"} clientWidth=${sc ? sc.clientWidth : "?"} ` +
      `scrollLeft=${sc ? sc.scrollLeft : "?"}；` +
      `同一容器内阴影数量=${shadow.parentElement?.querySelectorAll(".table-scroll-shadow").length}`,
  )
}

// ---------- 四点四、标题导航 ----------
//
// 只验面板这一侧：开关与门槛有没有真的写进偏好、门槛的下限有没有兜住。
// 「菜单什么时候出现、点击跳不跳」在 heading-nav-check，那页才挂得动真编辑器。

note("标题导航")
const NAV_KEY = "webnote:heading-nav"
const MIN_KEY = "webnote:heading-nav-min"
window.localStorage.removeItem(NAV_KEY)
window.localStorage.removeItem(MIN_KEY)

const switches = panelRoot() === null ? [] : [...panelRoot().querySelectorAll('[role="switch"]')]
const navSwitch = switches.find((node) => node.textContent.includes("悬浮标题菜单"))
/** 显示分区里唯一的数字输入就是门槛（外观分区的经纬度只在「日出日落」档才渲染）。 */
const minInput = panelRoot() === null ? null : panelRoot().querySelector('input[type="number"]')

check("面板里有「标题导航」分区", panelRoot()?.textContent.includes("标题导航") === true)
check("开关默认是开的", navSwitch !== undefined && navSwitch.getAttribute("aria-checked") === "true")
check("门槛默认 5，下限写着 1", minInput !== null && minInput.value === "5" && minInput.getAttribute("min") === "1",
  minInput === null ? "（没有输入框）" : `value=${minInput.value} min=${minInput.getAttribute("min")}`)

navSwitch?.click()
await nextTick()
check("点开关关掉并落盘 false", window.localStorage.getItem(NAV_KEY) === "false",
  String(window.localStorage.getItem(NAV_KEY)))
check("关掉后门槛输入框禁用", minInput !== null && minInput.disabled === true)
navSwitch?.click()
await nextTick()
check("再点打开并落盘 true", window.localStorage.getItem(NAV_KEY) === "true",
  String(window.localStorage.getItem(NAV_KEY)))

if (minInput !== null) {
  minInput.value = "0"
  minInput.dispatchEvent(new Event("change", { bubbles: true }))
  await nextTick()
}
check("门槛写 0 被夹到 1 并落盘", window.localStorage.getItem(MIN_KEY) === "1",
  String(window.localStorage.getItem(MIN_KEY)))
check("夹过之后输入框里也是 1（不留下用户敲的 0）", minInput !== null && minInput.value === "1",
  minInput === null ? "（没有输入框）" : minInput.value)
window.localStorage.removeItem(NAV_KEY)
window.localStorage.removeItem(MIN_KEY)

// ---------- 四点五、字体 ----------
//
// 两层分开验：偏好落盘（localStorage）与它真的长到渲染上（<html> 内联的
// --font-sans / --font-mono，以及 body、.font-mono 元素确实消费到它们）。
// 浏览器路径下字体列表走内置候选（headless 没有 queryLocalFonts 权限），
// 所以候选项里一定有下面点名的那两个 —— 量的是链路，不是「这台机器装没装」。

note("字体")
await new Promise((resolve) => setTimeout(resolve, 700))

function fontTriggers() {
  return [...document.querySelectorAll('button[aria-label^="字体："]')]
}
function fontVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim()
}

check("面板里有内容 / 代码两个字体选择框", fontTriggers().length === 2, String(fontTriggers().length))
check(
  "初始两项都是「系统默认」",
  fontTriggers().length === 2 && fontTriggers().every((node) => node.textContent.includes("系统默认")),
  JSON.stringify(fontTriggers().map((node) => node.textContent.trim())),
)
check("默认下 --font-sans 是系统栈", fontVar("--font-sans").includes("sans-serif"), fontVar("--font-sans"))

/** 点开第 index 个选择框并选一项。列表项文本就是字体名（对勾没有文字），trim 后精确匹配。 */
async function pickFont(index, name) {
  const trigger = fontTriggers()[index]
  if (trigger === undefined) return false
  trigger.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }))
  trigger.click()
  await new Promise((resolve) => setTimeout(resolve, 250))
  const pop = document.querySelector('[data-slot="popover-content"]')
  if (pop === null) return false
  const item = [...pop.querySelectorAll("button")].find((node) => node.textContent.trim() === name)
  if (item === undefined) return false
  item.click()
  await new Promise((resolve) => setTimeout(resolve, 120))
  return true
}

check("能选到内容字体", await pickFont(0, "Microsoft YaHei"))
check(
  "内容字体落盘",
  window.localStorage.getItem(FONT_KEY) === "Microsoft YaHei",
  String(window.localStorage.getItem(FONT_KEY)),
)
check(
  "--font-sans 前置了用户字体",
  fontVar("--font-sans").startsWith('"Microsoft YaHei"'),
  fontVar("--font-sans"),
)
check(
  "body 实际用上（computed 含该字体）",
  getComputedStyle(document.body).fontFamily.includes("Microsoft YaHei"),
  getComputedStyle(document.body).fontFamily,
)

// .font-mono 这条 utility 页面里没人用，挂个探针元素量它 —— 与代码块消费的是同一条规则。
const monoProbe = document.createElement("div")
monoProbe.className = "font-mono"
document.body.appendChild(monoProbe)
check("能选到代码字体", await pickFont(1, "Consolas"))
check(
  "代码字体落盘",
  window.localStorage.getItem(CODE_FONT_KEY) === "Consolas",
  String(window.localStorage.getItem(CODE_FONT_KEY)),
)
check(
  "--font-mono 前置了用户字体",
  fontVar("--font-mono").startsWith('"Consolas"'),
  fontVar("--font-mono"),
)
check(
  ".font-mono 元素 computed 含该字体",
  getComputedStyle(monoProbe).fontFamily.includes("Consolas"),
  getComputedStyle(monoProbe).fontFamily,
)
monoProbe.remove()

check("能清回系统默认", await pickFont(0, "系统默认"))
check("清回后变量里没有用户字体", !fontVar("--font-sans").includes("Microsoft YaHei"), fontVar("--font-sans"))
check("清回后存的是空串（表示跟随系统）", window.localStorage.getItem(FONT_KEY) === "",
  String(window.localStorage.getItem(FONT_KEY)))

// ---------- 五、坏值防御 ----------

note("坏值防御")
window.localStorage.setItem(STORAGE_KEY, "bogus")
window.localStorage.setItem(WIDTH_KEY, "bogus")
const badOpen = ref(true)
const BadRoot = defineComponent({
  setup() {
    provideTheme(provideSettings())
    provideWorkspace()
    return () => h("div", { class: "doc" }, [
      h(TableBlockView, { block }),
      h(BlockEditor),
      h(SettingsPanel, { open: badOpen.value, "onUpdate:open": (v) => (badOpen.value = v) }),
    ])
  },
})
const badMount = document.createElement("div")
badMount.className = "doc"
// 必须显式给宽：样式表里的 `.doc { width: 800px }` 是 `#app .doc` 作用域的，这里挂在
// document.body 上取不到。不给的话宽度由视口决定 —— 探针窗口一放宽（WINDOW=1000），
// 「≤800px」这条断言就量到 952，变成假失败。
badMount.style.width = "800px"
document.body.appendChild(badMount)
createApp(BadRoot).mount(badMount)
await nextTick()
const badTable = badMount.querySelector("table")
check(
  "存了非法值时退回默认（不抛错、按 wrap 渲染）",
  badTable !== null && badTable.getBoundingClientRect().width <= 800.5,
  badTable === null ? "（没渲染）" : String(badTable.getBoundingClientRect().width),
)
const badDoc = badMount.querySelector("[data-doc]")
check(
  "宽度存了非法值时退回默认 800px",
  badDoc !== null && getComputedStyle(badDoc).maxWidth === "800px",
  badDoc === null ? "（没渲染）" : getComputedStyle(badDoc).maxWidth,
)

// ---------- 输出 ----------

lines.unshift(`—— ${passed} passed, ${failed} failed ——`)
document.getElementById("out").textContent = lines.join("\n")
document.getElementById("out").className = failed === 0 ? "ok" : "fail"
</script>
</body>
</html>
