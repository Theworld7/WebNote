<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>段落拆块自检</title>
<style>
  body { font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 24px; color: #1c1c1e; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  #app { margin: 0 0 16px; display: flex; height: 420px; }
  pre { margin: 0 0 8px; padding: 14px; background: #f6f6f7; border-radius: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>段落中间回车拆块：内容带去新块、格式保留、软换行不受影响</h1>
<!-- 脚本里有顶层 await（要等真实读盘），抓结果用 CDP 驱动跑：
     node design/cdp-dump.mjs http://localhost:1420/design/split-check.html -->
<div id="app"></div>
<pre id="out">running…</pre>
<script type="module">
import "../src/style.css"
import { createApp, defineComponent, h, nextTick } from "vue"
import { TooltipProvider } from "../src/components/ui/tooltip/index.ts"
import BlockEditor from "../src/components/BlockEditor.vue"
import { provideSettings } from "../src/composables/useSettings.ts"
import { provideWorkspace } from "../src/composables/useWorkspace.ts"
import { rangeForOffsets } from "../src/lib/marks.ts"

const out = document.querySelector("#out")
const lines = []
let passed = 0
let failed = 0

addEventListener("error", (event) => {
  out.textContent = `ERROR ${event.message}\n${lines.join("\n")}`
})
addEventListener("unhandledrejection", (event) => {
  const reason = event.reason
  out.textContent = `REJECT ${reason instanceof Error ? reason.message : String(reason)}\n${lines.join("\n")}`
})

function check(name, ok, detail = "") {
  if (ok) { passed += 1; lines.push(`OK   ${name}`) }
  else { failed += 1; lines.push(`FAIL ${name} —— ${detail}`) }
  out.textContent = `running: ${lines.join("\n")}`
}

/** 等历史记账的静默窗口过去。 */
const quiet = () => new Promise((resolve) => setTimeout(resolve, 600))
const settle = () => new Promise((resolve) => setTimeout(resolve, 30))

const opfs = await navigator.storage.getDirectory()
const dir = await opfs.getDirectoryHandle("split-probe", { create: true })
const file = await dir.getFileHandle("a.html", { create: true })
const writable = await file.createWritable()
await writable.write("<p>普通<strong>重点</strong>收尾</p>")
await writable.close()
window.showDirectoryPicker = async () => dir

let workspace = null
const Root = defineComponent({
  setup() {
    workspace = provideWorkspace()
    provideSettings()
    return () => h(TooltipProvider, null, { default: () => h(BlockEditor) })
  },
})
createApp(Root).mount("#app")
await nextTick()
await workspace.bootstrap()
await workspace.openRoot()
await nextTick()

const note = workspace.tree.value.find((node) => node.kind === "note")
check("扫到了预置笔记", note !== null)
if (note === undefined) {
  lines.push(`自检 ${passed}/${passed + failed}`)
  out.textContent = lines.join("\n")
} else {
  workspace.openFile(note.id)
  for (let i = 0; i < 60 && workspace.activeDocument.value.length < 1; i += 1) {
    await new Promise((resolve) => setTimeout(resolve, 50))
  }
  await nextTick()
  await run()
}

function rows() { return [...document.querySelectorAll("[data-block-id]")] }
function bodies() { return rows().map((row) => row.querySelector("[contenteditable]")) }
function storeTexts() { return workspace.activeDocument.value.map((b) => b.runs.map((r) => r.text).join("")) }
function domTexts() { return bodies().map((body) => body.innerText) }
function storeRuns() { return workspace.activeDocument.value.map((b) => b.runs) }

/** 光标折叠到正文第 offset 个字符处（偏移口径与 runsText 一致，<br> 占 1）。 */
function caretAt(body, offset) {
  const range = rangeForOffsets(body, { start: offset, end: offset })
  const selection = window.getSelection()
  selection.removeAllRanges()
  selection.addRange(range)
}

function pressEnter(body, opts = {}) {
  const event = new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true, ...opts })
  body.dispatchEvent(event)
  return event
}

async function typeInto(index, html) {
  const body = bodies()[index]
  body.focus()
  body.innerHTML = html
  body.dispatchEvent(new Event("input", { bubbles: true }))
  await nextTick()
}

async function run() {
  const [first] = storeRuns()
  check("预置富文本解析成 3 段 runs", first.length === 3, JSON.stringify(first))
  check("中间一段带加粗", first[1].marks.includes("bold"), JSON.stringify(first[1]))

  // ---- 段落中间回车：光标后的内容带去新块 ----
  bodies()[0].focus()
  caretAt(bodies()[0], 3) // 「重点」中间
  pressEnter(bodies()[0])
  await nextTick()
  await settle()
  check("拆成两个块", rows().length === 2, `实际 ${rows().length}`)
  check("前半留在本块", storeTexts()[0] === "普通重", JSON.stringify(storeTexts()))
  check("后半带去新块", storeTexts()[1] === "点收尾", JSON.stringify(storeTexts()))
  check("前半保留加粗", storeRuns()[0][1]?.marks.includes("bold") === true, JSON.stringify(storeRuns()[0]))
  check("后半保留加粗", storeRuns()[1][0]?.marks.includes("bold") === true, JSON.stringify(storeRuns()[1]))
  check("DOM 与数据同步", domTexts()[0] === "普通重" && domTexts()[1] === "点收尾", JSON.stringify(domTexts()))
  check("焦点落在新块开头", document.activeElement === bodies()[1])

  await quiet()
  await undoKey()
  check("拆块一步撤销", rows().length === 1 && storeTexts()[0] === "普通重点收尾", JSON.stringify(storeTexts()))
  check("撤销后加粗 run 完整", storeRuns()[0].length === 3 && storeRuns()[0][1].marks.includes("bold"), JSON.stringify(storeRuns()[0]))

  await redoKey()
  check("拆块可重做", rows().length === 2 && storeTexts()[1] === "点收尾", JSON.stringify(storeTexts()))
  await undoKey()
  check("退回单块继续下一组用例", rows().length === 1, `实际 ${rows().length}`)

  // ---- Shift+Enter 是块内软换行，不能被拆块逻辑接管 ----
  bodies()[0].focus()
  caretAt(bodies()[0], 1)
  const soft = pressEnter(bodies()[0], { shiftKey: true })
  await nextTick()
  check("Shift+Enter 不被接管", soft.defaultPrevented === false)
  check("Shift+Enter 不拆块", rows().length === 1, `实际 ${rows().length}`)

  // ---- 软换行（\n）跟着后半一起走 ----
  await typeInto(0, "甲<br>乙")
  check("软换行回读成 \\n", storeTexts()[0] === "甲\n乙", JSON.stringify(storeTexts()))
  // 打字先定格成独立一步，拆块才能单独撤销。
  await quiet()
  bodies()[0].focus()
  caretAt(bodies()[0], 1) // \n 之前
  pressEnter(bodies()[0])
  await nextTick()
  await settle()
  check("软换行拆块：后半带着 \\n 走", rows().length === 2 && storeTexts()[1] === "\n乙", JSON.stringify(storeTexts()))

  await quiet()
  await undoKey()
  check("软换行拆块一步撤销", rows().length === 1 && storeTexts()[0] === "甲\n乙", JSON.stringify(storeTexts()))

  // ---- 光标在段首：整段后移，本块留空 ----
  bodies()[0].focus()
  caretAt(bodies()[0], 0)
  pressEnter(bodies()[0])
  await nextTick()
  await settle()
  check("段首回车：本块留空、整段去新块", rows().length === 2 && storeTexts()[0] === "" && storeTexts()[1] === "甲\n乙", JSON.stringify(storeTexts()))

  await quiet()
  await undoKey()

  // ---- 光标在末尾：维持原行为，插空块 ----
  bodies()[0].focus()
  caretAt(bodies()[0], storeTexts()[0].length)
  pressEnter(bodies()[0])
  await nextTick()
  await settle()
  check("末尾回车：插空块（原行为）", rows().length === 2 && storeTexts()[0] === "甲\n乙" && storeTexts()[1] === "", JSON.stringify(storeTexts()))
}

async function undoKey() {
  const event = new KeyboardEvent("keydown", { key: "z", ctrlKey: true, cancelable: true, bubbles: true })
  document.dispatchEvent(event)
  await nextTick()
  await new Promise((resolve) => setTimeout(resolve, 30))
  return event.defaultPrevented
}

async function redoKey() {
  const event = new KeyboardEvent("keydown", { key: "z", ctrlKey: true, shiftKey: true, cancelable: true, bubbles: true })
  document.dispatchEvent(event)
  await nextTick()
  await new Promise((resolve) => setTimeout(resolve, 30))
  return event.defaultPrevented
}

lines.push(`自检 ${passed}/${passed + failed}`)
out.textContent = lines.join("\n")
</script>
</body>
</html>
