<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>标签栏自检</title>
<style>
  body { font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 24px; color: #1c1c1e; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  /* 必须是 flex row：真实布局里标签栏是标签行里的一个 flex 子项（父级是 TitleBar 的
     `flex h-9 items-center`），宽度按内容收缩、max-w-full 封顶后才横向滚动。
     探针里给它一个块级父容器的话它直接撑满整行，右缘几何就没法量。 */
  #app { margin: 0 0 16px; display: flex; align-items: center; }
  pre { margin: 0; padding: 14px; background: #f6f6f7; border-radius: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>标签栏：保存按钮的显隐自检</h1>
<div id="app"></div>
<pre id="out">running…</pre>
<script type="module">
import { createApp, defineComponent, h, nextTick } from "vue"
// 必须引应用样式表：显隐断言查的是 Tailwind 工具类的计算样式，
// 不引 style.css 的话 `hidden` / `inline-block` 都不存在，断言会假通过或假失败。
import "../src/style.css"
import { TooltipProvider } from "../src/components/ui/tooltip/index.ts"
import EditorTabBar from "../src/components/EditorTabBar.vue"
import { provideSettings } from "../src/composables/useSettings.ts"
import { provideTheme } from "../src/composables/useTheme.ts"
import { provideWorkspace } from "../src/composables/useWorkspace.ts"

const lines = []
let passed = 0
let failed = 0

function check(name, ok, detail = "") {
  if (ok) { passed += 1; lines.push(`OK   ${name}`) }
  else { failed += 1; lines.push(`FAIL ${name} —— ${detail}`) }
}

/**
 * 从真实的渲染结果里找保存入口，不碰内部状态。
 *
 * 它是标签项里的一枚「保存图标」（`aria-label="保存"` 的 span，点它就是存这一页），没有
 * 文字 —— 早先那版是写着「保存」二字的独立按钮，随「保存钮移入标签项」改成了这个形态，
 * 这里的断言跟着认可及名而不是文案。
 */
function saveButton() {
  return document.querySelector('[aria-label="保存"]') ?? undefined
}

/** 标签按钮本体。脏态标记（图标按钮 / 圆点）都是常驻 DOM 靠 hidden 切换，所以要看计算样式。 */
function tabButtons() {
  return [...document.querySelectorAll('button[class*="group/tab"]')]
}

function visible(el) {
  return el !== undefined && getComputedStyle(el).display !== "none"
}

/** 某张标签项里的保存入口 —— 激活的脏标签把自己变成「点这里存」的按钮。 */
function saveIn(button) {
  return button.querySelector('[aria-label="保存"]') ?? undefined
}

function dotIn(button) {
  return [...button.querySelectorAll("span")].find((s) =>
    (s.getAttribute("class") ?? "").includes("size-1.5"),
  )
}

let workspace = null
const Root = defineComponent({
  setup() {
    // 工作区一侧要读设置（表格整合视图等），主题推导也读同一份 —— 不 provide 就当场抛。
    provideTheme(provideSettings())
    workspace = provideWorkspace()
    return () => h(TooltipProvider, null, { default: () => h(EditorTabBar) })
  },
})

createApp(Root).mount("#app")
await nextTick()

check("初始（无标签）不出现保存按钮", saveButton() === undefined)

workspace.tabs.value = [{ path: "a.html", dirty: false }]
workspace.activePath.value = "a.html"
await nextTick()
check("激活的标签干净 → 不出现", saveButton() === undefined)

workspace.tabs.value[0].dirty = true
await nextTick()
const shown = saveButton()
check("激活的标签变脏 → 出现", shown !== undefined)
check("按钮的可及名是「保存」", shown !== undefined && shown.getAttribute("aria-label") === "保存")
check("激活的脏标签里就是那枚保存图标", visible(saveIn(tabButtons()[0])))
check("激活的脏标签不显示圆点", !visible(dotIn(tabButtons()[0])))

workspace.tabs.value.push({ path: "b.html", dirty: false, dirtyTables: [] })
workspace.activePath.value = "b.html"
await nextTick()
check("切到干净标签 → 隐藏", saveButton() === undefined)
check("此时仍存在未保存标签（脏态没被清掉）", workspace.hasDirty.value === true)
check("非激活的脏标签只显示圆点，没有保存图标", saveIn(tabButtons()[0]) === undefined && visible(dotIn(tabButtons()[0])))
check("干净的激活标签两种脏标记都没有", saveIn(tabButtons()[1]) === undefined && !visible(dotIn(tabButtons()[1])))

workspace.activePath.value = "a.html"
await nextTick()
check("切回脏标签 → 重现", saveButton() !== undefined)

workspace.tabs.value[1].dirty = true
await nextTick()
check("两个标签都脏、激活项也脏 → 仍只有一个按钮", document.querySelectorAll("button").length > 0 && saveButton() !== undefined)

workspace.tabs.value = workspace.tabs.value.map((tab) => ({ ...tab, dirty: false }))
await nextTick()
check("全部保存后 → 隐藏", saveButton() === undefined)

workspace.activePath.value = ""
await nextTick()
check("无激活标签 → 隐藏", saveButton() === undefined)

// ---- 结构 ----
//
// 「在目录中定位」从来没有接过 click，点了没反应，已连同那个只剩它一个按钮的动作组
// 一起删掉。ADR-0024 之后标签条也不再自带浮岛外壳：它是窗口 chrome 里的一个片段，
// 宽度按内容收缩、放不下就滚动，左右不再有那层 p-1（间距现在由 chrome 的 gap 承担）。

const EPS = 0.5
/** 组件根。它常驻（chrome 里要占住自己的位置），只有内部的滚动容器按「有没有标签」挂。 */
const rootOf = () => document.querySelector('[class*="group/tabs"]')
const scrollerOf = () => rootOf()?.querySelector('[class*="overflow-x-auto"]') ?? null
const leftOf = (el) => el.getBoundingClientRect().left
const rightOf = (el) => el.getBoundingClientRect().right

workspace.tabs.value = []
workspace.activePath.value = ""
await nextTick()
check("未打开文件时不渲染滚动容器", scrollerOf() === null)
check("「更多」按钮已移除", document.querySelector('button[aria-label="更多"]') === null)

workspace.tabs.value = [{ path: "a.html", dirty: false, dirtyTables: [] }]
workspace.activePath.value = "a.html"
await nextTick()
check("「在目录中定位」已移除（曾是没接事件的死按钮）",
  document.querySelector('button[aria-label="在目录中定位"]') === null)
check("打开文件后标签区挂上滚动容器", scrollerOf() !== null)

// ---- 几何：标签条就是组件根，不再有内边距把它推离边缘 ----
//
// 曾经浮岛里还有动作组，要锁「间隔只由 gap 一处承担」；动作组删掉后又锁过「标签条贴着
// 浮岛的 p-1」。现在外壳撤了，要锁的是**没有残留内边距**：滚动容器必须与组件根同缘。

workspace.tabs.value = [
  { path: "a.html", dirty: false, dirtyTables: [] },
  { path: "b.html", dirty: false, dirtyTables: [] },
]
workspace.activePath.value = "b.html"
await nextTick()

const root = rootOf()
const scroller = scrollerOf()
const gapLeft = root && scroller ? leftOf(scroller) - leftOf(root) : null
const gapRight = root && scroller ? rightOf(root) - rightOf(scroller) : null
check(
  "有标签时标签条存在且是横向滚动容器（超出滚动而非截断）",
  scroller !== null && scroller !== undefined,
)
check(
  "标签条左缘贴组件根左缘（没有残留的浮岛内边距）",
  gapLeft !== null && Math.abs(gapLeft) < EPS,
  gapLeft === null ? "标签条或根缺失" : `实际 ${gapLeft.toFixed(1)}`,
)
check(
  "标签条右缘贴组件根右缘（没有残留的动作组占位）",
  gapRight !== null && Math.abs(gapRight) < EPS,
  gapRight === null ? "标签条或根缺失" : `实际 ${gapRight.toFixed(1)}`,
)
check(
  "标签区不再有圆角外壳（浮岛那层壳归 chrome）",
  root !== null && root !== undefined && !(root.getAttribute("class") ?? "").includes("rounded"),
  root ? (root.getAttribute("class") ?? "") : "根缺失",
)

// 标签变脏会长出「保存」按钮 —— 现在标签区宽度只由标签条决定。
workspace.tabs.value[1].dirty = true
await nextTick()
const gapRightDirty = root && scroller ? rightOf(root) - rightOf(scroller) : null
check(
  "长出保存按钮后标签条右缘仍贴根",
  gapRightDirty !== null && Math.abs(gapRightDirty) < EPS,
  gapRightDirty === null ? "标签条或根缺失" : `实际 ${gapRightDirty.toFixed(1)}`,
)

// ---- 滚动行为 ----
//
// 类名断言防不住「滚动链断了」：外层一旦不可收缩（flex-none），滚动容器永远不溢出、
// 类名原样挂着却滚不动。这里塞够多的标签，断言溢出真实发生、scrollLeft 真的能动。
workspace.tabs.value = Array.from({ length: 12 }, (_, i) => ({ path: `第${i}章.html`, dirty: false, dirtyTables: [] }))
workspace.activePath.value = "第11章.html"
await nextTick()

const scrollerWide = scrollerOf()
check(
  "标签多到放不下时滚动区真的溢出",
  scrollerWide !== null && scrollerWide !== undefined && scrollerWide.scrollWidth > scrollerWide.clientWidth,
  scrollerWide === null || scrollerWide === undefined
    ? "滚动容器缺失"
    : `scrollWidth ${scrollerWide.scrollWidth} vs clientWidth ${scrollerWide.clientWidth}`,
)
if (scrollerWide !== null && scrollerWide !== undefined) scrollerWide.scrollLeft = 9999
await nextTick()
check(
  "滚动容器能实际滚动（scrollLeft 生效）",
  scrollerWide !== null && scrollerWide !== undefined && scrollerWide.scrollLeft > 0,
  `scrollLeft ${scrollerWide?.scrollLeft ?? "缺失"}`,
)

lines.push(`自检 ${passed}/${passed + failed}`)
document.getElementById("out").textContent = lines.join("\n")
</script>
</body>
</html>
