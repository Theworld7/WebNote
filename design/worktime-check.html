<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工时块自检</title>
<style>
  body { font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 24px; color: #1c1c1e; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  #app { margin: 0 0 16px; }
  pre { margin: 0; padding: 14px; background: #f6f6f7; border-radius: 10px; white-space: pre-wrap; }
  .ok { color: #1c7a3e; }
  .fail { color: #b42318; }
</style>
</head>
<body>
<h1>工时块：池与余额、逐笔有效期与 FIFO、周期发放与结转、工龄折算、快照+指针往返</h1>
<div id="app"></div>
<pre id="out">running…</pre>
<script>
  // 模块级异常不会进 #out（import 在模块体之前执行），这里先把错误显示出来，
  // cdp-dump 认 `ERROR` 前缀并据此收工。
  window.addEventListener("error", (event) => {
    const out = document.getElementById("out")
    if (out) out.textContent = `ERROR ${event.message} @ ${event.filename}:${event.lineno}:${event.colno}`
  })
  window.addEventListener("unhandledrejection", (event) => {
    const out = document.getElementById("out")
    if (out) out.textContent = `REJECT ${String(event.reason)}`
  })
</script>
<script type="module">
import { BLOCK_TYPES, CELL_EXCLUDED_TYPES, blockText, cloneBlock, createBlock, createWorktimeBlock, REFERENCE_INSERT_SPEC, refPathsOf, retypeBlock } from "../src/lib/blocks.ts"
import { createOptionId, emptyColumn } from "../src/lib/data-table.ts"
import { DATA_TABLE_VERSION } from "../src/types/data-table.ts"
import {
  accrualDays,
  addDays,
  addMonths,
  createWorktimePreset,
  decodeWorktimePolicies,
  diffDays,
  encodeWorktimePolicies,
  formatQuantity,
  periodAt,
  seniorityYears,
  tierDays,
  WORKTIME_POLICY_DEFAULT,
  worktimePolicy,
  worktimeReport,
  worktimeRoles,
} from "../src/lib/worktime.ts"
import { blocksToHtml } from "../src/lib/html/serialize.ts"
import { parseHtml } from "../src/lib/html/parse.ts"

const lines = []
let passed = 0
let failed = 0
let step = "块类型登记"

function check(name, ok, detail = "") {
  if (ok) { passed += 1; lines.push(`OK   ${name}`) }
  else { failed += 1; lines.push(`FAIL ${name} —— ${detail}`) }
  document.getElementById("out").textContent = `running: ${step}\n${lines.join("\n")}`
}

function note(next) {
  step = next
  document.getElementById("out").textContent = `running: ${step}\n${lines.join("\n")}`
}

let rowSeq = 0

function makeTable(defs, rows) {
  const columns = defs.map(([name, type, options]) => {
    const column = emptyColumn(name, type)
    if (options) column.options.push(...options.map((text) => ({ id: createOptionId(), name: text })))
    return column
  })
  const dataRows = rows.map((cells) => {
    rowSeq += 1
    const values = {}
    columns.forEach((column, index) => {
      const value = cells[index]
      values[column.id] = value === undefined ? (column.type === "checkbox" ? false : null) : value
    })
    return { id: `r${rowSeq}`, values }
  })
  return { table: { version: DATA_TABLE_VERSION, columns, rows: dataRows }, columns, rows: dataRows }
}

function optionId(column, name) {
  const option = column.options.find((item) => item.name === name)
  if (option === undefined) throw new Error(`没有选项 ${name}`)
  return option.id
}

function policy(patch) {
  return {
    ...WORKTIME_POLICY_DEFAULT,
    tiers: WORKTIME_POLICY_DEFAULT.tiers.map((tier) => ({ ...tier })),
    ...patch,
  }
}

/** 一张工时表 + 一个按列名指好的块。 */
function setup(defs, rows, policies, options = {}) {
  const built = makeTable(defs, rows)
  const pick = (name) => built.columns.find((column) => column.name === name)
  const block = createWorktimeBlock("考勤.tbl", {
    date: pick("日期").id,
    person: pick("人员") ? pick("人员").id : "",
    kind: pick("类别").id,
    amount: pick("时长").id,
    note: pick("事由") ? pick("事由").id : "",
    status: pick("状态") ? pick("状态").id : "",
    hire: pick("入职日期") ? pick("入职日期").id : "",
  }, policies)
  if (options.statusValue !== undefined) block.statusValue = options.statusValue
  if (options.showLots !== undefined) block.showLots = options.showLots
  if (options.soonDays !== undefined) block.soonDays = options.soonDays
  const roles = worktimeRoles(built.columns, block)
  return { ...built, block, roles, pick }
}

// ---------- 一、块类型登记 ----------

note(step)

const meta = BLOCK_TYPES.find((item) => item.type === "worktime")
check("BLOCK_TYPES 里有 worktime", meta !== undefined, JSON.stringify(meta))
check("菜单分组是「媒体与数据」", meta !== undefined && meta.group === "媒体与数据", meta && meta.group)
check("简拼是 gs", meta !== undefined && meta.initials === "gs", meta && meta.initials)
check("格子内不可插入（引用块按 REFERENCE_BLOCK_TYPES 派生）", CELL_EXCLUDED_TYPES.includes("worktime"))
check("createBlock('worktime') 造得出块", createBlock("worktime").type === "worktime")
check("blockText 取路径", blockText(createWorktimeBlock("a/b.tbl")) === "a/b.tbl")
check("refPathsOf 认得工时块的路径", refPathsOf([createWorktimeBlock("考勤.tbl")]).join(",") === "考勤.tbl")

const source = createWorktimeBlock("x.tbl", {}, { a: policy({ fixedDays: 7 }) })
const cloned = cloneBlock(source, "new-id")
check(
  "cloneBlock 深拷 rules（改一份不动另一份）",
  cloned.type === "worktime" && cloned.policies.a.fixedDays === 7 && cloned.policies.a.tiers !== source.policies.a.tiers,
  JSON.stringify(cloned.policies),
)
check("转成正文再转回来不崩", retypeBlock(createWorktimeBlock("x.tbl"), "text").type === "text")

// ---------- 二、日期与周期 ----------

note("日期与周期")

check("addMonths 跨月收日（01-31 + 1 月）", addMonths("2026-01-31", 1) === "2026-02-28", addMonths("2026-01-31", 1))
check("addDays 跨年", addDays("2026-12-31", 1) === "2027-01-01", addDays("2026-12-31", 1))
check("diffDays", diffDays("2026-10-26", "2027-01-20") === 86, String(diffDays("2026-10-26", "2027-01-20")))

const calendar = policy({ reset: "calendar" })
const p2026 = periodAt("2026-10-26", calendar, "")
check("自然年周期 2026", p2026.start === "2026-01-01" && p2026.end === "2026-12-31", JSON.stringify(p2026))

const fiscal = policy({ reset: "fiscal", resetMonthDay: "04-01" })
const pFiscal = periodAt("2026-10-26", fiscal, "")
check("财年 04-01 起算：10 月落在 2026-04-01 ~ 2027-03-31",
  pFiscal.start === "2026-04-01" && pFiscal.end === "2027-03-31", JSON.stringify(pFiscal))
check("财年 04-01 起算：3 月落在上一财年",
  periodAt("2026-03-15", fiscal, "").start === "2025-04-01", JSON.stringify(periodAt("2026-03-15", fiscal, "")))

const anniversary = policy({ reset: "anniversary" })
const pHire = periodAt("2026-10-26", anniversary, "2020-07-15")
check("入职周年周期", pHire.start === "2026-07-15" && pHire.end === "2027-07-14", JSON.stringify(pHire))

// ---------- 三、年假发放 ----------

note("年假发放")

const tiers = WORKTIME_POLICY_DEFAULT.tiers
check("工龄满 9 年取 5 天档", tierDays(tiers, 9) === 5, String(tierDays(tiers, 9)))
check("工龄满 10 年取 10 天档", tierDays(tiers, 10) === 10, String(tierDays(tiers, 10)))
check("工龄满 20 年取 15 天档", tierDays(tiers, 22) === 15, String(tierDays(tiers, 22)))
check("seniorityYears 未到周年算 9 年", seniorityYears("2016-05-01", "2026-01-01") === 9, String(seniorityYears("2016-05-01", "2026-01-01")))
check("seniorityYears 到周年当天算 10 年", seniorityYears("2016-05-01", "2026-05-01") === 10, String(seniorityYears("2016-05-01", "2026-05-01")))

const seniorityPolicy = policy({ reset: "calendar", autoGrant: true, accrual: "seniority", prorate: false })
check("按工龄：2026 期发 5 天（9 年工龄）", accrualDays(seniorityPolicy, "2016-05-01", p2026) === 5, String(accrualDays(seniorityPolicy, "2016-05-01", p2026)))
check("按工龄：2027 期发 10 天（10 年工龄）",
  accrualDays(seniorityPolicy, "2016-05-01", { start: "2027-01-01", end: "2027-12-31" }) === 10,
  String(accrualDays(seniorityPolicy, "2016-05-01", { start: "2027-01-01", end: "2027-12-31" })))

const fixedProrate = policy({ reset: "calendar", autoGrant: true, accrual: "fixed", fixedDays: 12, prorate: true })
check("入职当年折算：7 月入职 → 6 个月 → 6 天",
  accrualDays(fixedProrate, "2026-07-01", p2026) === 6, String(accrualDays(fixedProrate, "2026-07-01", p2026)))
check("非入职当年不折算",
  accrualDays(fixedProrate, "2019-07-01", p2026) === 12, String(accrualDays(fixedProrate, "2019-07-01", p2026)))
check("入职前的期不发额度",
  accrualDays(fixedProrate, "2027-03-01", p2026) === 0, String(accrualDays(fixedProrate, "2027-03-01", p2026)))

// ---------- 四、逐笔有效期与 FIFO ----------

note("逐笔有效期与 FIFO")

const compTable = setup(
  [["日期", "date"], ["类别", "select", ["调休"]], ["时长", "number"]],
  [["2026-05-01", null], ["2026-07-01", null], ["2026-07-10", null]],
  {},
)
const compOption = compTable.pick("类别").options[0].id
compTable.rows[0].values[compTable.pick("类别").id] = compOption
compTable.rows[0].values[compTable.pick("时长").id] = 8
compTable.rows[1].values[compTable.pick("类别").id] = compOption
compTable.rows[1].values[compTable.pick("时长").id] = 4
compTable.rows[2].values[compTable.pick("类别").id] = compOption
compTable.rows[2].values[compTable.pick("时长").id] = -6
compTable.block.policies = { [compOption]: policy({ unit: "hour", validityMonths: 3 }) }

const compReport = worktimeReport(compTable.rows, compTable.roles, compTable.block, "2026-09-15")
const compPool = compReport.pools[0]
check("调休池只有一个", compReport.pools.length === 1, String(compReport.pools.length))
check("可用余额 4（先扣最早到期的 8 小时）", compPool.available === 4, String(compPool.available))
check("已作废 2（第一笔在 08-01 到期时还剩 2）", compPool.expired === 2, String(compPool.expired))
check("本期已用 6", compPool.used === 6, String(compPool.used))
check("正数行记作「补入」而不是「应享」", compPool.added === 12 && compPool.granted === 0,
  `${compPool.added} / ${compPool.granted}`)
check("批次按到期日排序", compPool.lots.length === 2 && compPool.lots[0].expiresOn === "2026-08-01" && compPool.lots[1].expiresOn === "2026-10-01",
  JSON.stringify(compPool.lots.map((lot) => lot.expiresOn)))
check("FIFO 命中的是 05-01 那笔（已用 6）", compPool.lots[0].used === 6, String(compPool.lots[0].used))
check("07-10 这行发生后的余额 = 6", compReport.rows.get(compTable.rows[2].id).balance === 6,
  JSON.stringify(compReport.rows.get(compTable.rows[2].id)))
check("使用行不标有效期", compReport.rows.get(compTable.rows[2].id).expiresOn === "")
check("正数行标出该笔到期日", compReport.rows.get(compTable.rows[1].id).expiresOn === "2026-10-01",
  compReport.rows.get(compTable.rows[1].id).expiresOn)

const expiredOnly = worktimeReport(compTable.rows, compTable.roles, compTable.block, "2026-12-01")
check("全部过期后余额归零", expiredOnly.pools[0].available === 0, String(expiredOnly.pools[0].available))
check("全部过期后作废 6", expiredOnly.pools[0].expired === 6, String(expiredOnly.pools[0].expired))

// ---------- 五、周期发放与结转 ----------

note("周期发放与结转")

const annualTable = setup(
  [["日期", "date"], ["类别", "select", ["年假"]], ["时长", "number"]],
  [["2025-06-01"], ["2026-02-10"]],
  {},
)
const annualOption = annualTable.pick("类别").options[0].id
annualTable.rows[0].values[annualTable.pick("类别").id] = annualOption
annualTable.rows[0].values[annualTable.pick("时长").id] = -3
annualTable.rows[1].values[annualTable.pick("类别").id] = annualOption
annualTable.rows[1].values[annualTable.pick("时长").id] = -2
annualTable.block.policies = {
  [annualOption]: policy({ unit: "day", reset: "calendar", autoGrant: true, accrual: "fixed", fixedDays: 10, carryOverMax: 5, carryOverDeadline: "03-31", prorate: false }),
}

const annual = worktimeReport(annualTable.rows, annualTable.roles, annualTable.block, "2026-10-26").pools[0]
check("本年可用 10（2026 期额度还没用）", annual.available === 10, String(annual.available))
check("本年应享 10（规则自动发放）", annual.granted === 10, String(annual.granted))
check("自动发放的池没有「补入」", annual.added === 0, String(annual.added))
check("本年结转进来 5（去年剩 7，上限 5）", annual.carryIn === 5, String(annual.carryIn))
check("本年已用 2（扣的是结转那笔）", annual.used === 2, String(annual.used))
check("作废 5（去年没结转的 2 + 结转额度 03-31 过期剩的 3）", annual.expired === 5, String(annual.expired))
check("批次里第一笔是结转", annual.lots[0].label === "上期结转", annual.lots[0].label)
check("结转批次到期 2026-03-31", annual.lots[0].expiresOn === "2026-03-31", annual.lots[0].expiresOn)

const unlimited = setup(
  [["日期", "date"], ["类别", "select", ["年假"]], ["时长", "number"]],
  [["2025-06-01"]],
  {},
)
unlimited.rows[0].values[unlimited.pick("类别").id] = unlimited.pick("类别").options[0].id
unlimited.rows[0].values[unlimited.pick("时长").id] = -3
unlimited.block.policies = {
  [unlimited.pick("类别").options[0].id]: policy({ unit: "day", reset: "calendar", autoGrant: true, accrual: "fixed", fixedDays: 10, carryOverMax: null, carryOverDeadline: "03-31", prorate: false }),
}
const unlimitedPool = worktimeReport(unlimited.rows, unlimited.roles, unlimited.block, "2026-02-01").pools[0]
check("不限结转：去年剩 7 全带过来", unlimitedPool.carryIn === 7, String(unlimitedPool.carryIn))
check("不限结转：余额 17", unlimitedPool.available === 17, String(unlimitedPool.available))
check("不限结转：没有作废", unlimitedPool.expired === 0, String(unlimitedPool.expired))

const noGrant = setup(
  [["日期", "date"], ["类别", "select", ["事假"]], ["时长", "number"]],
  [["2026-03-01"]],
  {},
)
noGrant.rows[0].values[noGrant.pick("类别").id] = noGrant.pick("类别").options[0].id
noGrant.rows[0].values[noGrant.pick("时长").id] = -2
noGrant.block.policies = { [noGrant.pick("类别").options[0].id]: policy({ unit: "day" }) }
const owed = worktimeReport(noGrant.rows, noGrant.roles, noGrant.block, "2026-10-26").pools[0]
check("没有额度的池：余额为负（超支 2 天）", owed.available === -2, String(owed.available))
check("超支也记进已用", owed.used === 2, String(owed.used))

// ---------- 六、多人、状态与提醒 ----------

note("多人、状态与提醒")

const multi = setup(
  [["日期", "date"], ["人员", "text"], ["类别", "select", ["调休"]], ["时长", "number"]],
  [["2026-05-01", "甲"], ["2026-05-02", "乙"]],
  {},
)
multi.rows[0].values[multi.pick("类别").id] = multi.pick("类别").options[0].id
multi.rows[0].values[multi.pick("时长").id] = 8
multi.rows[1].values[multi.pick("类别").id] = multi.pick("类别").options[0].id
multi.rows[1].values[multi.pick("时长").id] = 4
multi.block.policies = { [multi.pick("类别").options[0].id]: policy({ unit: "hour" }) }
const multiReport = worktimeReport(multi.rows, multi.roles, multi.block, "2026-10-26")
check("两人各一个池", multiReport.pools.length === 2, String(multiReport.pools.length))
check("人员按首现序", multiReport.persons.join(",") === "甲,乙", multiReport.persons.join(","))
check("甲的余额 8", multiReport.pools.find((pool) => pool.person === "甲").available === 8)
check("乙的余额 4", multiReport.pools.find((pool) => pool.person === "乙").available === 4)

const statusTable = setup(
  [["日期", "date"], ["类别", "select", ["调休"]], ["时长", "number"], ["状态", "select", ["待审", "已通过"]]],
  [["2026-05-01"], ["2026-05-02"]],
  {},
)
const statusKind = statusTable.pick("类别").options[0].id
statusTable.rows[0].values[statusTable.pick("类别").id] = statusKind
statusTable.rows[0].values[statusTable.pick("时长").id] = -3
statusTable.rows[0].values[statusTable.pick("状态").id] = optionId(statusTable.pick("状态"), "待审")
statusTable.rows[1].values[statusTable.pick("类别").id] = statusKind
statusTable.rows[1].values[statusTable.pick("时长").id] = -1
statusTable.rows[1].values[statusTable.pick("状态").id] = optionId(statusTable.pick("状态"), "已通过")
statusTable.block.policies = { [statusKind]: policy({ unit: "hour" }) }
const approvedOnly = worktimeReport(statusTable.rows, statusTable.roles, statusTable.block, "2026-10-26").pools[0]
statusTable.block.statusValue = optionId(statusTable.pick("状态"), "已通过")
const approvedFiltered = worktimeReport(statusTable.rows, statusTable.roles, statusTable.block, "2026-10-26").pools[0]
check("不过滤时用了 4 小时", approvedOnly.used === 4, String(approvedOnly.used))
check("只统计已通过时用了 1 小时", approvedFiltered.used === 1, String(approvedFiltered.used))
check("被过滤掉的行不进余额", approvedFiltered.available === -1, String(approvedFiltered.available))

const soonTable = setup(
  [["日期", "date"], ["类别", "select", ["调休"]], ["时长", "number"]],
  [["2026-10-01"]],
  {},
)
soonTable.rows[0].values[soonTable.pick("类别").id] = soonTable.pick("类别").options[0].id
soonTable.rows[0].values[soonTable.pick("时长").id] = 4
soonTable.block.policies = { [soonTable.pick("类别").options[0].id]: policy({ unit: "hour", validityMonths: 1 }) }
soonTable.block.soonDays = 30
const soonPool = worktimeReport(soonTable.rows, soonTable.roles, soonTable.block, "2026-10-20").pools[0]
check("30 天内到期算进提醒", soonPool.soon === 4 && soonPool.soonOn === "2026-11-01", `${soonPool.soon} / ${soonPool.soonOn}`)

// ---------- 七、格式化与规则序列化 ----------

note("格式化与规则序列化")

check("formatQuantity 去尾零", formatQuantity(3.5) === "3.5" && formatQuantity(12) === "12" && formatQuantity(-0) === "0",
  `${formatQuantity(3.5)} / ${formatQuantity(12)} / ${formatQuantity(-0)}`)

const encoded = encodeWorktimePolicies({ [annualOption]: annualTable.block.policies[annualOption] })
const decoded = decodeWorktimePolicies(encoded)
check("规则 JSON 往返：发放与结转", decoded[annualOption].fixedDays === 10 && decoded[annualOption].carryOverMax === 5 && decoded[annualOption].carryOverDeadline === "03-31",
  JSON.stringify(decoded[annualOption]))
check("规则 JSON 往返：重置与自动发放", decoded[annualOption].reset === "calendar" && decoded[annualOption].autoGrant === true)
check("规则 JSON 往返：阶梯", Array.isArray(decoded[annualOption].tiers) && decoded[annualOption].tiers.length === 3)
check("坏 JSON 宽容落空", Object.keys(decodeWorktimePolicies("{oops")).length === 0)
check("缺字段按缺省兜底", decodeWorktimePolicies('{"a":{"unit":"day"}}').a.reset === "none")
check("空串编码为空串", encodeWorktimePolicies({}) === "")

const fallback = worktimePolicy(createWorktimeBlock("x.tbl"), "nope")
check("没有规则的池按缺省（不重置、不自动发）", fallback.reset === "none" && fallback.autoGrant === false)

// ---------- 八、快照 + 指针往返 ----------

note("快照 + 指针往返")

const roundTable = setup(
  [["日期", "date"], ["人员", "text"], ["类别", "select", ["年假", "调休"]], ["时长", "number"], ["事由", "text"]],
  [["2026-01-01", "熊飞"], ["2026-10-20", "熊飞"]],
  {},
)
const annualId = roundTable.pick("类别").options[0].id
const compId = roundTable.pick("类别").options[1].id
roundTable.rows[0].values[roundTable.pick("类别").id] = annualId
roundTable.rows[0].values[roundTable.pick("时长").id] = 10
roundTable.rows[0].values[roundTable.pick("事由").id] = "年度额度"
roundTable.rows[1].values[roundTable.pick("类别").id] = compId
roundTable.rows[1].values[roundTable.pick("时长").id] = 3
roundTable.rows[1].values[roundTable.pick("事由").id] = "版本发布值守"
roundTable.block.policies = {
  [annualId]: policy({ unit: "day", reset: "calendar", autoGrant: true, accrual: "seniority", carryOverMax: 5, carryOverDeadline: "03-31" }),
  [compId]: policy({ unit: "hour", validityMonths: 3 }),
}
roundTable.block.showLots = true
roundTable.block.soonDays = 45

const lookup = (path) => (path === "考勤.tbl" ? roundTable.table : null)
const html = blocksToHtml([roundTable.block], lookup)
check("快照带指针", html.includes('data-worktime="考勤.tbl"'), html.slice(0, 160))
check("快照带列映射", html.includes('data-date="' + roundTable.pick("日期").id + '"'))
check("快照带规则 JSON", html.includes("data-policies="))
check("快照带批次开关", html.includes('data-lots="true"'))

/**
 * 育儿假：04-01 起算（= 每年三月底重置）、2025-04-01 开始、每年 5 天、一共三年。
 * 「一共三年」= 发 3 期，超出之后既不发放也不结转。
 */
const parentalPatch = {
  unit: "day",
  reset: "fiscal",
  resetMonthDay: "04-01",
  autoGrant: true,
  accrual: "fixed",
  fixedDays: 5,
  carryOverMax: 0,
  grantFrom: "2025-04-01",
  periodLimit: 3,
  prorate: false,
}

/** 一个只带「育儿假」一个选项的池。`rows` 是 [日期, 时长] 列表，类别自动补齐。 */
function parentalTable(rows) {
  const built = setup(
    [["日期", "date"], ["类别", "select", ["育儿假"]], ["时长", "number"]],
    rows.map((row) => [row[0]]),
    {},
  )
  const option = built.pick("类别").options[0].id
  built.rows.forEach((row, index) => {
    row.values[built.pick("类别").id] = option
    row.values[built.pick("时长").id] = rows[index][1]
  })
  built.block.policies = { [option]: policy(parentalPatch) }
  return built
}

const reportAt = (built, today) => worktimeReport(built.rows, built.roles, built.block, today).pools[0]

// 表里一条记录都没有：起算日仍然把 2025 那一期发出来。
const parentalEmpty = parentalTable([])
const pNow = reportAt(parentalEmpty, "2026-10-26")
check("无记录也按起算日发到今年：可用 5", pNow.available === 5, String(pNow.available))
check("本期应享 5", pNow.granted === 5, String(pNow.granted))

// ---------- 十二、扣减链（对齐 worktime-tracker） ----------

note("扣减链")

/**
 * 把 worktime-tracker 的硬规则压成一条链:
 *
 * - 加班:小时,记录月的**次月底**失效(`validityMonths: 1` + `monthEnd`),最新优先扣。
 * - 年假:天,财年 04-01 起、每期 5 天、不结转。
 * - 育儿假:天,财年 04-01 起、每期 5 天、共 3 期(从出生所在财年算)。
 * - 调休:小时,自己不发放额度,只负责被扣。
 *
 * 链序 = 加班 → 年假 → 育儿假,这就是 tracker 的扣减优先级。
 */
const trackerDefs = [["日期", "date"], ["类别", "select", ["加班", "年假", "育儿假", "调休"]], ["时长", "number"]]

function trackerTable(entries) {
  const built = setup(trackerDefs, entries.map((entry) => [entry[0], null, entry[2]]), {})
  const kind = built.pick("类别")
  built.rows.forEach((row, index) => {
    row.values[kind.id] = optionId(kind, entries[index][1])
  })
  const id = (name) => optionId(kind, name)
  built.block.policies = {
    [id("加班")]: policy({ unit: "hour", validityMonths: 1, expiryAlign: "monthEnd", consume: "latest", scope: "chain", chain: "调休", chainOrder: 0 }),
    [id("年假")]: policy({ unit: "day", reset: "fiscal", resetMonthDay: "04-01", autoGrant: true, fixedDays: 5,
      carryOverMax: 0, grantFrom: "2025-04-01", prorate: false, scope: "chain", chain: "调休", chainOrder: 1 }),
    [id("育儿假")]: policy({ unit: "day", reset: "fiscal", resetMonthDay: "04-01", autoGrant: true, fixedDays: 5,
      carryOverMax: 0, periodLimit: 3, grantFrom: "2024-04-01", prorate: false, scope: "chain", chain: "调休", chainOrder: 2 }),
    [id("调休")]: policy({ unit: "hour", scope: "chain", chain: "调休", chainOrder: 9 }),
  }
  return built
}

const chainTable = trackerTable([
  ["2026-01-15", "加班", 8],
  ["2026-02-10", "加班", 4],
  ["2026-02-20", "调休", -6],
  ["2026-03-15", "调休", -10],
])

// tracker 侧同一份数据:加班按「最新优先、只能吃当天及之前且未过期」摊派,

const overtimePool = chainPool("加班")

    overtimePool.lots.some((lot) => lot.date === "2026-01-15" && lot.used === 2),
  JSON.stringify(overtimePool?.lots.map((lot) => `${lot.date}:${lot.used}/${lot.amount}`)))
check("加班：今天余额 0（1-15 剩的 6h 在 2-28 已过期）", overtimePool?.available === 0, String(overtimePool?.available))
check("加班：作废 6h（2-28 到期时剩的那笔）", overtimePool?.expired === 6, String(overtimePool?.expired))

const annualPool = chainPool("年假")
check("年假：3-15 的 10h 从 2025 财年额度扣（剩 3.75 天已作废）",
  annualPool !== undefined && annualPool.expired === 3.75, String(annualPool?.expired))
check("年假：本期可用 5 天（2026 财年未动）", annualPool?.available === 5, String(annualPool?.available))

const parentalPool = chainPool("育儿假")
check("育儿假：本期可用 5 天", parentalPool?.available === 5, String(parentalPool?.available))

const chain = chainReport.chains[0]
check("链只有一条", chainReport.chains.length === 1, String(chainReport.chains.length))
check("链合计 = 加班 0 + 年假 40h + 育儿假 40h", chain?.available === 80, String(chain?.available))
check("链上成员按 chainOrder 排（加班最先、调休最后）",
  chain !== undefined && chain.members.every((key) => key !== ""),
  String(chain?.members.length))
check("调休池自己没有额度：可用 0、已用 16h",
  chainPool("调休")?.available === 0 && chainPool("调休")?.used === 16,
  `${chainPool("调休")?.available} / ${chainPool("调休")?.used}`)

// 每一行的拆分:3-15 那笔只能落到年假——加班在 3 月已经过期。
const rowOf = (index) => chainReport.rows.get(chainTable.rows[index].id)
const splitOf = (index) => (rowOf(index)?.draws ?? []).map((draw) => `${draw.poolKey.split("\u0000")[1]}:${formatQuantity(draw.amount)}`).join(",")
check("2-20 那笔全落在加班池（6 小时）",
  rowOf(2)?.draws.length === 1 && rowOf(2)?.draws[0].amount === 6, splitOf(2))
check("3-15 那笔全落在年假池（1.25 天）",
  rowOf(3)?.draws.length === 1 && Math.abs((rowOf(3)?.draws[0].amount ?? 0) - 1.25) < 1e-9, splitOf(3))
check("3-15 那笔的链合计 = 0 + 30 + 40", rowOf(3)?.chainBalance === 70, String(rowOf(3)?.chainBalance))

// 时间轴:4 月的一笔调休不能吃到 5 月才记的加班。
const timelineTable = trackerTable([
  ["2026-05-10", "加班", 8],
  ["2026-04-10", "调休", -4],
])
const timelineReport = worktimeReport(timelineTable.rows, timelineTable.roles, timelineTable.block, "2026-05-20")
const timelinePool = (name) => timelineReport.pools.find((pool) => pool.name === name)

check("那一笔改从年假扣：4.5 天", timelinePool("年假")?.available === 4.5, String(timelinePool("年假")?.available))

// 一次性额度 + 只标记不过期(陪产假口径)。额度只由规则发,表里只有使用。
const paternityBuilt = setup(

check("过了期也只标记:余额 10 天", paternityPool?.available === 10, String(paternityPool?.available))
check("过了期不作废", paternityPool?.expired === 0, String(paternityPool?.expired))
