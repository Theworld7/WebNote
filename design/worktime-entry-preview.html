<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工时「记一笔」表单预览</title>
<style>
  body { margin: 0; padding: 16px; background: #f6f6f7; font: 13px/1.6 -apple-system, "PingFang SC", sans-serif; }
  #out { margin: 0; color: #6b6b70; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<pre id="out">打开表单…</pre>
<div id="app"></div>
<script type="module">
import { createApp, defineComponent, h, ref } from "vue"
import "../src/style.css"
import WorktimeEntryDialog from "../src/components/WorktimeEntryDialog.vue"
import { createOptionId, emptyColumn } from "../src/lib/data-table.ts"
import { DATA_TABLE_VERSION } from "../src/types/data-table.ts"
import { createWorktimeBlock } from "../src/lib/blocks.ts"
import { WORKTIME_POLICY_DEFAULT } from "../src/lib/worktime.ts"

const date = emptyColumn("日期", "date")
const person = emptyColumn("人员")
const kind = emptyColumn("类别", "select")
const amount = emptyColumn("时长", "number")
const note = emptyColumn("事由")
const hire = emptyColumn("入职日期", "date")
const status = emptyColumn("状态", "select")

const annual = createOptionId()
const comp = createOptionId()
const overtime = createOptionId()
const parental = createOptionId()
const personal = createOptionId()
kind.options.push(
  { id: annual, name: "年假" },
  { id: comp, name: "调休" },
  { id: overtime, name: "加班" },
  { id: parental, name: "育儿假" },
  { id: personal, name: "事假" },
)
status.options.push({ id: createOptionId(), name: "已批准" })

const columns = [date, person, kind, amount, note, hire, status]

let seq = 0
const row = (dateValue, personValue, kindId, hours, why) => {
  seq += 1
  return {
    id: `r${seq}`,
    values: {
      [date.id]: dateValue,
      [person.id]: personValue,
      [kind.id]: kindId,
      [amount.id]: hours,
      [note.id]: why,
      [hire.id]: "2016-05-01",
      [status.id]: null,
    },
  }
}

const rows = [
  row("2026-09-20", "熊飞", annual, 3.75, "年假额度"),
  row("2026-10-01", "熊飞", personal, 5, "事假额度（自成一池）"),
  row("2026-10-08", "熊飞", overtime, 5, "版本发布值守"),
  row("2026-10-20", "熊飞", overtime, 3, "线上排查"),
]

const policy = (patch) => ({ ...WORKTIME_POLICY_DEFAULT, tiers: WORKTIME_POLICY_DEFAULT.tiers.map((tier) => ({ ...tier })), ...patch })

const block = createWorktimeBlock(
  "考勤.tbl",
  { date: date.id, person: person.id, kind: kind.id, amount: amount.id, note: note.id, hire: hire.id, status: status.id },
  {
    [overtime]: policy({ unit: "hour", validityMonths: 1, expiryAlign: "monthEnd", consume: "latest", scope: "chain", chain: "调休", chainOrder: 0 }),
    [annual]: policy({ unit: "day", reset: "fiscal", resetMonthDay: "04-01", autoGrant: true, fixedDays: 5, carryOverMax: 0, scope: "chain", chain: "调休", chainOrder: 1 }),
    [parental]: policy({ unit: "day", reset: "fiscal", resetMonthDay: "04-01", autoGrant: true, fixedDays: 10, carryOverMax: 0, scope: "chain", chain: "调休", chainOrder: 2 }),
    [comp]: policy({ unit: "hour", scope: "chain", chain: "调休", chainOrder: 9 }),
    [personal]: policy({ unit: "day", autoGrant: false }),
  },
)
block.statusValue = ""

const App = defineComponent({
  setup() {
    const open = ref(true)
    const submitted = ref("")
    return () => [
      h("div", { style: "margin-bottom:12px;display:flex;gap:8px" }, [
        h("button", { type: "button", onClick: () => { open.value = true } }, "重新打开"),
        h("span", { style: "color:#6b6b70;font-size:12px" }, "用掉 2 天年假 → 看底部预览与提交值"),
      ]),
      h(WorktimeEntryDialog, {
        open: open.value,
        block,
        columns,
        rows,
        today: "2026-10-26",
        onClose: () => { open.value = false },
        onSubmit: (values) => {
          submitted.value = JSON.stringify(values, null, 1)
          document.getElementById("out").textContent = `提交值:\n${submitted.value}`
          open.value = false
        },
      }),
    ]
  },
})

createApp(App).mount("#app")
document.getElementById("out").textContent = "表单已打开 —— 试填「类别 → 年假、用掉 2」，看底部预览与提交值"
</script>
</body>
</html>
