[package]
name = "webnote"
version = "0.14.0"
description = "玉简 —— 本地优先的块式笔记编辑器"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "webnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# WebDAV 传输：WebView 里发不了 PROPFIND（跨域预检过不去），只能从原生这层发。
# rustls 而不是系统 TLS：证书根内置，三个平台行为一致，也不依赖 OpenSSL。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
fontdb = "0.24.0"

# macOS 的窗口圆角得跟 AppKit 说话：圆角是「标题栏」的一部分，只有带标题栏的窗口才画得到。
# Windows 那边由 DWM 自己画，不需要这一层（见 `src/lib.rs` 的 `macos_frame`）。
# 只开用得上的几个类 —— 默认特性会把整个 AppKit 都拉进来。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSResponder",
    "NSView",
    "NSWindow",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
