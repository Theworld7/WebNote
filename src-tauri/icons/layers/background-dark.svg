<?xml version="1.0" encoding="UTF-8"?>
<!--
  WebNote 应用图标 · background 层 · Icon Composer · 深色
  几何：1024 画布全出血 / 超椭圆 |x|^5+|y|^5=(512)^5
  真源：design/icon/icon.tokens.json · 生成：node design/icon/icon.mjs
  不要手改这个文件。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"
     viewBox="0 0 1024 1024" role="img" aria-label="WebNote">
  <title>WebNote</title>
  <!-- L1 背景（Icon Composer 版）：正方形全出血、不透明、只有渐变。
       圆角遮罩 / 镜面高光 / 光晕 / 暗角全部交给系统，这里画了就会和 Liquid Glass 叠加。 -->
  <g id="wn-background-background">
    <defs>
      <linearGradient id="wn-bg" x1="0.06" y1="0" x2="0.94" y2="1">
        <stop offset="0" stop-color="rgb(21 43 87)"/>
        <stop offset="0.52" stop-color="rgb(11 23 48)"/>
        <stop offset="1" stop-color="rgb(4 7 15)"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="1024" height="1024" fill="url(#wn-bg)"/>
  </g>
</svg>
